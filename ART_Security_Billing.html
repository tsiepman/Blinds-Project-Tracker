<html lang="en">

<title>ART — Security Billing</title>
<link rel="stylesheet" href="art-theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40; }
  .mark { background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 3px 7px; border-radius: 5px; }
  .hname { font-size: 14px; font-weight: 600; }
  .hname span { color: var(--text3); font-weight: 400; }
  .spacer { margin-left: auto; }
  .sp-status { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; display: none; }
  .sp-status.connected { display: inline; background: var(--green-dim); color: var(--green); }
  .sp-status.error { display: inline; background: var(--red-dim); color: var(--red); }
  .sp-status.loading { display: inline; background: var(--accent-dim); color: var(--accent); }
  .art-back { font-size: 12.5px; color: var(--text3); text-decoration: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 11px; }
  .art-back:hover { border-color: var(--accent); color: var(--accent); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }
  h1.page { font-size: 22px; font-weight: 700; margin-bottom: 4px; }

  .controls { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
  label.fld { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 5px; font-weight: 600; }
  select, input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 9px 11px; font-size: 14px; font-family: inherit; }
  textarea { width: 100%; resize: vertical; }

  .secret-wrap { display: flex; gap: 6px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; max-width: 400px; text-align: center; }
  .card h2 { font-size: 20px; margin-bottom: 8px; }
  .card p { color: var(--text2); font-size: 13px; line-height: 1.6; margin-bottom: 20px; }

  /* ── account detail drawer ── */

  .drawer { background: var(--bg); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 20px 20px 60px; border-left: 1px solid var(--border); }
  .drawer-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; }

  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-bottom: 16px; }
  .fgrid .full { grid-column: 1 / -1; }
  .fgrid label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text3); margin-bottom: 4px; font-weight: 600; }
  .fgrid input, .fgrid select { width: 100%; }
  .sec-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); font-weight: 700; margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--border); }
  .sec-h:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .hist-row:first-of-type { border-top: none; }

    .row { flex-wrap: wrap; }
    .r-amt { text-align: left; min-width: 0; }
    .fgrid { grid-template-columns: 1fr; }
    .drawer { width: 100%; }
  }
</style>

<body>

<div class="header">
  <span class="mark">ART</span><span class="hname">Security Billing <span>customer monitoring accounts</span></span>
  <span id="spStatus" class="sp-status"></span>
  <span class="spacer"></span>
  <a class="art-back" href="index.html">← All tools</a>
</div>

<div id="app"></div>

<script>
/* ============================================================
   ART Security Billing
   The register of monitored-security customers: who they are, what they
   pay, when it's due, and whether it went through.

   Built to sit next to the monitoring station relationship, not replace
   it -- the station carries the actual monitoring. This tool is the
   billing side: it doesn't care whether that's SecurTek, Ajax's monitoring
   partner, or anyone else. Change stations and only the account's
   "Station" field moves.

   Payment collection (Stripe) is a second pass -- see the comment on
   the Store object below. Until then this is a register plus a manual
   chase queue: it tells you who owes what and how overdue they are, it
   doesn't move money.
   ============================================================ */

const TENANT_ID = '2e6ff905-d709-43db-94a5-c11d318118ee';
const CLIENT_ID = '7b0d92bf-6e34-497e-9938-7860ba268631';
const SITE_HOSTNAME = 'advanceelectronics.sharepoint.com';
const SITE_PATH = '/sites/ART43';
const SCOPES = ['https://graph.microsoft.com/Sites.ReadWrite.All', 'offline_access'];
const LIST = { accounts: 'SecurityAccounts', payments: 'SecurityPayments' };

let msal_ = null, siteId = null, listIds = {};
let accounts = [], payments = [], usingSample = false;
let view = (() => { try { return localStorage.getItem('secbill.view') || 'chase'; } catch { return 'chase'; } })();
let search = '', statusFilter = 'active', stationFilter = 'all';
let openId = null;      // account currently shown in the drawer, or null
let importOpen = false, importText = '', importParsed = null, importProgress = null;
let importError = '';
let alarmOpen = false;   // the alarm-info form inside the drawer
// Which code fields are currently revealed. Deliberately not remembered anywhere: closing
// the account, or reopening the page, hides them again.
let shownSecrets = new Set();
let editBuf = null;     // a copy of the open account's fields, edited in the drawer
let busy = false;

/* ---------- auth / graph ---------- */

async function init() {
  if (location.search.includes('demo')) { loadSample(); render(); return; }
  msal_ = new msal.PublicClientApplication({
    auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: location.href.split('?')[0].split('#')[0] },
    cache: { cacheLocation: 'localStorage' }
  });
  await msal_.initialize();
  await msal_.handleRedirectPromise();
  if (!msal_.getAllAccounts().length) { renderSignIn(); return; }
  await load();
}
function signIn() { msal_.loginRedirect({ scopes: SCOPES }); }

async function token() {
  const a = msal_.getAllAccounts();
  if (!a.length) return null;
  try { return (await msal_.acquireTokenSilent({ scopes: SCOPES, account: a[0] })).accessToken; }
  catch { await msal_.acquireTokenRedirect({ scopes: SCOPES, account: a[0] }); return null; }
}
async function graph(method, path, body) {
  const t = await token();
  if (!t) return null;
  const res = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method,
    headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly' },
    ...(body ? { body: JSON.stringify(body) } : {})
  });
  if (!res.ok) throw new Error(method + ' ' + path + ' -> ' + res.status);
  return res.status === 204 ? null : res.json();
}
async function listId(name) {
  if (listIds[name]) return listIds[name];
  if (!siteId) siteId = (await graph('GET', '/sites/' + SITE_HOSTNAME + ':' + SITE_PATH)).id;
  listIds[name] = (await graph('GET', '/sites/' + siteId + '/lists/' + name)).id;
  return listIds[name];
}
async function items(name) {
  const lid = await listId(name);
  const out = [];
  let url = '/sites/' + siteId + '/lists/' + lid + '/items?expand=fields&$top=999';
  for (;;) {
    const d = await graph('GET', url);
    if (!d) return out;
    out.push(...(d.value || []));
    if (!d['@odata.nextLink']) break;
    url = d['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0', '');
  }
  return out;
}
function setStatus(cls, txt) { const e = document.getElementById('spStatus'); e.className = 'sp-status ' + cls; e.textContent = txt; }

async function load() {
  setStatus('loading', 'Loading…');
  try {
    const [ac, pay] = await Promise.all([
      items(LIST.accounts),
      items(LIST.payments).catch(() => [])
    ]);
    accounts = ac.map(i => ({ itemId: i.id, ...(i.fields || {}) }));
    payments = pay.map(i => ({ itemId: i.id, ...(i.fields || {}) }));
    usingSample = false;
    if (!accounts.length) loadSample();
    setStatus('connected', 'SharePoint');
  } catch (e) {
    setStatus('error', 'Error');
    console.error(e);
    if (!accounts.length) loadSample();
  }
  render();
}

/* ---------- dates ---------- */

function parseD(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dayDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function today() { return iso(new Date()); }
function money(n) { return '$' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(s) { return s ? parseD(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }

/* ---------- shaping ---------- */

/* Not everyone is monthly. In the SecurTek book, $21/month, $63/quarter and $252/year are
   the same service billed on different cycles -- 116 monthly, 10 quarterly, 13 annual.
   Treating them all as monthly overstates the book twelvefold on an annual account and
   makes it read as overdue for the eleven months it is legitimately not due. */
const FREQ = { monthly: 1, quarterly: 3, annual: 12 };
const FREQ_LABEL = { monthly: '/mo', quarterly: '/qtr', annual: '/yr' };

function freqOf(a) {
  const f = String(a.BillingFrequency || 'monthly').toLowerCase();
  return FREQ[f] ? f : 'monthly';
}

/* The cycle currently in effect and the next one, walked forward from the last cycle we
   know was settled. LastPaidCycle is the anchor: it carries which MONTHS a quarterly or
   annual account actually falls due in, so no separate anchor column is needed. */
function cycleDates(a) {
  const step = FREQ[freqOf(a)];
  const day = Number(a.BillDay) || 1;
  const paid = a.LastPaidCycle ? parseD(a.LastPaidCycle) : null;
  const start = a.StartDate ? parseD(a.StartDate) : null;
  const base = paid || start;
  const now = new Date(); now.setHours(0, 0, 0, 0);

  if (!base) {
    // Nothing to anchor on -- fall back to this month's bill day.
    const thisOne = new Date(now.getFullYear(), now.getMonth(), day);
    const last = thisOne > now ? new Date(now.getFullYear(), now.getMonth() - step, day) : thisOne;
    return { last: iso(last), next: iso(new Date(last.getFullYear(), last.getMonth() + step, day)), step };
  }

  let last = new Date(base.getFullYear(), base.getMonth(), day);
  // A paid cycle means the next one falls a full step later; a start date is itself the
  // first cycle due.
  let next = new Date(base.getFullYear(), base.getMonth() + (paid ? step : 0), day);
  while (next <= now) { last = new Date(next); next = new Date(next.getFullYear(), next.getMonth() + step, day); }
  return { last: iso(last), next: iso(next), step };
}

function shape(a) {
  const status = (a.Status || 'active').toLowerCase();
  // MonthlyRate is the SharePoint column name, but it holds the amount charged per
  // BILLING CYCLE -- $252 on an annual account, not $252 a month. perMonth below is the
  // normalised figure, and it is what the book value is totalled on.
  const rate = Number(a.MonthlyRate) || 0;
  const freq = freqOf(a);
  const perMonth = rate / FREQ[freq];
  const owed = Number(a.Balance) || 0;
  const { last, next } = cycleDates(a);
  const lastResult = String(a.LastResult || '').toLowerCase();   // paid / declined / expired / manual / ''
  const lastAt = a.LastAttemptAt || '';
  const daysSinceCycle = dayDiff(last, today());
  // "behind" means the most recent cycle has passed and it wasn't marked paid --
  // whether that's a real decline or just not yet run through, it needs a look.
  const behind = status === 'active' && daysSinceCycle >= 0 && lastResult !== 'paid' &&
    (!a.LastPaidCycle || a.LastPaidCycle < last);

  /* Measured from the FIRST cycle they missed, not the most recent one -- otherwise
     someone three months gone reads the same "6 days" as someone who missed yesterday,
     and the chase queue sorts them as equally urgent. */
  let daysBehind = 0, cyclesBehind = 0;
  if (behind) {
    const step = FREQ[freq];
    let cursor = a.LastPaidCycle ? parseD(a.LastPaidCycle) : parseD(last);
    if (a.LastPaidCycle) cursor = new Date(cursor.getFullYear(), cursor.getMonth() + step, cursor.getDate());
    const now = parseD(today());
    const firstMissed = iso(cursor);
    while (cursor <= now) { cyclesBehind++; cursor = new Date(cursor.getFullYear(), cursor.getMonth() + step, cursor.getDate()); }
    daysBehind = Math.max(0, dayDiff(firstMissed, today()));
  }
  return {
    id: a.itemId, accountId: a.AccountId || '', name: a.CustomerName || '', address: a.Address || '',
    phone: a.Phone || '', email: a.Email || '',
    station: a.Station || '', stationAccountId: a.StationAccountId || '', panel: a.Panel || '',
    rate, freq, perMonth, freqLabel: FREQ_LABEL[freq],
    method: a.PaymentMethod || '',
    gst: !!a.Gst, pst: !!a.Pst,
    billDay: Number(a.BillDay) || 1, status,
    startDate: a.StartDate || '', cancelDate: a.CancelDate || '', cancelReason: a.CancelReason || '',
    owed, lastResult, lastAt, lastPaidCycle: a.LastPaidCycle || '',
    note: a.Note || '',
    cycleLast: last, cycleNext: next, behind,
    daysBehind, cyclesBehind,
  };
}

function history(accountId) {
  return payments.filter(p => p.AccountId === accountId)
    .sort((a, b) => String(b.At || '').localeCompare(String(a.At || '')));
}

/* ---------- render: sign in ---------- */

function renderSignIn() {
  document.getElementById('app').innerHTML =
    '<div class="centre"><div class="card"><h2>ART Security Billing</h2>' +
    '<p>Sign in with your Advance Electronics account.</p>' +
    '<button class="btn" onclick="signIn()">Sign in with Microsoft</button></div></div>';
}

/* ---------- render: main ---------- */

function statusTag(v) {
  if (v.status === 'cancelled') return '<span class="tag t-grey">cancelled</span>';
  if (v.status === 'suspended') return '<span class="tag t-grey">suspended</span>';
  if (v.owed > 0) return '<span class="tag ' + (v.daysBehind >= 30 ? 't-late' : 't-miss') + '">' + money(v.owed) + ' owing</span>' +
    (v.cyclesBehind > 1 ? '<div class="sub">' + v.cyclesBehind + ' cycles behind</div>' : '');
  if (v.behind) return '<span class="tag t-miss">' + (v.cyclesBehind > 1 ? v.cyclesBehind + ' cycles due' : 'not yet billed') + '</span>';
  return '<span class="tag t-ok">current</span>';
}

function rowHtml(v) {
  return '<div class="row" tabindex="0" role="button" onclick="openDrawer(\'' + v.id + '\')" ' +
    'onkeydown="if(event.key===\'Enter\'){openDrawer(\'' + v.id + '\')}">' +
    '<div class="r-main">' +
      '<div class="r-name">' + (v.accountId ? '<span class="num">' + esc(v.accountId) + '</span>' : '') + esc(v.name) + '</div>' +
      '<div class="r-sub">' + esc([v.address, v.station, v.panel, v.method].filter(Boolean).join(' · ')) + '</div>' +
    '</div>' +
    // The cycle has to be on the amount, or $252 reads as a monthly account.
    '<div class="r-amt"><b>' + money(v.rate) + '</b><span class="lbl">' + v.freqLabel + ' · day ' + v.billDay +
      (v.freq === 'monthly' ? '' : ' · ' + money(v.perMonth) + '/mo') + '</span></div>' +
    '<div class="r-amt">' + statusTag(v) + '</div>' +
  '</div>';
}

function render() {
  const all = accounts.map(shape);
  const q = search.trim().toLowerCase();
  const matches = v => !q || [v.name, v.accountId, v.address, v.station, v.stationAccountId].join(' ').toLowerCase().includes(q);

  const active = all.filter(v => v.status === 'active');
  const owingList = active.filter(v => v.owed > 0 || v.behind).filter(matches)
    .sort((a, b) => (b.owed - a.owed) || (b.daysBehind - a.daysBehind));
  const totalOwed = active.reduce((n, v) => n + v.owed, 0);
  // Normalised, so a $252 annual account contributes $21 and not $252.
  const monthlyBook = active.reduce((n, v) => n + v.perMonth, 0);

  const shown = view === 'chase' ? owingList
    : all.filter(v => statusFilter === 'all' || v.status === statusFilter)
        .filter(v => stationFilter === 'all' || (v.station || '(not set)') === stationFilter)
        .filter(matches)
        .sort((a, b) => a.name.localeCompare(b.name));

  // Every monitoring company actually in use, so the filter always matches what's real --
  // useful mainly for watching the SecurTek -> Lanvac migration move account by account.
  const stationCounts = new Map();
  for (const v of all) { const s = v.station || '(not set)'; stationCounts.set(s, (stationCounts.get(s) || 0) + 1); }

  const body = !shown.length
    ? '<div class="empty">' + (view === 'chase' ? 'Nothing owing — every active account is current.' : 'No accounts match.') + '</div>'
    : '<div class="group">' + shown.map(rowHtml).join('') + '</div>';

  document.getElementById('app').innerHTML =
    (usingSample ? '<div class="banner" style="text-align:center">Sample data — the SecurityAccounts list is empty or not yet created</div>' : '') +
    '<div class="wrap"><h1 class="page">Security Billing</h1>' +
    '<p class="page-sub">Monitored-security customers: who they are, what they pay, and who\'s behind.</p>' +
    '<div class="controls">' +
      '<div><label class="fld">View</label><div class="seg" role="tablist">' +
        '<button role="tab" aria-selected="' + (view === 'chase') + '" class="' + (view === 'chase' ? 'on' : '') + '" onclick="setView(\'chase\')">Chase queue</button>' +
        '<button role="tab" aria-selected="' + (view === 'all') + '" class="' + (view === 'all' ? 'on' : '') + '" onclick="setView(\'all\')">All accounts</button>' +
      '</div></div>' +
      (view === 'all' ? '<div><label class="fld">Status</label><select onchange="setStatusFilter(this.value)">' +
        ['active', 'suspended', 'cancelled', 'all'].map(s => '<option value="' + s + '"' + (s === statusFilter ? ' selected' : '') + '>' + s[0].toUpperCase() + s.slice(1) + '</option>').join('') +
      '</select></div>' : '') +
      (view === 'all' && stationCounts.size ? '<div><label class="fld">Monitoring company</label><select onchange="setStationFilter(this.value)">' +
        '<option value="all"' + (stationFilter === 'all' ? ' selected' : '') + '>All (' + all.length + ')</option>' +
        [...stationCounts.entries()].sort((a, b) => b[1] - a[1]).map(([s, n]) =>
          '<option value="' + esc(s) + '"' + (s === stationFilter ? ' selected' : '') + '>' + esc(s) + ' (' + n + ')</option>').join('') +
      '</select></div>' : '') +
      '<div style="flex:1 1 220px"><label class="fld" for="q">Find</label><input id="q" style="width:100%" placeholder="Name, account #, address" value="' + esc(search) + '" oninput="setSearch(this.value)"></div>' +
      '<div style="display:flex;gap:6px">' +
        '<button class="btn btn-primary btn-sm" onclick="openDrawer(null)">+ New account</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="toggleImport()">Import SecurTek export</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="load()">Refresh</button>' +
      '</div>' +
    '</div>' +
    '<div class="totals">' +
      tot('', active.length, 'active accounts') +
      tot('good', money(monthlyBook), 'per month (all cycles)') +
      tot(totalOwed > 0 ? 'late' : 'good', money(totalOwed), 'owing right now') +
      tot(owingList.length ? 'miss' : 'good', owingList.length, 'need a look') +
    '</div>' + importPanel() + body +
    (openId !== null || openId === '' ? drawerHtml() : '') +
    '</div>';
}

function tot(cls, n, label) { return '<div class="tot ' + cls + '"><div class="tot-n">' + n + '</div><div class="tot-l">' + label + '</div></div>'; }
function setView(v) { view = v; try { localStorage.setItem('secbill.view', v); } catch {} render(); }
function setStatusFilter(v) { statusFilter = v; render(); }
function setStationFilter(v) { stationFilter = v; render(); }
function setSearch(v) {
  search = v; render();
  const el = document.getElementById('q');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- drawer: account detail + edit + payment history ---------- */

function openDrawer(id) {
  const acc = id ? accounts.find(a => a.itemId === id) : null;
  editBuf = acc ? { ...acc } : {
    CustomerName: '', Address: '', Phone: '', Email: '', Station: '', StationAccountId: '', Panel: '',
    MonthlyRate: '', BillingFrequency: 'monthly', PaymentMethod: '', Gst: true, Pst: true,
    BillDay: '1', Status: 'active', StartDate: today(), Note: ''
  };
  openId = id || '';
  shownSecrets.clear();        // never carry a revealed code from one account to the next
  render();
  const el = document.getElementById('drawerName');
  if (el) el.focus();
}
function closeDrawer() { openId = null; editBuf = null; shownSecrets.clear(); render(); }
function setField(k, v) { editBuf[k] = v; }
// For the System/Station dropdowns: a normal pick just stores it; "Other" clears the field
// so the reveal-a-text-box logic in pickField treats it as a custom, not-yet-typed value.
// Re-renders (unlike setField) because picking from a <select> can't lose "focus" the way
// typing in a text box can, and the Other text box has to appear or disappear immediately.
function setPick(k, v) {
  if (v === '__other__') { editBuf['_other_' + k] = true; editBuf[k] = ''; }
  else { editBuf['_other_' + k] = false; editBuf[k] = v; }
  render();
}

function drawerHtml() {
  const isNew = !openId;
  const acc = isNew ? null : shape(accounts.find(a => a.itemId === openId));
  const hist = isNew ? [] : history(acc.accountId || openId);
  const b = editBuf;

  const field = (label, key, type = 'text', extra = '') =>
    '<div><label>' + label + '</label><input id="drawer' + key + '" type="' + type + '" value="' + esc(b[key] ?? '') + '" ' + extra +
    ' oninput="setField(\'' + key + '\',this.value)"></div>';

  // A dropdown of the known options, plus "Other" with a text box that appears only when
  // picked -- so the system type or monitoring company can be one of the couple of things
  // we actually deal with, without a closed list blocking something new that shows up
  // (a fifth panel brand, a monitoring company we haven't signed with yet).
  const pickField = (label, key, options) => {
    const cur = b[key] ?? '';
    // "Other" mode is its own flag rather than inferred from the value, because the value
    // while typing a custom entry can legitimately be empty (just cleared it) or can
    // happen to match nothing yet -- inferring from content alone would flicker the box.
    const otherOn = !!b['_other_' + key] || (cur && !options.includes(cur));
    return '<div><label>' + label + '</label><select oninput="setPick(\'' + key + '\',this.value)">' +
        '<option value=""' + (!cur && !otherOn ? ' selected' : '') + '>—</option>' +
        options.map(o => '<option value="' + esc(o) + '"' + (o === cur && !otherOn ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
        '<option value="__other__"' + (otherOn ? ' selected' : '') + '>Other…</option>' +
      '</select>' +
      (otherOn ? '<input style="margin-top:6px;width:100%" value="' + esc(cur) + '" placeholder="Type it in" oninput="setField(\'' + key + '\',this.value)">' : '') +
    '</div>';
  };

  return '<div class="overlay" onclick="if(event.target===this)closeDrawer()"><div class="drawer">' +
    '<div class="drawer-head"><h2>' + (isNew ? 'New account' : esc(acc.name)) + '</h2>' +
      '<button class="close-x" onclick="closeDrawer()">✕</button></div>' +

    '<div class="sec-h">Customer</div>' +
    '<div class="fgrid">' +
      '<div class="full">' + field('Name', 'CustomerName').replace('id="drawerCustomerName"', 'id="drawerName"') + '</div>' +
      '<div class="full">' + field('Address', 'Address') + '</div>' +
      field('Phone', 'Phone') + field('Email', 'Email', 'email') +
    '</div>' +

    '<div class="sec-h">Monitoring</div>' +
    '<div class="fgrid">' +
      // SecurTek is the incumbent; Lanvac is who Advance is moving to (Ajax-compatible).
      // Not every account moves at once, so this has to say which one THIS account is on.
      pickField('Monitoring company', 'Station', ['SecurTek', 'Lanvac']) +
      field('Station account #', 'StationAccountId') +
      pickField('System', 'Panel', ['DSC', 'ClareOne', 'First Alert', 'Ajax']) +
      '<div><label>Status</label><select oninput="setField(\'Status\',this.value)">' +
        ['active', 'suspended', 'cancelled'].map(s => '<option value="' + s + '"' + (s === (b.Status || 'active') ? ' selected' : '') + '>' + s[0].toUpperCase() + s.slice(1) + '</option>').join('') +
      '</select></div>' +
    '</div>' +

    '<div class="sec-h">Billing</div>' +
    '<div class="fgrid">' +
      field('Amount per cycle', 'MonthlyRate', 'number') +
      '<div><label>Billed</label><select oninput="setPick(\'BillingFrequency\',this.value)">' +
        ['monthly', 'quarterly', 'annual'].map(f => '<option value="' + f + '"' + (f === (b.BillingFrequency || 'monthly') ? ' selected' : '') + '>' + f[0].toUpperCase() + f.slice(1) + '</option>').join('') +
      '</select></div>' +
      pickField('How they pay', 'PaymentMethod', ['Credit card', 'Pre-authorized debit', 'Cheque', 'Manual']) +
      '<div><label>Bill day</label><select oninput="setField(\'BillDay\',this.value)">' +
        [1, 5, 10, 15, 20, 25].map(d => '<option value="' + d + '"' + (String(d) === String(b.BillDay || 1) ? ' selected' : '') + '>' + d + (d === 1 ? 'st' : d === 5 || d === 10 || d === 15 || d === 20 || d === 25 ? 'th' : '') + '</option>').join('') +
      '</select></div>' +
      '<div><label><input type="checkbox" ' + (b.Gst !== false ? 'checked' : '') + ' onchange="setField(\'Gst\',this.checked)" style="width:auto;vertical-align:middle;margin-right:6px">GST</label></div>' +
      '<div><label><input type="checkbox" ' + (b.Pst !== false ? 'checked' : '') + ' onchange="setField(\'Pst\',this.checked)" style="width:auto;vertical-align:middle;margin-right:6px">PST</label></div>' +
      '<div class="full">' + field('Start date', 'StartDate', 'date') + '</div>' +
    '</div>' +

    '<div class="sec-h">Note</div>' +
    '<textarea rows="2" oninput="setField(\'Note\',this.value)" placeholder="Anything worth knowing — gate code, callback preference, dispute history">' + esc(b.Note || '') + '</textarea>' +

    alarmSection() +

    (isNew ? '' :
      '<div class="sec-h">Standing</div>' +
      '<div class="fgrid">' +
        '<div><label>Balance owing</label><div style="padding:9px 0;font-weight:700;font-size:16px">' + money(acc.owed) + '</div></div>' +
        '<div><label>Billed ' + acc.freq + '</label><div style="padding:9px 0">due ' + fmtDate(acc.cycleLast) +
          '<div class="sm2">next ' + fmtDate(acc.cycleNext) + '</div></div></div>' +
      '</div>' +
      '<div class="drawer-actions">' +
        '<button class="btn btn-sm" onclick="recordPayment(\'' + openId + '\',\'paid\')">Mark this cycle paid</button>' +
        '<button class="btn btn-sm" onclick="recordPayment(\'' + openId + '\',\'declined\')">Mark declined</button>' +
        '<button class="btn btn-sm" onclick="adjustBalance(\'' + openId + '\')">Adjust balance…</button>' +
      '</div>' +

      '<div class="sec-h">Payment history</div>' +
      (hist.length ? hist.slice(0, 24).map(h =>
        '<div class="hist-row"><span>' + fmtDate((h.At || '').slice(0, 10)) + ' — ' +
          '<span class="tag ' + (h.Result === 'paid' ? 't-ok' : h.Result === 'declined' || h.Result === 'expired' ? 't-late' : 't-grey') + '">' + esc(h.Result || '') + '</span></span>' +
          '<span>' + money(h.Amount) + '</span></div>' +
          (h.Note ? '<div class="h-note">' + esc(h.Note) + '</div>' : '')
      ).join('') : '<p style="color:var(--text3);font-size:12.5px">No payments recorded yet.</p>')
    ) +

    '<div class="drawer-actions" style="margin-top:22px;border-top:1px solid var(--border);padding-top:16px">' +
      '<button class="btn btn-primary" ' + (busy ? 'disabled' : '') + ' onclick="saveAccount()">Save</button>' +
      (isNew ? '' : '<button class="btn btn-ghost" ' + (busy ? 'disabled' : '') + ' onclick="cancelAccount()">Cancel this account…</button>') +
    '</div>' +
  '</div></div>';
}

async function saveAccount() {
  if (busy) return;
  const b = editBuf;
  if (!String(b.CustomerName || '').trim()) { alert('Name is required.'); return; }
  busy = true; render();
  try {
    const fields = {
      CustomerName: b.CustomerName || '', Address: b.Address || '', Phone: b.Phone || '', Email: b.Email || '',
      Station: b.Station || '', StationAccountId: b.StationAccountId || '', Panel: b.Panel || '',
      MonthlyRate: String(Number(b.MonthlyRate) || 0), Gst: b.Gst !== false, Pst: b.Pst !== false,
      BillingFrequency: b.BillingFrequency || 'monthly', PaymentMethod: b.PaymentMethod || '',
      // The whole alarm form travels as one JSON blob -- far too many fields, and the zone
      // list is open-ended, so a column each was never going to work.
      AlarmInfoJson: JSON.stringify(b._alarm || alarmOf(b.AlarmInfoJson)),
      BillDay: String(Number(b.BillDay) || 1), Status: b.Status || 'active',
      StartDate: b.StartDate || today(), Note: b.Note || ''
    };
    if (!openId) {
      fields.AccountId = 'SB' + Date.now().toString(36).toUpperCase();
      fields.Title = fields.CustomerName;
      fields.Balance = '0';
      if (!usingSample) {
        const created = await graph('POST', '/sites/' + siteId + '/lists/' + (await listId(LIST.accounts)) + '/items', { fields });
        accounts.push({ itemId: created.id, ...fields });
      } else {
        accounts.push({ itemId: 's' + Date.now(), ...fields });
      }
      toast('✓ Account created');
    } else {
      fields.Title = fields.CustomerName;
      if (!usingSample) await graph('PATCH', '/sites/' + siteId + '/lists/' + (await listId(LIST.accounts)) + '/items/' + openId + '/fields', fields);
      const idx = accounts.findIndex(a => a.itemId === openId);
      if (idx >= 0) accounts[idx] = { ...accounts[idx], ...fields };
      toast('✓ Saved');
    }
    closeDrawer();
  } catch (e) { toast('Could not save: ' + e.message, true); }
  busy = false; render();
}

// A payment attempt: written to SecurityPayments and rolled into the account's running
// balance and LastResult/LastPaidCycle, which is what the chase queue actually reads --
// so the queue updates the moment this is recorded, not on the next full sync.
async function recordPayment(id, result) {
  if (busy) return;
  const acc = accounts.find(a => a.itemId === id);
  if (!acc) return;
  const v = shape(acc);
  busy = true; render();
  try {
    const at = new Date().toISOString();
    const payFields = { AccountId: v.accountId, At: at, Amount: String(v.rate), Result: result, Note: '' };
    if (!usingSample) await graph('POST', '/sites/' + siteId + '/lists/' + (await listId(LIST.payments)) + '/items', { fields: payFields });
    payments.push({ itemId: 'p' + Date.now(), ...payFields });

    // Paid clears one cycle's worth from whatever is owed -- not all of it, since a
    // balance can be several cycles deep and one payment only catches up the latest.
    const newBalance = result === 'paid' ? Math.max(0, v.owed - v.rate) : v.owed + v.rate;
    const accFields = {
      Balance: String(newBalance), LastResult: result, LastAttemptAt: at,
      ...(result === 'paid' ? { LastPaidCycle: v.cycleLast } : {})
    };
    if (!usingSample) await graph('PATCH', '/sites/' + siteId + '/lists/' + (await listId(LIST.accounts)) + '/items/' + id + '/fields', accFields);
    Object.assign(acc, accFields);
    toast(result === 'paid' ? '✓ Marked paid' : 'Marked declined — added to balance');
  } catch (e) { toast('Could not record: ' + e.message, true); }
  busy = false; render();
}

async function adjustBalance(id) {
  const acc = accounts.find(a => a.itemId === id);
  if (!acc) return;
  const v = shape(acc);
  const raw = prompt('New balance for ' + v.name + ' (currently ' + money(v.owed) + '):', v.owed.toFixed(2));
  if (raw === null) return;
  const n = Number(raw);
  if (!Number.isFinite(n) || n < 0) { toast('Enter a number, 0 or more', true); return; }
  busy = true; render();
  try {
    if (!usingSample) await graph('PATCH', '/sites/' + siteId + '/lists/' + (await listId(LIST.accounts)) + '/items/' + id + '/fields', { Balance: String(n) });
    acc.Balance = String(n);
    toast('✓ Balance updated');
  } catch (e) { toast('Could not update: ' + e.message, true); }
  busy = false; render();
}

async function cancelAccount() {
  if (!openId) return;
  const reason = prompt('Reason for cancelling (optional):', '');
  if (reason === null) return;
  busy = true; render();
  try {
    const fields = { Status: 'cancelled', CancelDate: today(), CancelReason: reason || '' };
    if (!usingSample) await graph('PATCH', '/sites/' + siteId + '/lists/' + (await listId(LIST.accounts)) + '/items/' + openId + '/fields', fields);
    const acc = accounts.find(a => a.itemId === openId);
    if (acc) Object.assign(acc, fields);
    toast('Account cancelled');
    closeDrawer();
  } catch (e) { toast('Could not cancel: ' + e.message, true); }
  busy = false; render();
}

function toast(msg, isErr) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:13px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3)'; document.body.appendChild(el); }
  el.style.color = isErr ? 'var(--red)' : 'var(--text)';
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

/* ---------- alarm info: what the monitoring company needs to set an account up ----------

   Replaces the "Alarm Info" spreadsheet that gets emailed around. Same fields, same three
   roles, but attached to the account instead of living in a file nobody can find later.

   The roles are the point of the form, and in the spreadsheet they were carried by FONT
   colour -- which is why they vanish the moment anyone saves it as anything else. Here
   they are structural: each field knows whose job it is, so the page can answer the
   question the salesman actually has, which is "what am I still waiting on, and from whom".

   Panel type and monitoring company are deliberately NOT repeated here -- they already
   live on the account above, and asking twice is how two answers end up disagreeing. */

const ALARM_ROLES = { sales: 'Salesperson', client: 'Client', installer: 'Installer' };

// key, label, role, type, placeholder
const ALARM_FIELDS = [
  ['panelModel',    'Panel model',            'sales',     'text', 'e.g. PROA7'],
  ['panelLocation', 'Panel location',         'sales',     'text', 'e.g. Mechanical room'],
  ['sirenLocation', 'Siren location',         'sales',     'text', 'e.g. Main floor'],
  ['keypadLocation','Keypad location',        'sales',     'text', ''],
  ['keypadModel',   'Keypad model',           'sales',     'text', ''],
  ['salesman',      'Salesman',               'sales',     'text', ''],
  ['transmitter',   'Transmitter #',          'sales',     'text', ''],
  ['viaNetwork',    'Monitored via network',  'sales',     'yesno', ''],
  ['viaPhone',      'Monitored via phone',    'client',    'yesno', ''],
  ['masterCode',    'Master code',            'client',    'secret', ''],
  ['sitePassword',  'Site password',          'client',    'secret', ''],
  ['entryDelay1',   'Entry delay 1',          'client',    'text', 'Default 60 sec'],
  ['entryDelay2',   'Entry delay 2',          'client',    'text', 'Default 180 sec'],
  ['exitDelay',     'Exit delay',             'client',    'text', 'Default 60 sec'],
  ['userCodes',     'User codes (other than master)', 'client', 'secret', ''],
  ['installerCode', "Installer's code",       'installer', 'secret', 'e.g. 1300'],
  ['installer',     'Installer',              'installer', 'text', ''],
];

function alarmOf(src) {
  try { const a = JSON.parse(src || '{}'); return a && typeof a === 'object' ? a : {}; } catch { return {}; }
}
function alarmBuf() {
  if (!editBuf._alarm) editBuf._alarm = alarmOf(editBuf.AlarmInfoJson);
  const a = editBuf._alarm;
  if (!Array.isArray(a.keyholders)) a.keyholders = [{ name: '', phone: '' }, { name: '', phone: '' }, { name: '', phone: '' }];
  if (!Array.isArray(a.zones)) a.zones = [];
  return a;
}
function setAlarm(k, v) { alarmBuf()[k] = v; }
function setKeyholder(i, k, v) { alarmBuf().keyholders[i][k] = v; }
function setZone(i, k, v) { alarmBuf().zones[i][k] = v; }
function addZone() { const a = alarmBuf(); a.zones.push({ name: '', def: '', wire: '' }); render(); }
function removeZone(i) { const a = alarmBuf(); a.zones.splice(i, 1); render(); }
function toggleAlarm() { alarmOpen = !alarmOpen; render(); }
function toggleSecret(k) { shownSecrets.has(k) ? shownSecrets.delete(k) : shownSecrets.add(k); render(); }

// What is still missing, and whose job it is -- the question the form exists to answer.
function alarmOutstanding(a) {
  const missing = { sales: 0, client: 0, installer: 0 };
  for (const [key, , role, type] of ALARM_FIELDS) {
    const v = a[key];
    const empty = type === 'yesno' ? (v !== 'yes' && v !== 'no') : !String(v ?? '').trim();
    if (empty) missing[role]++;
  }
  if (!(a.keyholders || []).some(k => String(k.name || '').trim())) missing.client++;
  if (!(a.zones || []).some(z => String(z.name || '').trim())) missing.installer++;
  return missing;
}

function alarmSection() {
  const a = alarmBuf();
  const missing = alarmOutstanding(a);
  const total = missing.sales + missing.client + missing.installer;

  const head = '<div class="sec-h" style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleAlarm()">' +
    '<span>Alarm info for the monitoring company</span>' +
    (total ? '<span class="tag t-miss">' + total + ' to fill in</span>' : '<span class="tag t-ok">complete</span>') +
    '<span style="margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0">' + (alarmOpen ? 'hide' : 'show') + '</span></div>';
  if (!alarmOpen) {
    return head + '<div class="sm2">' +
      ['sales', 'client', 'installer'].filter(r => missing[r]).map(r =>
        '<span class="role role-' + r + '">' + ALARM_ROLES[r] + ': ' + missing[r] + '</span>').join(' ') +
      (total ? '' : 'Everything the monitoring company needs is filled in.') + '</div>';
  }

  const fieldRow = ([key, label, role, type, ph]) => {
    const v = a[key] ?? '';
    // Codes are masked until someone asks to see them: they should not be sitting on
    // screen during a screen-share, a walk-past, or an accidental screenshot. It is a
    // shoulder-surfing measure, not encryption -- the value is stored in plain text and
    // anyone who can open this page can still reveal it.
    const input = type === 'yesno'
      ? '<select oninput="setAlarm(\'' + key + '\',this.value)">' +
          ['', 'yes', 'no'].map(o => '<option value="' + o + '"' + (o === v ? ' selected' : '') + '>' + (o ? o[0].toUpperCase() + o.slice(1) : '—') + '</option>').join('') +
        '</select>'
      : type === 'secret'
      ? '<span class="secret-wrap">' +
          '<input type="' + (shownSecrets.has(key) ? 'text' : 'password') + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '" ' +
            'autocomplete="off" oninput="setAlarm(\'' + key + '\',this.value)">' +
          '<button class="btn btn-ghost btn-sm" onclick="toggleSecret(\'' + key + '\')" ' +
            'title="' + (shownSecrets.has(key) ? 'Hide' : 'Show') + '">' + (shownSecrets.has(key) ? 'Hide' : 'Show') + '</button>' +
        '</span>'
      : '<input value="' + esc(v) + '" placeholder="' + esc(ph) + '" oninput="setAlarm(\'' + key + '\',this.value)">';
    // No role tag on the field itself -- the group heading above already says whose it is.
    return '<div><label>' + esc(label) + '</label>' + input + '</div>';
  };

  const group = role => '<div class="sm2" style="margin:14px 0 6px"><span class="role role-' + role + '">' + ALARM_ROLES[role] + '</span>' +
      ' <span style="color:var(--text3)">fills these in</span></div>' +
    '<div class="fgrid">' + ALARM_FIELDS.filter(f => f[2] === role).map(fieldRow).join('') + '</div>';

  const keyholders = '<div class="sm2" style="margin:12px 0 6px"><span class="role role-client">Client</span> Keyholders</div>' +
    a.keyholders.map((k, i) =>
      '<div class="fgrid" style="margin-bottom:6px">' +
        '<div><input value="' + esc(k.name || '') + '" placeholder="Name" oninput="setKeyholder(' + i + ',\'name\',this.value)"></div>' +
        '<div><input value="' + esc(k.phone || '') + '" placeholder="Phone" oninput="setKeyholder(' + i + ',\'phone\',this.value)"></div>' +
      '</div>').join('');

  const zones = '<div class="sm2" style="margin:14px 0 6px"><span class="role role-installer">Installer</span> Zones' +
      ' <span style="color:var(--text3)">— add only the ones in use</span></div>' +
    (a.zones.length ? a.zones.map((z, i) =>
      '<div class="zone-row">' +
        '<span class="zone-n">#' + (i + 1) + '</span>' +
        '<input value="' + esc(z.name || '') + '" placeholder="Zone name" oninput="setZone(' + i + ',\'name\',this.value)">' +
        '<input value="' + esc(z.def || '') + '" placeholder="Def #" style="max-width:5.5em" oninput="setZone(' + i + ',\'def\',this.value)">' +
        '<select oninput="setZone(' + i + ',\'wire\',this.value)">' +
          ['', 'Wired', 'Wireless'].map(o => '<option value="' + o + '"' + (o === (z.wire || '') ? ' selected' : '') + '>' + (o || '—') + '</option>').join('') +
        '</select>' +
        '<button class="btn btn-ghost btn-sm" onclick="removeZone(' + i + ')" title="Remove">✕</button>' +
      '</div>').join('') : '<div class="sm2">No zones yet.</div>') +
    '<div style="margin-top:8px"><button class="btn btn-sm" onclick="addZone()">+ Add zone</button></div>';

  return head +
    '<div class="sm2">Colours match the paper form: who is expected to supply each answer.</div>' +
    group('sales') + group('client') + keyholders + group('installer') + zones +
    '<div class="sm2" style="margin:14px 0 6px">Notes</div>' +
    '<textarea rows="2" placeholder="Anything else the monitoring company should know" oninput="setAlarm(\'notes\',this.value)">' + esc(a.notes || '') + '</textarea>' +
    '<div class="drawer-actions">' +
      '<button class="btn btn-sm" onclick="copyAlarm()">Copy for the monitoring company</button>' +
    '</div>';
}

/* Plain text, ready to paste into an email or the station's own portal -- the actual
   point of collecting any of this. */
function alarmText() {
  const a = alarmBuf();
  const b = editBuf;
  const L = [];
  L.push('ALARM INFO — ' + (b.CustomerName || ''));
  if (b.Address) L.push(b.Address);
  L.push('Monitoring company: ' + (b.Station || '(not set)'));
  L.push('Panel type: ' + (b.Panel || '(not set)'));
  L.push('');
  for (const role of ['sales', 'client', 'installer']) {
    L.push(ALARM_ROLES[role].toUpperCase());
    for (const [key, label, r, type] of ALARM_FIELDS) {
      if (r !== role) continue;
      const v = a[key];
      const shown = type === 'yesno' ? (v ? v.toUpperCase() : '—') : (String(v ?? '').trim() || '—');
      L.push('  ' + label + ': ' + shown);
    }
    if (role === 'client') {
      const ks = (a.keyholders || []).filter(k => String(k.name || '').trim() || String(k.phone || '').trim());
      L.push('  Keyholders:' + (ks.length ? '' : ' —'));
      ks.forEach(k => L.push('    ' + (k.name || '—') + '  ' + (k.phone || '')));
    }
    if (role === 'installer') {
      const zs = (a.zones || []).filter(z => String(z.name || '').trim());
      L.push('  Zones:' + (zs.length ? '' : ' —'));
      zs.forEach((z, i) => L.push('    #' + (i + 1) + '  ' + (z.name || '') + '  def ' + (z.def || '—') + '  ' + (z.wire || '—')));
    }
    L.push('');
  }
  if (a.notes) { L.push('NOTES'); L.push('  ' + a.notes); }
  return L.join('\n');
}
async function copyAlarm() {
  const text = alarmText();
  try { await navigator.clipboard.writeText(text); toast('✓ Copied — paste it into the email or the station portal'); }
  catch { toast('Could not copy automatically — the text is in the console', true); console.log(text); }
}

/* ---------- import from the SecurTek B&C export ----------
   The monthly "Billing & Collections" workbook SecurTek sends: Customer, Payment Type,
   Manitou ID, Cust #, then one block of four columns (Billed / Coll & Pd / Current Month
   Owing / Customer Balance) per month, oldest first. Paste the sheet -- as a .xls/.csv or
   copied straight out of Excel (tab-separated) -- and it becomes accounts here, using your
   own signed-in session to write them, since this page has no server-side credentials.

   What it deliberately does NOT bring over: the "Owes Nov 2023-Aug 2026 - Declined" style
   flags baked into 50 of the names, and the outstanding balances that go with them --
   those were dealt with outside this tool, so every imported account starts at a clean
   $0 balance and active status rather than re-importing three years of write-offs. */

function parseSecurtekExport(raw) {
  const rows = parseDelimitedSB(raw.trim());
  const hIdx = rows.findIndex(r => norm2(r[0]) === 'customer' && r.some(c => norm2(c) === 'payment type'));
  if (hIdx < 0) {
    // Name what was actually loaded: the collections call list and the B&C statement look
    // alike in a file picker, and "nothing happened" is a miserable way to find out.
    const firstLine = (rows[0] || []).filter(Boolean).join(' ').slice(0, 80);
    return { error: 'This does not look like the Billing & Collections statement — it has no "Customer" and "Payment Type" columns.' +
      (firstLine ? ' The file starts with: “' + firstLine + '”.' : '') +
      ' Load the monthly B&C workbook from SecurTek instead.' };
  }

  // Existing accounts by SecurTek account number, so a re-import can repair rows rather
  // than only skip them -- needed the first time a column was added after an import ran.
  const known = new Map(accounts.filter(a => a.AccountId).map(a => [a.AccountId, a]));
  const ready = [], skipped = [], already = [], update = [];

  for (const r of rows.slice(hIdx + 1)) {
    const rawName = (r[0] || '').trim();
    // SUBTOTAL/TOTAL close the customer list. Below them the same sheet carries a
    // reconciliation section (Balance Forward, Wholesale Invoice, NSF FEE...) -- real rows
    // with real numbers, but not customers, so parsing must stop rather than skip past.
    if (/^(subtotal|total)$/i.test(rawName)) break;
    if (!rawName || /^customer$/i.test(rawName)) continue;

    const custNum = (r[3] || '').trim();
    const accountId = custNum || null;
    const existing = accountId ? known.get(accountId) : null;

    // "Ted & Marney Sherritt - Owes July 2025-Aug 2026 - Declined" -> "Ted & Marney Sherritt".
    // The flag is dropped, not carried into a note -- these were resolved outside the tool.
    const name = rawName.split(/\s+-\s+Owes\b/i)[0].trim();

    // "EFTCRD 15th" carries both how they pay and the day: EFTCRD is a card on file,
    // EFTCHQ is pre-authorized debit off a chequing account, MANUAL is neither.
    const payType = (r[1] || '').trim();
    const dayMatch = /(\d{1,2})(st|nd|rd|th)/i.exec(payType);
    const billDay = dayMatch ? Number(dayMatch[1]) : 1;
    const method = /EFTCRD/i.test(payType) ? 'Credit card'
      : /EFTCHQ/i.test(payType) ? 'Pre-authorized debit'
      : /MANUAL/i.test(payType) ? 'Manual' : '';

    const manitouId = (r[2] || '').trim();

    // Billed is the first column of each repeating 4-column month block, and every block
    // starts counting from column 4 -- Dec's Billed is 4, Jan's is 8, and so on. Anchoring
    // the scan at 4 (rather than working backward from the row's own length) matters
    // because Excel pads every row out to the widest row in the sheet with empty trailing
    // columns, so "the last 4 columns" is usually padding, not August, and landed one
    // column group off -- silently picking up a Current Month Owing figure as the rate.
    const billedIdx = [];
    for (let i = 4; i + 3 < r.length; i += 4) billedIdx.push(i);

    // Which month-blocks carry a charge, and what it was. The SPACING between them is the
    // billing cycle: every month, every third month, or once in the window.
    const hits = [];
    billedIdx.forEach((col, block) => { const v = moneyNum(r[col]); if (v > 0) hits.push({ block, v }); });
    if (!hits.length) { skipped.push(rawName + ' (never billed — no rate to import)'); continue; }

    const rate = hits[hits.length - 1].v;
    // Size is the reliable tell in this book -- the same service is $21 monthly, $63
    // quarterly and $252 a year, so the amount alone usually settles the cycle.
    const byAmount = rate >= 150 ? 'annual' : rate >= 45 ? 'quarterly' : 'monthly';

    let freq = byAmount;
    if (hits.length > 1) {
      const gaps = hits.slice(1).map((h, i) => h.block - hits[i].block);
      const tally = {};
      for (const g of gaps) tally[g] = (tally[g] || 0) + 1;
      const ranked = Object.keys(tally).sort((a, b) => tally[b] - tally[a]);
      // Only trust the spacing when one gap genuinely dominates. Manually-invoiced
      // accounts get billed whenever someone remembers -- Dan Granger was charged in
      // Feb, Mar, May and Aug -- and a tie between gaps there means nothing, so the
      // amount decides instead of an arbitrary first-place tie.
      const dominant = ranked.length === 1 || tally[ranked[0]] > tally[ranked[1]];
      if (dominant) {
        const common = Number(ranked[0]);
        freq = common >= 6 ? 'annual' : common >= 2 ? 'quarterly' : 'monthly';
      }
    }

    // The most recent month actually billed, as the anchor the cycle maths walks from --
    // this is what keeps a quarterly or annual account falling due in the right months.
    const monthHeader = (rows[hIdx - 1] || [])[billedIdx[hits[hits.length - 1].block]] || '';
    const lastCycle = monthNameToIso(monthHeader, billDay);

    const record = {
      AccountId: accountId || ('SBIMP' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase()),
      Title: name, CustomerName: name, Address: '', Phone: '', Email: '',
      Station: 'SecurTek', StationAccountId: manitouId, Panel: '',
      MonthlyRate: String(rate), BillingFrequency: freq, PaymentMethod: method,
      Gst: true, Pst: true, BillDay: String(billDay),
      Status: 'active', StartDate: '', Balance: '0',
      // The last billed month, treated as settled -- arrears were handled outside the tool,
      // and it anchors when the next cycle falls due.
      LastPaidCycle: lastCycle, LastResult: 'paid',
      Note: 'Imported from the SecurTek statement' + (custNum ? ' (Cust # ' + custNum + ')' : '') +
        ' — billed ' + freq + (method ? ' by ' + method.toLowerCase() : '') + '.'
    };

    if (existing) {
      // Already here. Only worth reporting if the export disagrees with what is stored --
      // typically because a column was added after the first import and never filled in.
      const changes = {};
      for (const k of ['BillingFrequency', 'PaymentMethod', 'MonthlyRate', 'BillDay', 'StationAccountId', 'LastPaidCycle']) {
        if (String(existing[k] ?? '') !== String(record[k] ?? '')) changes[k] = record[k];
      }
      if (Object.keys(changes).length) update.push({ itemId: existing.itemId, name, changes });
      else already.push(rawName);
      continue;
    }

    ready.push(record);
  }
  return { ready, skipped, already, update };
}

// Tab-separated (pasted straight from Excel) or comma-separated (a saved .csv), matching
// the same detection ART_Orders.html uses for the RQ report.
function parseDelimitedSB(text) {
  const sample = text.split('\n').slice(0, 30);
  const count = ch => sample.reduce((n, l) => n + (l.split(ch).length - 1), 0);
  const delim = count('\t') >= count(',') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function norm2(s) { return String(s ?? '').trim().toLowerCase(); }

// The row above the column headers labels each month block: "December-25", "August-26".
const MONTH_NAMES = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
function monthNameToIso(label, day) {
  const m = /([A-Za-z]+)[\s-]+(\d{2,4})/.exec(String(label || '').trim());
  if (!m) return '';
  const mi = MONTH_NAMES.indexOf(m[1].toLowerCase());
  if (mi < 0) return '';
  const yr = m[2].length === 2 ? 2000 + Number(m[2]) : Number(m[2]);
  return yr + '-' + String(mi + 1).padStart(2, '0') + '-' + String(Math.min(28, Number(day) || 1)).padStart(2, '0');
}
// "( 29.00 )" and " 87.00 " both show up in the export -- accounting-negative and padded.
function moneyNum(s) {
  const t = String(s ?? '').trim();
  if (!t || t === '-') return 0;
  const neg = /^\(.*\)$/.test(t);
  const n = parseFloat(t.replace(/[^0-9.]/g, ''));
  return Number.isFinite(n) ? (neg ? -n : n) : 0;
}

/* SecurTek sends a genuine .xls, which a browser can't read on its own. SheetJS can, and
   it is ~900 KB, so it only loads when someone actually picks a spreadsheet. Same approach
   the Orders page uses for the RepairQ export. */
let sheetJs = null;
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve();
  if (!sheetJs) sheetJs = new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => bad(new Error('Could not load the spreadsheet reader'));
    document.head.appendChild(s);
  });
  return sheetJs;
}

// A workbook has more than one sheet (the customer list and the dealer statement), so pick
// whichever one actually carries the customer table rather than assuming it is the first.
function sheetToCsv(wb) {
  for (const name of wb.SheetNames) {
    const csv = XLSX.utils.sheet_to_csv(wb.Sheets[name]);
    if (/payment\s*type/i.test(csv)) return csv;
  }
  return XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
}

async function importFromFile(file) {
  if (!file) return;
  try {
    if (/\.(xls|xlsx)$/i.test(file.name)) {
      await loadSheetJs();
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      importText = sheetToCsv(wb);
    } else {
      importText = await file.text();
    }
    parseImport();                        // straight to the preview -- no extra click
    toast('Read ' + file.name);
  } catch (e) {
    toast('Could not read that file: ' + e.message, true);
  }
}
function importFile(input) { const f = input.files && input.files[0]; input.value = ''; importFromFile(f); }

// Drag-and-drop onto the panel. The browser's default for a file dropped anywhere on a
// page is to navigate away to it, which is what makes an un-wired drop target look broken.
function importDragOver(e) { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--accent)'; }
function importDragLeave(e) { e.currentTarget.style.borderColor = ''; }
function importDrop(e) {
  e.preventDefault();
  e.currentTarget.style.borderColor = '';
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) importFromFile(f);
}

function toggleImport() { importOpen = !importOpen; if (!importOpen) { importText = ''; importParsed = null; importError = ''; } render(); }
function setImportText(v) { importText = v; }
function parseImport() {
  if (!importText.trim()) { toast('Paste the SecurTek sheet first', true); return; }
  const result = parseSecurtekExport(importText);
  // A rejected file used to say so in a toast, which is gone in three seconds -- long
  // enough to miss, and then the panel just sits there with no buttons and no reason
  // given. The error stays on screen now until another file is loaded.
  if (result.error) { importError = result.error; importParsed = null; }
  else { importError = ''; importParsed = result; }
  render();
}

function importPanel() {
  if (!importOpen) return '';
  const p = importParsed;
  return '<div class="lt open" style="margin-bottom:14px">' +
    '<div class="lt-head" onclick="toggleImport()"><span class="panel-title">Import SecurTek export</span>' +
      '<span class="spacer"></span><span style="color:var(--text3);font-size:12px">close</span></div>' +
    '<div class="lt-body">' +
      '<p class="lt-hint">Paste the Billing &amp; Collections sheet — straight out of Excel (select all, copy, paste below) or as a .csv. ' +
      'The most recent monthly rate for each customer is picked up, and the SecurTek account number carries over so re-pasting a later export ' +
      "won't create duplicates. Balances and the “Owes… Declined” flags are not imported — start clean and let the chase queue take it from here.</p>" +
      // File first: it is the reliable route. Pasting a 153-row sheet works, but only if
      // the box is focused first, and the file is what people actually have in hand.
      '<div class="dropzone" ondragover="importDragOver(event)" ondragleave="importDragLeave(event)" ondrop="importDrop(event)">' +
        '<label class="btn btn-sm" style="display:inline-block">Choose the file…' +
          '<input type="file" accept=".xls,.xlsx,.csv,.txt" hidden onchange="importFile(this)"></label>' +
        '<div class="sm2" style="margin-top:8px">…or drag the .xls / .xlsx / .csv here</div>' +
      '</div>' +
      '<div class="sm2" style="margin:10px 0 6px">Or paste the sheet — click in the box first, then Ctrl+V:</div>' +
      '<textarea id="importPaste" rows="4" placeholder="Paste the sheet here" oninput="setImportText(this.value)">' + esc(importText) + '</textarea>' +
      '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<button class="btn btn-sm" onclick="parseImport()">Check what would import</button>' +
        (p && p.ready.length ? '<button class="btn btn-primary btn-sm" ' + (busy ? 'disabled' : '') + ' onclick="runImport()">Import ' + p.ready.length + ' account' + (p.ready.length === 1 ? '' : 's') + '</button>' : '') +
        (p && p.update.length ? '<button class="btn btn-sm" ' + (busy ? 'disabled' : '') + ' onclick="runUpdate()">Update ' + p.update.length + ' existing</button>' : '') +
        (importProgress ? '<span class="sm2">' + esc(importProgress) + '</span>' : '') +
      '</div>' +
      (importError ? '<div class="banner" style="margin:10px 0 0">' + esc(importError) + '</div>' : '') +
      (p ? '<p class="lt-hint" style="margin-top:10px">' +
        p.ready.length + ' ready to import' +
        (p.update.length ? ' · <b>' + p.update.length + ' already here but out of date</b>' : '') +
        (p.already.length ? ' · ' + p.already.length + ' already in the list and correct' : '') +
        (p.skipped.length ? ' · ' + p.skipped.length + ' skipped (no rate found)' : '') +
        '</p>' +
        // What would actually change, named field by field, so an update is never a
        // mystery write -- this is the path that repairs a column added after an import.
        (p.update.length ? (() => {
          const fields = {};
          for (const u of p.update) for (const k of Object.keys(u.changes)) fields[k] = (fields[k] || 0) + 1;
          return '<p class="lt-hint">Updating would set: ' +
            Object.entries(fields).sort((a, b) => b[1] - a[1]).map(([k, n]) => '<b>' + esc(k) + '</b> on ' + n).join(' · ') +
            '<br><span class="sm2">' + p.update.slice(0, 6).map(u => esc(u.name)).join(' · ') +
            (p.update.length > 6 ? ' + ' + (p.update.length - 6) + ' more' : '') + '</span></p>';
        })() : '') +
        // Worth showing before anything is written: an annual account read as monthly is a
        // twelvefold error, and this is where it would be visible.
        (p.ready.length ? (() => {
          const by = { monthly: [], quarterly: [], annual: [] };
          for (const a of p.ready) (by[a.BillingFrequency] || by.monthly).push(a);
          const perMonth = p.ready.reduce((n, a) => n + Number(a.MonthlyRate) / FREQ[a.BillingFrequency || 'monthly'], 0);
          const meth = {};
          for (const a of p.ready) { const k = a.PaymentMethod || '(not stated)'; meth[k] = (meth[k] || 0) + 1; }
          return '<p class="lt-hint">' +
            ['monthly', 'quarterly', 'annual'].filter(f => by[f].length).map(f => by[f].length + ' ' + f).join(' · ') +
            ' — ' + money(perMonth) + ' a month once normalised' +
            '<br><span class="sm2">' + Object.entries(meth).sort((a, b) => b[1] - a[1]).map(([k, n]) => esc(k) + ': ' + n).join(' · ') + '</span></p>';
        })() : '') +
        (p.skipped.length ? '<p class="lt-hint" style="color:var(--text3)">' + p.skipped.slice(0, 15).map(esc).join('<br>') + (p.skipped.length > 15 ? '<br>+ ' + (p.skipped.length - 15) + ' more' : '') + '</p>' : '')
        : '') +
    '</div></div>';
}

// Sequential, with the same 429/503 backoff the scheduled sync uses -- SharePoint throttles
// a burst of ~150 creates from one session more readily than it does from the app-only
// sync, since this runs at full speed with no pacing between requests otherwise.
async function importOne(fields, attempt = 1) {
  try {
    return await graph('POST', '/sites/' + siteId + '/lists/' + (await listId(LIST.accounts)) + '/items', { fields });
  } catch (e) {
    const status = Number(String(e.message).match(/-> (\d+)/)?.[1] || 0);
    if ((status === 429 || status === 503) && attempt < 5) {
      await new Promise(r => setTimeout(r, attempt * 1500));
      return importOne(fields, attempt + 1);
    }
    throw e;
  }
}

async function runImport() {
  if (busy || !importParsed || !importParsed.ready.length) return;
  const rows = importParsed.ready;
  busy = true;
  let done = 0, failed = 0;
  for (const fields of rows) {
    importProgress = 'Creating ' + (done + failed + 1) + ' of ' + rows.length + '…';
    render();
    try {
      const created = await importOne(fields);
      accounts.push({ itemId: created.id, ...fields });
      done++;
    } catch (e) {
      failed++;
      console.warn('Import failed for', fields.CustomerName, e.message);
    }
  }
  busy = false; importProgress = null;
  toast('✓ Imported ' + done + ' account' + (done === 1 ? '' : 's') + (failed ? ' · ' + failed + ' failed (see console)' : ''));
  importOpen = false; importText = ''; importParsed = null;
  render();
}

/* Repairs accounts that are already here. Only the fields that actually differ are sent,
   so this never overwrites anything edited by hand that the export has nothing to say
   about -- address, phone, panel type, alarm info and balances are all left alone. */
async function runUpdate() {
  if (busy || !importParsed || !importParsed.update.length) return;
  const rows = importParsed.update;
  busy = true;
  let done = 0, failed = 0;
  for (const row of rows) {
    importProgress = 'Updating ' + (done + failed + 1) + ' of ' + rows.length + '…';
    render();
    try {
      if (!usingSample) {
        await graph('PATCH', '/sites/' + siteId + '/lists/' + (await listId(LIST.accounts)) + '/items/' + row.itemId + '/fields', row.changes);
      }
      const acc = accounts.find(a => a.itemId === row.itemId);
      if (acc) Object.assign(acc, row.changes);
      done++;
    } catch (e) {
      failed++;
      console.warn('Update failed for', row.name, e.message);
    }
  }
  busy = false; importProgress = null;
  toast('✓ Updated ' + done + ' account' + (done === 1 ? '' : 's') + (failed ? ' · ' + failed + ' failed (see console)' : ''));
  importOpen = false; importText = ''; importParsed = null;
  render();
}
