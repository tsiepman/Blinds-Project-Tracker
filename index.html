<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>ART Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="art-theme.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  header {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 22px 20px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .group + .group { margin-top: 34px; }

  .group-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding-left: 2px;
  }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .tool {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    min-height: 96px;
  }
  .tool:hover {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .tool:active { transform: scale(0.99); }
  .tool:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .tool-icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: var(--radius);
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    line-height: 1;
  }

  .tool-body { min-width: 0; }
  .tool-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .tool-desc {
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.45;
  }

  .tool-missing {
    opacity: 0.45;
    pointer-events: none;
  }

  footer {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px 40px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .header-inner { padding: 18px 16px; }
    main { padding: 20px 16px 44px; }
    .tool-grid { grid-template-columns: 1fr; gap: 12px; }
    .tool { min-height: 0; padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="art-mark">
      <div class="art-mark-row">
        <span class="art-mark-box">ART</span>
        <span class="art-mark-name">Advanced Residential Technology</span>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="groups"></div>
</main>

<footer>
  Bookmark this page — every tool lives behind it. Sign in once and the rest should
  carry your session.
</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  EDIT HERE. This is the whole configuration.
//
//  Each tool: file (the .html filename in this repo, case-sensitive),
//  name, desc, icon (any emoji). Delete or add lines freely — the page
//  builds itself from this list.
//
//  ⚠ Filenames marked TODO are guesses. Correct them to match your repo
//  exactly or the tile will 404.
// ─────────────────────────────────────────────────────────────────────────────
const TOOL_GROUPS = [
  {
    label: 'Crew',
    tools: [
      { file: 'ART-HR-Hub.html',           name: 'HR Hub',              desc: 'Time off requests and calendar, training records, tool sign-out, van maintenance.', icon: '🗓️' }
    ]
  },
  {
    label: 'Field & Warehouse',
    tools: [
      { file: 'ART_Pull_Log_v4.html',      name: 'Pull Log',            desc: 'Scan product out to a job. Weekly log by installer.',   icon: '📦' },
      { file: 'ART_Wire_Tracker_v3.html',  name: 'Wire Tracker',        desc: 'Scan wire in, out, and empty. Status by installer.',    icon: '🔌' },
      { file: 'ART_Wire_Label_Printer.html', name: 'Wire Label Printer', desc: 'Generate and print wire labels on Avery sheets.',      icon: '🏷️' }
    ]
  },
  {
    label: 'Projects',
    tools: [
      { file: 'art-blinds-tracker.html',   name: 'Blinds Project Tracker', desc: 'Shading projects — measurements, orders, status.',   icon: '🪟' },
      { file: 'ART_Change_Order_Tracker.html', name: 'Change Order Tracker', desc: 'Log COs, look up product, notify the salesman.',   icon: '📝' }
    ]
  },
  {
    label: 'Office',
    tools: [
      { file: 'art-billing-queue.html',    name: 'Billing Queue',       desc: 'Queue COs and projects for invoicing. Phase and notes.', icon: '💵' },
      { file: 'ART-Electrical-Commission.html', name: 'Electrical Commission', desc: 'Outlet calls and lighting job commission. Restricted access.', icon: '⚡' },
      { file: 'ART-Control4-Upgrade-Queue.html', name: 'Control4 Upgrade Queue', desc: 'Log old Control4 systems found in the field and work the lead.', icon: '⬆️' }
    ]
  }
];

// ─────────────────────────────────────────────────────────────────────────────

function render() {
  document.getElementById('groups').innerHTML = TOOL_GROUPS.map(group => `
    <section class="group">
      <div class="group-label">${group.label}</div>
      <div class="tool-grid">
        ${group.tools.map(t => `
          <a class="tool" href="${t.file}">
            <div class="tool-icon">${t.icon}</div>
            <div class="tool-body">
              <div class="tool-name">${t.name}</div>
              <div class="tool-desc">${t.desc}</div>
            </div>
          </a>
        `).join('')}
      </div>
    </section>
  `).join('');
}

render();

// Flags any tile whose file isn't actually in the repo, so a wrong filename
// shows up here instead of as a 404 for someone in the field.
async function checkLinks() {
  const links = document.querySelectorAll('.tool');
  for (const a of links) {
    try {
      const res = await fetch(a.getAttribute('href'), { method: 'HEAD' });
      if (!res.ok) markMissing(a);
    } catch(e) {
      markMissing(a);
    }
  }
}

function markMissing(a) {
  a.classList.add('tool-missing');
  a.querySelector('.tool-desc').textContent = 'File not found — check the filename in this page\'s TOOL_GROUPS list.';
}

checkLinks();
</script>

</body>
</html>
