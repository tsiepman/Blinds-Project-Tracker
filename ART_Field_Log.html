<!DOCTYPE html>

<link rel="stylesheet" href="art-theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40; }
  .mark { background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 3px 7px; border-radius: 5px; }
  .hname { font-size: 14px; font-weight: 600; }
  .hname span { color: var(--text3); font-weight: 400; }
  .spacer { margin-left: auto; }
  .sp-status { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; display: none; }
  .sp-status.connected { display: inline; background: var(--green-dim); color: var(--green); }
  .sp-status.error { display: inline; background: var(--red-dim); color: var(--red); }
  .sp-status.loading { display: inline; background: var(--accent-dim); color: var(--accent); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }
  h1.page { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  p.page-sub { color: var(--text2); font-size: 13px; margin-bottom: 18px; }

  .controls { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
  label.fld { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 5px; font-weight: 600; }
  select, input { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 9px 11px; font-size: 14px; font-family: inherit; }
  .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { background: var(--bg); color: var(--text2); border: none; padding: 9px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--surface2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .seg button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .totals { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .tot { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 11px 15px; min-width: 112px; }
  .tot-n { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tot-l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); font-weight: 600; }
  .tot.miss .tot-n { color: var(--yellow); }
  .tot.late .tot-n { color: var(--accent); }

  .group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 12px; overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--surface2); flex-wrap: wrap; }
  .group-name { font-size: 14.5px; font-weight: 700; }
  .group-meta { font-size: 12px; color: var(--text3); margin-left: auto; }

  .row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 16px; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: none; }
  .when { min-width: 5.5em; font-size: 12.5px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .what { flex: 1; min-width: 0; }
  .job { font-weight: 600; }
  .job .num { font-family: var(--mono); font-size: 12.5px; color: var(--text3); margin-right: 6px; }
  .sub { font-size: 12px; color: var(--text3); }
  .crew { font-size: 12.5px; color: var(--text2); margin-top: 3px; }
  .note { font-size: 12.5px; color: var(--text2); margin-top: 6px; white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 9px; }
  .status { min-width: 9em; text-align: right; }

  .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; display: inline-block; }
  .t-ok { background: var(--green-dim); color: var(--green); }
  .wu { margin-top: 8px; padding: 8px 10px; background: var(--surface2, rgba(127,127,127,.06)); border-radius: 8px; font-size: 13px; }
  .wu-sum { font-weight: 500; margin-bottom: 4px; }
  .wu-sec { margin-top: 5px; }
  .wu-sec b { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
  .wu-sec ul { margin: 2px 0 0; padding-left: 18px; }
  .wu-out b { color: var(--yellow); }
  .wu-act b { color: var(--accent); }
  .why { color: var(--text2); }
  .wu details, details.fu { margin-top: 6px; }
  .wu summary { cursor: pointer; font-size: 12px; color: var(--text2); }
  details.fu > summary { cursor: pointer; list-style: none; }
  details.fu > summary::-webkit-details-marker { display: none; }
  .chev { color: var(--text3); font-size: 11px; width: 1em; }
  .group-head { cursor: pointer; }
  .group-head:hover .group-name { color: var(--accent); }
  .fu-item { display: flex; gap: 7px; align-items: flex-start; list-style: none; margin-left: -18px; }
  .fu-item input { margin-top: 2px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .fu-item.fu-done > span { text-decoration: line-through; color: var(--text3); }
  .group-meta a { color: var(--accent); text-decoration: none; }
  .t-miss { background: var(--yellow-dim); color: var(--yellow); }
  .t-late { background: var(--accent-dim); color: var(--accent); }
  .t-grey { background: var(--surface2); color: var(--text3); }
  .t-svc { background: var(--surface2); color: var(--text2); }

  .banner { background: var(--yellow-dim); color: var(--yellow); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; line-height: 1.55; margin-bottom: 16px; }
  .empty { text-align: center; color: var(--text3); padding: 40px 16px; font-size: 13px; }
  .centre { display: flex; align-items: center; justify-content: center; min-height: 70vh; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; max-width: 400px; text-align: center; }
  .card h2 { font-size: 20px; margin-bottom: 8px; }
  .card p { color: var(--text2); font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
  .card .btn { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  @media (max-width: 720px) {
    .row { flex-wrap: wrap; }
    .status { text-align: left; min-width: 0; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
</head>
<body>

<div class="header">
  <span class="mark">ART</span><span class="hname">Field Log <span>who was where</span></span>
  <span id="spStatus" class="sp-status"></span>
  <span class="spacer"></span>
  <a class="art-back" href="index.html">← All tools</a>
</div>

<div id="app"></div>

<script>
/* ============================================================
   ART Field Log
   Every visit D-Tools had scheduled, written down by the sync as it happened.

   Why it is recorded rather than read live: the D-Tools API only shows the
   CURRENT schedule. Reschedule or delete a task and yesterday's version is
   gone -- and with it any way to ask whether that visit was ever written up.

   Work-order write-ups (the emails installers generate) are matched onto
   these rows later; until then every past visit reads "no write-up yet".
   ============================================================ */

const TENANT_ID = '2e6ff905-d709-43db-94a5-c11d318118ee';
const CLIENT_ID = '7b0d92bf-6e34-497e-9938-7860ba268631';
const SITE_HOSTNAME = 'advanceelectronics.sharepoint.com';
const SITE_PATH = '/sites/ART43';
const SCOPES = ['https://graph.microsoft.com/Sites.ReadWrite.All', 'offline_access'];
const LIST = 'FieldVisits';

let msal_ = null, siteId = null, listIds = {};
let visits = [], usingSample = false;
let view = (() => { try { const v = localStorage.getItem('field.view'); return ['person', 'job'].includes(v) ? v : 'day'; } catch { return 'day'; } })();
let days = 14, search = '', showInternal = false;
// Groups collapsed by name, remembered per browser. Open by default: the log is read far
// more often than it is tidied, and a page of closed headings answers nothing.
let closedGroups = (() => { try { return new Set(JSON.parse(localStorage.getItem('field.closed') || '[]')); } catch { return new Set(); } })();
function toggleGroup(key) {
  closedGroups.has(key) ? closedGroups.delete(key) : closedGroups.add(key);
  try { localStorage.setItem('field.closed', JSON.stringify([...closedGroups])); } catch {}
  render();
}
function setAllGroups(open) {
  if (open) closedGroups.clear();
  else for (const k of lastGroupKeys) closedGroups.add(k);
  try { localStorage.setItem('field.closed', JSON.stringify([...closedGroups])); } catch {}
  render();
}
let lastGroupKeys = [];   // what is on screen now, so "collapse all" knows what to close
let busy = false, showDoneFollowUps = false;
function toggleDoneFollowUps() { showDoneFollowUps = !showDoneFollowUps; render(); }
function toast(msg, isErr) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div'); el.id = 'toast';
    el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:13px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3)';
    document.body.appendChild(el);
  }
  el.style.color = isErr ? 'var(--red)' : 'var(--text)';
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(window.__t); window.__t = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

/* ---------- auth / graph ---------- */

async function init() {
  if (location.search.includes('demo')) { loadSample(); render(); return; }
  msal_ = new msal.PublicClientApplication({
    auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: location.href.split('?')[0].split('#')[0] },
    cache: { cacheLocation: 'localStorage' }
  });
  await msal_.initialize();
  await msal_.handleRedirectPromise();
  if (!msal_.getAllAccounts().length) { renderSignIn(); return; }
  await load();
}
function signIn() { msal_.loginRedirect({ scopes: SCOPES }); }

async function token() {
  const a = msal_.getAllAccounts();
  if (!a.length) return null;
  try { return (await msal_.acquireTokenSilent({ scopes: SCOPES, account: a[0] })).accessToken; }
  catch { await msal_.acquireTokenRedirect({ scopes: SCOPES, account: a[0] }); return null; }
}
// Reads take one argument; ticking a follow-up done needs a PATCH, hence the method.
async function graph(path, method, body) {
  const t = await token();
  if (!t) return null;
  const res = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method: method || 'GET',
    headers: {
      Authorization: 'Bearer ' + t,
      'Content-Type': 'application/json',
      Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly'
    },
    ...(body ? { body: JSON.stringify(body) } : {})
  });
  if (!res.ok) throw new Error('Graph ' + res.status);
  return res.status === 204 ? null : res.json();
}
async function listId(name) {
  if (!siteId) siteId = (await graph('/sites/' + SITE_HOSTNAME + ':' + SITE_PATH)).id;
  if (!listIds[name]) listIds[name] = (await graph('/sites/' + siteId + '/lists/' + name)).id;
  return listIds[name];
}
async function items(name) {
  if (!siteId) siteId = (await graph('/sites/' + SITE_HOSTNAME + ':' + SITE_PATH)).id;
  if (!listIds[name]) listIds[name] = (await graph('/sites/' + siteId + '/lists/' + name)).id;
  const out = [];
  let url = '/sites/' + siteId + '/lists/' + listIds[name] + '/items?expand=fields&$top=999';
  for (;;) {
    const d = await graph(url);
    if (!d) return out;
    out.push(...(d.value || []));
    if (!d['@odata.nextLink']) break;
    url = d['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0', '');
  }
  return out;
}
function setStatus(cls, txt) { const e = document.getElementById('spStatus'); e.className = 'sp-status ' + cls; e.textContent = txt; }

async function load() {
  setStatus('loading', 'Loading…');
  try {
    // itemId is kept alongside the fields so a follow-up tick can be written back.
    visits = (await items(LIST)).map(i => ({ itemId: i.id, ...(i.fields || {}) }));
    usingSample = false;
    if (!visits.length) loadSample();
    setStatus('connected', 'SharePoint');
  } catch (e) {
    setStatus('error', 'Error');
    console.error(e);
    if (!visits.length) loadSample();
  }
  render();
}

/* ---------- dates ---------- */
function parseD(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dayDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function today() { return iso(new Date()); }
function dayLabel(s) {
  const d = dayDiff(s, today());
  const name = parseD(s).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
  return d === 0 ? 'Today · ' + name : d === 1 ? 'Yesterday · ' + name : name;
}

/* ---------- shaping ----------
   A visit needs a write-up once the day is over. Today's and future work is simply
   pending, so it is never flagged. */
/* The service feed also carries the crew's own day rows -- "A-team", "Off", "Sick",
   "Darwin Off Medical". They are scheduling entries against Advance Electronics itself,
   not customer visits, so they are shown quietly and never asked for a write-up. */
function isInternal(f) {
  const client = String(f.Client || '').trim().toLowerCase();
  const name = String(f.VisitName || '').trim().toLowerCase();
  const progress = String(f.Progress || '').trim().toLowerCase();
  return client === 'advance electronics'
    || ['holiday', 'sick', 'vacation'].includes(progress)
    || /^(a-?\s?team|off\b|shop\b)/.test(name);
}

function shape(f) {
  const date = f.SchedDate || '';
  const age = date ? dayDiff(date, today()) : 0;
  const internal = isInternal(f);
  const done = !!f.WriteUpAt;
  return {
    id: f.VisitId || '', kind: f.Kind || 'task', number: f.Number || '',
    jobNumber: f.JobNumber || '', jobName: f.JobName || '', client: f.Client || '',
    site: f.Site || '', name: f.VisitName || '',
    date, from: f.SchedFrom || '', to: f.SchedTo || '',
    crew: String(f.Crew || '').split(',').map(s => s.trim()).filter(Boolean),
    progress: f.Progress || '', instructions: f.Instructions || '',
    writeUpAt: f.WriteUpAt || '', writeUpBy: f.WriteUpBy || '', writeUpText: f.WriteUpText || '',
    summaries: parseSummaries(f.Summary),
    followUpsDone: f.FollowUpsDone || '',
    doneSet: fuDoneSet({ followUpsDone: f.FollowUpsDone }),
    // Visit day to the day the note was written, from the note's own D-Tools send time.
    late: f.WriteUpAt && date ? Math.max(0, dayDiff(date, String(f.WriteUpAt).slice(0, 10))) : null,
    age, done, internal,
    state: !date ? 'none' : internal ? 'internal' : age <= 0 ? 'upcoming' : done ? 'ok' : age >= 3 ? 'late' : 'missing'
  };
}
// The sync stores Claude's reading of each write-up as JSON: summary, completed,
// outstanding (with reasons), returnVisit, officeActions, clientBuilderNotes.
function parseSummaries(s) {
  if (!s) return [];
  try { const x = JSON.parse(s); return Array.isArray(x) ? x : [x]; } catch { return [{ summary: String(s) }]; }
}

function inWindow(v) {
  if (!v.date) return false;
  if (v.age > days) return false;
  if (!search) return true;
  const hay = [v.jobNumber, v.jobName, v.client, v.site, v.name, v.crew.join(' ')].join(' ').toLowerCase();
  return hay.includes(search.toLowerCase());
}

/* ---------- render ---------- */

function renderSignIn() {
  document.getElementById('app').innerHTML =
    '<div class="centre"><div class="card"><h2>ART Field Log</h2>' +
    '<p>Sign in with your Advance Electronics account.</p>' +
    '<button class="btn" onclick="signIn()">Sign in with Microsoft</button></div></div>';
}

function statusTag(v) {
  if (v.state === 'internal') return '<span class="tag t-grey">not a job</span>';
  if (v.state === 'upcoming') return '<span class="tag t-grey">' + (v.age === 0 ? 'today' : 'upcoming') + '</span>';
  if (v.state === 'ok') {
    // Same day or next is on time; after that the lateness is the point.
    const tag = v.late != null && v.late > 1
      ? '<span class="tag ' + (v.late >= 3 ? 't-late' : 't-miss') + '">written up ' + v.late + ' days late</span>'
      : '<span class="tag t-ok">written up</span>';
    return tag + (v.writeUpBy ? '<div class="sub">' + esc(v.writeUpBy) + '</div>' : '');
  }
  if (v.state === 'late') return '<span class="tag t-late">no write-up · ' + v.age + ' days</span>';
  return '<span class="tag t-miss">no write-up</span>';
}

function rowHtml(v, showDate) {
  const time = v.from ? v.from + (v.to ? '–' + v.to : '') : '—';
  return '<div class="row">' +
    '<div class="when">' + (showDate ? parseD(v.date).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + '<br>' : '') + time + '</div>' +
    '<div class="what">' +
      '<div class="job">' + (v.jobNumber ? '<span class="num">' + esc(v.jobNumber) + '</span>' : '') + esc(v.jobName || v.name || v.client) +
        (v.kind === 'service' ? ' <span class="tag t-svc">service</span>' : '') + '</div>' +
      '<div class="sub">' + esc([v.client, v.site].filter(Boolean).join(' · ')) + '</div>' +
      (v.crew.length ? '<div class="crew">' + esc(v.crew.join(', ')) + '</div>' : '<div class="crew"><span class="tag t-grey">nobody assigned</span></div>') +
      (v.instructions ? '<div class="note">' + esc(v.instructions.slice(0, 400)) + (v.instructions.length > 400 ? '…' : '') + '</div>' : '') +
      writeUpHtml(v) +
    '</div>' +
    '<div class="status">' + statusTag(v) + '</div>' +
  '</div>';
}

// What the installer wrote, read. Claude's summary up front; the note itself one click away.
function writeUpHtml(v) {
  if (!v.writeUpText && !v.summaries.length) return '';
  const list = (label, xs, cls) => xs && xs.length
    ? '<div class="wu-sec' + (cls ? ' ' + cls : '') + '"><b>' + label + '</b><ul>' + xs.map(x => '<li>' + x + '</li>').join('') + '</ul></div>' : '';
  const parts = v.summaries.map(s =>
    (s.summary ? '<div class="wu-sum">' + esc(s.summary) + (s.returnVisit ? ' <span class="tag t-miss">return visit</span>' : '') + '</div>' : '') +
    list('Outstanding', (s.outstanding || []).map(o => esc(o.item) + (o.reason ? ' <span class="why">— ' + esc(o.reason) + '</span>' : '')), 'wu-out') +
    list('Office to do', (s.officeActions || []).map(esc), 'wu-act') +
    list('Client / builder', (s.clientBuilderNotes || []).map(esc)) +
    list('Done', (s.completed || []).map(esc))
  ).join('');
  return '<div class="wu">' + parts +
    (v.writeUpText ? '<details><summary>Installer\'s note</summary><div class="note">' + esc(v.writeUpText) + '</div></details>' : '') +
  '</div>';
}

/* Everything left hanging: unfinished work, return visits, office to-dos and what clients
   or builders said. This is the part Terry and the salespeople read.

   Items are ticked off, not aged off. Until this had a tick, an item left the list only
   by falling outside the date window -- so a list somebody had worked through looked
   exactly like one nobody had touched, and things vanished on a timer rather than because
   they were finished. Done items are stored on the visit (FollowUpsDone), so the tick
   holds for everyone rather than living in one person's browser. */

function fuKey(kind, text) { return kind + '|' + String(text).slice(0, 120); }
function fuDoneSet(v) { try { const a = JSON.parse(v.followUpsDone || '[]'); return new Set(Array.isArray(a) ? a : []); } catch { return new Set(); } }

async function toggleFollowUp(visitId, kind, text) {
  const raw = visits.find(f => (f.VisitId || '') === visitId);
  if (!raw || busy) return;
  const key = fuKey(kind, text);
  const done = fuDoneSet({ followUpsDone: raw.FollowUpsDone });
  done.has(key) ? done.delete(key) : done.add(key);
  const json = JSON.stringify([...done]);
  busy = true; render();
  try {
    if (!usingSample) {
      const lid = await listId(LIST);
      await graph('/sites/' + siteId + '/lists/' + lid + '/items/' + raw.itemId + '/fields',
        'PATCH', { FollowUpsDone: json });
    }
    raw.FollowUpsDone = json;
  } catch (e) {
    toast('Could not save that tick: ' + e.message, true);
  }
  busy = false; render();
}

function fuItem(v, kind, text, extra) {
  const key = fuKey(kind, text);
  const isDone = v.doneSet.has(key);
  const arg = "'" + esc(v.id).replace(/'/g, '&#39;') + "','" + kind + "','" + esc(text).replace(/'/g, '&#39;').replace(/\\/g, '') + "'";
  return '<li class="fu-item' + (isDone ? ' fu-done' : '') + '">' +
    '<input type="checkbox" ' + (isDone ? 'checked ' : '') + (busy ? 'disabled ' : '') +
      'onchange="toggleFollowUp(' + arg + ')" aria-label="Mark done"> ' +
    '<span>' + esc(text) + (extra || '') + '</span></li>';
}

function followUpsHtml(vs) {
  const rows = [];
  for (const v of vs) for (const s of v.summaries) {
    const out = s.outstanding || [], act = s.officeActions || [], cb = s.clientBuilderNotes || [];
    if (!out.length && !act.length && !cb.length && !s.returnVisit) continue;
    const total = out.length + act.length + cb.length;
    const open = out.filter(o => !v.doneSet.has(fuKey('out', o.item))).length +
      act.filter(x => !v.doneSet.has(fuKey('act', x))).length +
      cb.filter(x => !v.doneSet.has(fuKey('cb', x))).length;
    rows.push({ v, s, out, act, cb, total, open });
  }
  if (!rows.length) return '';
  const openRows = rows.filter(r => r.open > 0);
  const shown = showDoneFollowUps ? rows : openRows;
  const openItems = rows.reduce((n, r) => n + r.open, 0);
  const doneItems = rows.reduce((n, r) => n + (r.total - r.open), 0);
  if (!shown.length) {
    return '<div class="group fu"><div class="group-head"><span class="group-name">Follow-ups</span>' +
      '<span class="tag t-ok">all cleared</span>' +
      '<span class="group-meta">' + doneItems + ' ticked off' +
      ' · <a href="#" onclick="toggleDoneFollowUps();return false">show them</a></span></div></div>';
  }
  shown.sort((a, b) => b.v.date.localeCompare(a.v.date));
  return '<div class="group fu"><div class="group-head"><span class="group-name">Follow-ups</span>' +
    '<span class="group-meta">' + openItems + ' still open across ' + openRows.length + ' visit' + (openRows.length === 1 ? '' : 's') +
    (doneItems ? ' · ' + doneItems + ' done · <a href="#" onclick="toggleDoneFollowUps();return false">' +
      (showDoneFollowUps ? 'hide' : 'show') + ' them</a>' : '') + '</span></div>' +
    shown.map(({ v, s, out, act, cb }) =>
      '<div class="row"><div class="when">' + parseD(v.date).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + '</div>' +
      '<div class="what"><div class="job">' + (v.jobNumber ? '<span class="num">' + esc(v.jobNumber) + '</span>' : '') + esc(v.jobName || v.name || v.client) +
        (s.returnVisit ? ' <span class="tag t-miss">return visit</span>' : '') + '</div>' +
        '<div class="sub">' + esc([v.client, s.by || v.writeUpBy].filter(Boolean).join(' · ')) + '</div>' +
        (out.length ? '<div class="wu-sec wu-out"><b>Outstanding</b><ul>' + out.map(o => fuItem(v, 'out', o.item, o.reason ? ' <span class="why">— ' + esc(o.reason) + '</span>' : '')).join('') + '</ul></div>' : '') +
        (act.length ? '<div class="wu-sec wu-act"><b>Office to do</b><ul>' + act.map(x => fuItem(v, 'act', x)).join('') + '</ul></div>' : '') +
        (cb.length ? '<div class="wu-sec"><b>Client / builder</b><ul>' + cb.map(x => fuItem(v, 'cb', x)).join('') + '</ul></div>' : '') +
      '</div></div>').join('') +
  '</div>';
}

function render() {
  const all = visits.map(shape).filter(inWindow).filter(v => showInternal || !v.internal);
  const hiddenInternal = showInternal ? 0 : visits.map(shape).filter(inWindow).filter(v => v.internal).length;
  const past = all.filter(v => v.state !== 'upcoming' && v.state !== 'internal');
  const missing = past.filter(v => !v.done);
  const late = past.filter(v => v.state === 'late');

  /* One collapsible group, however the visits are sliced. The chevron and the count stay
     visible when closed, so a shut group still answers "is there anything outstanding
     here?" without being opened. */
  const groupHtml = (key, title, tags, meta, vs, showDate) => {
    const open = !closedGroups.has(key);
    const k = esc(key).replace(/'/g, '&#39;');
    return '<div class="group">' +
      '<div class="group-head" role="button" tabindex="0" aria-expanded="' + open + '" ' +
        'onclick="toggleGroup(\'' + k + '\')" ' +
        'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleGroup(\'' + k + '\')}">' +
        '<span class="chev">' + (open ? '▾' : '▸') + '</span>' +
        '<span class="group-name">' + title + '</span>' + (tags || '') +
        '<span class="group-meta">' + meta + '</span></div>' +
      (open ? vs.map(v => rowHtml(v, showDate)).join('') : '') +
    '</div>';
  };

  let body;
  lastGroupKeys = [];
  if (!all.length) {
    body = '<div class="empty">Nothing scheduled in the last ' + days + ' days' + (search ? ' matching “' + esc(search) + '”' : '') + '.</div>';
  } else if (view === 'day') {
    const byDay = new Map();
    for (const v of all) { if (!byDay.has(v.date)) byDay.set(v.date, []); byDay.get(v.date).push(v); }
    body = [...byDay.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([date, vs]) => {
      vs.sort((a, b) => (a.from || '').localeCompare(b.from || ''));
      const miss = vs.filter(v => v.state === 'missing' || v.state === 'late').length;
      lastGroupKeys.push('d:' + date);
      return groupHtml('d:' + date, dayLabel(date), '',
        vs.length + ' visit' + (vs.length === 1 ? '' : 's') + (miss ? ' · ' + miss + ' without a write-up' : ''),
        vs, false);
    }).join('');
  } else if (view === 'person') {
    const byPerson = new Map();
    for (const v of all) {
      const names = v.crew.length ? v.crew : ['(nobody assigned)'];
      for (const n of names) { if (!byPerson.has(n)) byPerson.set(n, []); byPerson.get(n).push(v); }
    }
    body = [...byPerson.entries()].sort((a, b) => {
      const m = x => x[1].filter(v => v.state === 'missing' || v.state === 'late').length;
      return m(b) - m(a) || a[0].localeCompare(b[0]);
    }).map(([name, vs]) => {
      vs.sort((a, b) => (b.date + b.from).localeCompare(a.date + a.from));
      const miss = vs.filter(v => v.state === 'missing' || v.state === 'late').length;
      const done = vs.filter(v => v.done).length;
      lastGroupKeys.push('p:' + name);
      return groupHtml('p:' + name, esc(name),
        miss ? '<span class="tag t-miss">' + miss + ' to write up</span>' : '',
        vs.length + ' visit' + (vs.length === 1 ? '' : 's') + ' · ' + done + ' written up',
        vs, true);
    }).join('');
  } else {
    /* By job: every visit to one client or job together, oldest first, so the whole
       history of a job reads top to bottom -- what was done, what was left, what came
       back. This is the view for "what is going on at the Pollards'", which neither a
       day nor an installer answers. */
    const byJob = new Map();
    for (const v of all) {
      const key = v.jobNumber || v.jobName || v.client || v.site || '(no job)';
      if (!byJob.has(key)) byJob.set(key, []);
      byJob.get(key).push(v);
    }
    body = [...byJob.entries()].sort((a, b) => {
      const newest = x => x[1].reduce((n, v) => v.date > n ? v.date : n, '');
      return newest(b).localeCompare(newest(a));
    }).map(([key, vs]) => {
      vs.sort((a, b) => (a.date + a.from).localeCompare(b.date + b.from));   // oldest first
      const miss = vs.filter(v => v.state === 'missing' || v.state === 'late').length;
      const done = vs.filter(v => v.done).length;
      const open = vs.reduce((n, v) => n + v.summaries.reduce((m, s) => m + (s.outstanding || []).length, 0), 0);
      const first = vs[0];
      lastGroupKeys.push('j:' + key);
      return groupHtml('j:' + key,
        (first.jobNumber ? '<span class="num">' + esc(first.jobNumber) + '</span> ' : '') + esc(first.jobName || first.client || key),
        (open ? '<span class="tag t-miss">' + open + ' outstanding</span>' : '') +
          (miss ? '<span class="tag t-late">' + miss + ' to write up</span>' : ''),
        esc(first.client || '') + ' · ' + vs.length + ' visit' + (vs.length === 1 ? '' : 's') + ' · ' + done + ' written up',
        vs, true);
    }).join('');
  }

  document.getElementById('app').innerHTML =
    (usingSample ? '<div class="banner" style="text-align:center">Sample data — the sync has not written to SharePoint yet</div>' : '') +
    '<div class="wrap"><h1 class="page">Field Log</h1>' +
    '<p class="page-sub">Every visit D-Tools had scheduled, recorded as it happened. Rescheduled or deleted work keeps its record here.</p>' +
    (visits.some(f => f.WriteUpAt) ? '' :
      '<div class="banner"><b>Write-ups aren\'t being matched yet.</b> Once the work-order emails reach the shared mailbox, each visit will show whether its write-up came in and what it said. Until then every past visit reads “no write-up”.</div>') +
    '<div class="controls">' +
      '<div><label class="fld">View</label><div class="seg" role="tablist">' +
        '<button role="tab" aria-selected="' + (view === 'day') + '" class="' + (view === 'day' ? 'on' : '') + '" onclick="setView(\'day\')">By day</button>' +
        '<button role="tab" aria-selected="' + (view === 'person') + '" class="' + (view === 'person' ? 'on' : '') + '" onclick="setView(\'person\')">By installer</button>' +
        '<button role="tab" aria-selected="' + (view === 'job') + '" class="' + (view === 'job' ? 'on' : '') + '" onclick="setView(\'job\')">By job</button>' +
      '</div></div>' +
      '<div><label class="fld">Show</label><select onchange="setDays(this.value)">' +
        // 365 covers "everything on this job" -- a job's history is the point of the job
        // view, and it does not stop at thirty days.
        [7, 14, 30, 90, 365].map(d => '<option value="' + d + '"' + (d === days ? ' selected' : '') + '>' +
          (d >= 365 ? 'everything' : 'last ' + d + ' days') + '</option>').join('') +
      '</select></div>' +
      '<div style="flex:1 1 200px"><label class="fld" for="q">Find</label><input id="q" style="width:100%" placeholder="Job, client, site or installer" value="' + esc(search) + '" oninput="setSearch(this.value)"></div>' +
      '<div style="display:flex;gap:6px"><button class="btn" onclick="toggleInternal()">' +
        (showInternal ? 'Hide' : 'Show') + ' A-team &amp; time off' + (hiddenInternal ? ' (' + hiddenInternal + ')' : '') + '</button>' +
        '<button class="btn" onclick="setAllGroups(true)">Expand all</button>' +
        '<button class="btn" onclick="setAllGroups(false)">Collapse all</button>' +
        '<button class="btn" onclick="load()">Refresh</button></div>' +
    '</div>' +
    '<div class="totals">' +
      tot('', all.length, 'visits') +
      tot('', past.filter(v => v.done).length, 'written up') +
      tot('miss', missing.length, 'to write up') +
      tot('late', late.length, '3 days or more') +
    '</div>' + followUpsHtml(all) + body + '</div>';
}

function tot(cls, n, label) { return '<div class="tot ' + cls + '"><div class="tot-n">' + n + '</div><div class="tot-l">' + label + '</div></div>'; }
function setView(v) { view = v; try { localStorage.setItem('field.view', v); } catch {} render(); }
function setDays(d) { days = Number(d); render(); }
function toggleInternal() { showInternal = !showInternal; render(); }
function setSearch(v) {
  search = v; render();
  const el = document.getElementById('q');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
