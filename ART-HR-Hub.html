<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ART HR Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://www.msftauth.net/msal/browser/2.38.0/js/msal-browser.min.js';document.head.appendChild(s);"></script>
<link rel="stylesheet" href="art-theme.css">
<style>
/* Legacy names used throughout this file, mapped onto art-theme.css.
   NOTE: --ink was doing two jobs in the original (primary text AND the dark
   sidebar/button fill). It now means TEXT only; the places that used it as a
   dark FILL were switched to --surface2 individually. */
:root{
  --paper:var(--bg); --panel:var(--surface);
  --ink:var(--text); --ink2:var(--text-mid);
  --muted:var(--text-mid); --faint:var(--text-dim);
  --line:var(--border); --line2:var(--border);
  --red:var(--accent); --red2:var(--accent-deep); --redwash:var(--accent-dim);
  --ok:var(--green); --okwash:var(--green-dim);
  --warn:var(--yellow); --warnwash:var(--yellow-dim);
  --lock:var(--text-dim); --lockwash:var(--surface2);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --r:8px;
  --disp:'Barlow Condensed',Oswald,'Arial Narrow',sans-serif;
  --body:var(--font);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
/* ---------- positions ---------- */
.posstats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.posds{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 13px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.posds b{color:var(--ink)}
.postabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  width:max-content;margin-bottom:6px}
.postabs button{background:none;border:0;color:var(--muted);font-family:var(--disp);
  text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;font-weight:600;
  padding:7px 15px;cursor:pointer}
.postabs button+button{border-left:1px solid var(--line)}
.postabs button.on{background:var(--red);color:#fff}
.posdiv{display:flex;align-items:baseline;gap:10px;margin:22px 0 2px;padding-bottom:6px;
  border-bottom:1px solid var(--line)}
.posdiv h4{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:13px;
  font-weight:600;margin:0;color:var(--ink)}
.posdiv span{font-size:11px;color:var(--faint)}
.posrow{border-bottom:1px solid var(--line2)}
.posbtn{width:100%;display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:baseline;
  background:none;border:0;color:inherit;text-align:left;padding:11px 4px;cursor:pointer}
.posbtn:hover{background:var(--panel)}
.poscode{font-family:var(--disp);font-size:12px;letter-spacing:.08em;color:var(--faint)}
.posrow.on .poscode{color:var(--red)}
.posname{font-size:14px;font-weight:600}
.poswho{font-size:11.5px;color:var(--muted);white-space:nowrap}
.posflag{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);
  margin-left:7px;vertical-align:middle}
.pospanel{padding:2px 4px 22px 86px}
.pospurpose{font-size:14.5px;margin:0 0 16px;padding-left:12px;border-left:2px solid var(--red)}
.posmeta{font-size:11.5px;color:var(--faint);margin-bottom:12px}
.possec{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px;
  color:var(--red);margin:16px 0 6px;font-weight:600}
.poslist{margin:0;padding:0;list-style:none}
.poslist li{position:relative;padding-left:14px;margin-bottom:5px;color:var(--muted);font-size:13px}
.poslist li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:var(--faint)}
.postab{width:100%;border-collapse:collapse}
.postab th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
  text-align:left;font-weight:400;padding:5px 8px 5px 0;border-bottom:1px solid var(--line)}
.postab td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line2);font-size:13px;color:var(--muted)}
.postab td:last-child{width:130px;font-family:var(--disp);letter-spacing:.03em;color:var(--ink)}
.postab td.blank{color:var(--red)}
.posnote{margin-top:16px;padding:10px 13px;background:var(--redwash);border-left:2px solid var(--red);
  font-size:12.5px;color:var(--muted);border-radius:0 4px 4px 0}
.posnote b{color:var(--ink)}
.possig{margin-top:18px;padding-top:14px;border-top:1px solid var(--line2);
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.posperson{border-bottom:1px solid var(--line2);padding:14px 4px}
.pphead{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.pphead h4{margin:0;font-size:15px;font-weight:600}
.ppload{display:flex;gap:3px;align-items:center;margin-left:auto}
.ppload i{width:8px;height:8px;background:var(--red);border-radius:1px;display:block}
.ppload b{font-size:11px;color:var(--faint);font-weight:400;margin-left:5px}
.ppchips{display:flex;flex-wrap:wrap;gap:6px}
.ppchip{background:var(--lockwash);border:1px solid var(--line);border-radius:5px;padding:5px 9px;
  font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;gap:7px;align-items:baseline}
.ppchip:hover{border-color:var(--red);color:var(--ink)}
.ppchip code{font-family:var(--disp);font-size:10.5px;color:var(--faint)}
.ppacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
@media(max-width:700px){
  .posbtn{grid-template-columns:60px 1fr}
  .poswho{grid-column:2;font-size:10.5px}
  .pospanel{padding-left:6px}
}

.app{display:grid;grid-template-columns:206px 1fr;min-height:100vh}
.side{background:var(--surface);color:var(--text);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .mark{display:flex;align-items:baseline;gap:7px}
.brand .art{
  font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:.02em;
  background:#fff;color:#14161c;padding:0 7px;line-height:1.18;display:inline-block;
}
.brand .sub{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.06em;color:var(--text);text-transform:uppercase;line-height:1.1}
.brand .bar{height:3px;background:var(--red);margin-top:6px;width:74px}
.brand .hub{
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.22em;
  font-size:10.5px;color:rgba(255,255,255,.62);margin-top:9px;font-weight:600;
}
nav{padding:9px 8px;flex:1;overflow-y:auto}
.navb{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:rgba(255,255,255,.72);cursor:pointer;
  padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:500;
  transition:background .12s,color .12s;
}
.navb:hover{background:var(--surface2);color:var(--text)}
.navb.on{background:var(--red);color:var(--on-accent);font-weight:600}
.navb .ic{width:17px;text-align:center;flex:none;opacity:.95}
.navb .pip{
  margin-left:auto;background:var(--red);color:var(--on-accent);font-size:10.5px;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 5px;
}
.navb.on .pip{background:var(--on-accent);color:var(--accent-deep)}
.sidefoot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.42);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  background:var(--panel);border-bottom:1px solid var(--line);padding:13px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30;
}
.top h1{font-family:var(--disp);font-size:25px;font-weight:600;letter-spacing:.01em;margin:0;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:12.5px;margin-left:-6px}
.top .sp{flex:1}
.wrap{padding:20px 22px 60px;max-width:1220px}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.15em;
  font-size:11px;font-weight:600;color:var(--muted);
}
h2.sec{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:19px;font-weight:600;margin:0 0 3px}
.lede{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:70ch}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{padding:12px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card .hd h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:15px;font-weight:600;margin:0}
.card .bd{padding:15px}
.card .bd.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- stat ---------- */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.stat .n{font-family:var(--disp);font-size:33px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--muted);margin-top:5px;font-weight:600}
.stat.alert{border-color:var(--red);background:var(--redwash)}
.stat.alert .n{color:var(--red)}
.stat.good .n{color:var(--ok)}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500;
  transition:background .12s,border-color .12s;
}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--surface2);border-color:var(--text-dim)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--red2);border-color:var(--red2)}
.btn.dark{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.dark:hover{background:var(--ink2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:11px}
label.f .lb{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:62px;resize:vertical}
.chk{display:flex;align-items:center;gap:7px;margin-bottom:9px;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--red);flex:none}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse}
th{
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
  font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2);
}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
.num{font-variant-numeric:tabular-nums}
.nm{font-weight:600}
.sm2{font-size:12px;color:var(--muted)}

/* ---------- tags ---------- */
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;
  font-size:11px;font-weight:600;font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;
  border:1px solid transparent;white-space:nowrap;
}
.t-ok{background:var(--okwash);color:var(--ok);border-color:rgba(62,207,122,.4)}
.t-warn{background:var(--warnwash);color:var(--warn);border-color:rgba(232,163,61,.4)}
.t-red{background:var(--redwash);color:var(--red);border-color:rgba(227,74,74,.4)}
.t-grey{background:var(--lockwash);color:var(--lock);border-color:var(--border)}
.t-ink{background:var(--surface2);color:var(--text)}
.key{background:var(--surface2);color:var(--text);font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.1em;padding:1px 5px;border-radius:3px;text-transform:uppercase}

/* ---------- season board (signature) ---------- */
.board{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.board table{border-collapse:separate;border-spacing:0;min-width:max-content}
.board th,.board td{border:0;padding:0}
.bw{width:34px;min-width:34px}
.bname{
  width:158px;min-width:158px;position:sticky;left:0;z-index:2;background:var(--panel);
  border-right:1px solid var(--line);padding:0 11px!important;
}
thead .bname{background:var(--surface2);z-index:3}
.board thead th{
  height:44px;border-bottom:1px solid var(--line);background:var(--surface2);
  font-family:var(--disp);font-size:10px;letter-spacing:.03em;color:var(--muted);
  text-align:center;vertical-align:middle;font-weight:600;
}
.board thead th .mo{display:block;font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.board tbody td{height:31px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}
.board tbody tr:last-child td{border-bottom:0}
.cellwrap{position:relative;height:100%}
.blk{position:absolute;inset:3px 1px;border-radius:3px}
.blk.appr{background:var(--ok)}
.blk.bid{background:repeating-linear-gradient(45deg,var(--yellow),var(--yellow) 4px,#c98a2e 4px,#c98a2e 8px)}
.blk.pend{background:var(--yellow)}
.blk.dec{background:var(--surface2)}
.cap{height:26px}
.capcell{position:relative;height:100%;background:var(--surface2)}
.capfill{position:absolute;left:2px;right:2px;bottom:3px;border-radius:2px;background:var(--ok);opacity:.5}
.capfill.mid{background:var(--yellow);opacity:.65}
.capfill.full{background:var(--red);opacity:.75}
.capnum{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.stat-col{background:var(--accent-dim)}
.legend{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-top:11px;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:5px}

/* ---------- misc ---------- */
.banner{border-radius:var(--r);padding:12px 15px;margin-bottom:16px;border:1px solid;display:flex;gap:11px;align-items:flex-start}
.banner .bi{font-size:16px;line-height:1.2;flex:none}
.b-ink{background:var(--surface2);color:var(--text);border-color:var(--border)}
.b-red{background:var(--redwash);border-color:rgba(227,74,74,.4);color:var(--accent)}
.b-ok{background:var(--okwash);border-color:rgba(62,207,122,.4);color:var(--green)}
.b-warn{background:var(--warnwash);border-color:rgba(232,163,61,.4);color:var(--yellow)}
.banner b{display:block;font-weight:700;margin-bottom:2px}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .big{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(22,24,29,.42);display:grid;place-items:center;z-index:100;padding:18px}
.modal .box{background:var(--panel);border-radius:10px;max-width:540px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:17px;margin:0;font-weight:600}
.modal .mb{padding:18px}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--surface2);border-radius:0 0 10px 10px}
.x{margin-left:auto;background:none;border:0;font-size:21px;cursor:pointer;color:var(--muted);line-height:1;padding:0 3px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:7px;z-index:200;box-shadow:0 8px 26px rgba(0,0,0,.3);font-size:13.5px;max-width:90vw}
.pbar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--ok)}
.mini{font-size:11.5px;color:var(--muted);margin-top:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.filters select,.filters input{width:auto;min-width:132px}
.avail{border-radius:var(--r);padding:12px 14px;margin-top:12px;border:1px solid;font-size:13px}
.a-ok{background:var(--okwash);border-color:rgba(62,207,122,.4);color:var(--green)}
.a-no{background:var(--redwash);border-color:rgba(227,74,74,.4);color:var(--accent)}
.a-warn{background:var(--warnwash);border-color:rgba(232,163,61,.4);color:var(--yellow)}
.avail b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;margin-bottom:3px}
.avail ul{margin:6px 0 0;padding-left:17px}
/* ---------- auth gate ---------- */
.authgate{min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:20px}
.authgate .box{background:var(--panel);border-radius:10px;max-width:380px;width:100%;padding:26px 26px 24px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
.authgate .mark{display:flex;align-items:baseline;gap:7px;justify-content:center;margin-bottom:8px}
.authgate .art{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.02em;background:#fff;color:#14161c;padding:0 8px;line-height:1.2;display:inline-block}
.authgate .sub{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--text);text-transform:uppercase;line-height:1.15;text-align:left}
.authgate .hub{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--muted);margin:9px 0 18px;font-weight:600}
.authgate p{color:var(--muted);font-size:13px;margin:0 0 16px}
.authgate .btn{width:100%}
.authgate .btnrow .btn{width:auto;flex:1}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column}
  nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
  .navb{width:auto}
  .sidefoot{display:none}
  .wrap{padding:15px 13px 50px}
}
</style>
<div id="root"></div>
<script>
"use strict";

/* =========================================================================
   AUTH  (MSAL / shared Advance Electronics app registration)
   ========================================================================= */
const TENANT_ID="2e6ff905-d709-43db-94a5-c11d318118ee";
const CLIENT_ID="7b0d92bf-6e34-497e-9938-7860ba268631";
const SITE_HOSTNAME="advanceelectronics.sharepoint.com";
const SITE_PATH="/sites/ART43";
const SCOPES=["https://graph.microsoft.com/Sites.ReadWrite.All","offline_access"];

let msalInstance=null, accessToken=null, authAccount=null;

let msalReady=null;
function initMsal(){
  if(msalReady) return msalReady;
  if(typeof msal==="undefined"){
    authErr="Microsoft sign-in library failed to load. Refresh the page.";
    phaseAuth="error"; render();
    return Promise.reject(new Error("msal undefined"));
  }
  msalInstance=new msal.PublicClientApplication({
    auth:{ clientId:CLIENT_ID, authority:"https://login.microsoftonline.com/"+TENANT_ID,
           redirectUri:window.location.href.split("#")[0].split("?")[0] },
    cache:{ cacheLocation:"localStorage", storeAuthStateInCookie:true }
  });
  msalReady=msalInstance.initialize().then(()=>msalInstance.handleRedirectPromise()).then(resp=>{
    if(resp&&resp.accessToken) accessToken=resp.accessToken;
    const accounts=msalInstance.getAllAccounts();
    if(accounts.length>0){ authAccount=accounts[0]; afterSignedIn(); }
    else{ phaseAuth="signedout"; render(); }
  }).catch(e=>{ authErr=e.message; phaseAuth="error"; render(); });
  return msalReady;
}

/* Clears MSAL's stuck "interaction in progress" flag left behind by an
   interrupted redirect — otherwise it forces a full browser restart. */
function clearStuckInteraction(){
  try{
    [sessionStorage,localStorage].forEach(store=>{
      for(let i=store.length-1;i>=0;i--){
        const k=store.key(i);
        if(k&&(k.indexOf("interaction.status")>-1||(k.indexOf("msal.")===0&&k.indexOf("request")>-1)))
          store.removeItem(k);
      }
    });
  }catch(e){}
}
function signIn(){
  initMsal().then(()=>msalInstance.loginRedirect({scopes:SCOPES})).catch(e=>{
    const code=String((e&&(e.errorCode||e.message))||"");
    if(code.indexOf("interaction_in_progress")>-1){
      clearStuckInteraction();
      msalInstance.loginRedirect({scopes:SCOPES}).catch(e2=>{ authErr="Sign-in failed: "+(e2.message||e2); phaseAuth="error"; render(); });
    }else{ authErr="Sign-in failed: "+(e.message||e); phaseAuth="error"; render(); }
  });
}
async function getToken(){
  const accounts=msalInstance.getAllAccounts();
  if(!accounts.length) throw new Error("Not signed in");
  try{
    const resp=await msalInstance.acquireTokenSilent({scopes:SCOPES,account:accounts[0]});
    accessToken=resp.accessToken; return accessToken;
  }catch(e){
    await msalInstance.acquireTokenRedirect({scopes:SCOPES,account:accounts[0]});
    throw new Error("Redirecting…");
  }
}

let siteId=null, listIds={};

async function spFetch(method,path,body){
  const tok=await getToken();
  const opts={method,headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json",
    "Prefer":"HonorNonIndexedQueriesWarningMayFailRandomly"}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch("https://graph.microsoft.com/v1.0"+path,opts);
  if(!r.ok){
    const e=await r.json().catch(()=>({}));
    console.error("Graph "+method+" "+path,body,e);
    const inner=e&&e.error&&e.error.innerError;
    const detail=[e&&e.error&&e.error.message, inner&&(inner.message||inner["request-id"])].filter(Boolean).join(" — ");
    throw new Error(detail||"HTTP "+r.status);
  }
  if(r.status===204) return null;
  return r.json();
}
async function getSiteId(){
  if(siteId) return siteId;
  const d=await spFetch("GET","/sites/"+SITE_HOSTNAME+":"+SITE_PATH);
  siteId=d.id; return siteId;
}
async function getListId(name){
  if(listIds[name]) return listIds[name];
  const sid=await getSiteId();
  const d=await spFetch("GET","/sites/"+sid+"/lists/"+encodeURIComponent(name));
  listIds[name]=d.id; return d.id;
}
async function getItems(listName){
  const sid=await getSiteId(), lid=await getListId(listName);
  let url="/sites/"+sid+"/lists/"+lid+"/items?expand=fields&$top=999";
  let items=[], next=null;
  do{
    const d=await spFetch("GET", next?next.replace("https://graph.microsoft.com/v1.0",""):url);
    items=items.concat(d.value||[]); next=d["@odata.nextLink"]||null;
  }while(next);
  return items;
}
async function createItem(listName,fields){
  const sid=await getSiteId(), lid=await getListId(listName);
  return spFetch("POST","/sites/"+sid+"/lists/"+lid+"/items",{fields});
}

  const sid=await getSiteId(), lid=await getListId(listName);

}
async function deleteItem(listName,itemId){
  const sid=await getSiteId(), lid=await getListId(listName);

/* =========================================================================
   STORAGE ADAPTER
   -------------------------------------------------------------------------
   Whole-object load()/save() so the rest of the app is untouched — but
   save() diffs against `synced` (captured on load and after each save) and
   only pushes the records that actually changed to Graph, per collection.
   ========================================================================= */
let synced=null; // {employees:{appId:{spId,json}}, ..., settingsSpId, settingsJson}

async function saveCollection(key,current){
  const listName=LIST[key], map=M[key], prev=synced[key];
  const seen=new Set();
  for(const rec of current){
    seen.add(rec.id);
    const json=JSON.stringify(rec), have=prev[rec.id];
    if(!have){
      const created=await createItem(listName,map.to(rec));
      prev[rec.id]={spId:created.id,json};
    }else if(have.json!==json){
      await updateItem(listName,have.spId,map.to(rec));
      have.json=json;
    }
  }
  for(const appId of Object.keys(prev)){
    if(!seen.has(appId)){ await deleteItem(listName,prev[appId].spId); delete prev[appId]; }
  }
}
async function saveSettings(settings){
  const json=JSON.stringify(settings);
  if(synced.settingsSpId){
    if(synced.settingsJson!==json){ await updateItem(LIST.settings,synced.settingsSpId,{Data:json}); synced.settingsJson=json; }
  }else{
    const created=await createItem(LIST.settings,{Title:"HR Settings",Data:json});
    synced.settingsSpId=created.id; synced.settingsJson=json;
  }
}

const Store={
  async load(){
    await getSiteId();
    const OPTIONAL=["posAcks"];
    for(const key of Object.keys(LIST)){
      try{ await getListId(LIST[key]); }
      catch(e){ if(!OPTIONAL.includes(key)) throw e; }
    }
    const raw={};
    await Promise.all(Object.keys(LIST).map(async key=>{
      try{ raw[key]=await getItems(LIST[key]); }
      catch(e){ if(OPTIONAL.includes(key)){ raw[key]=[]; } else { throw e; } }
    }));
    synced={};
    const db={};
    for(const key of COLLECTIONS){
      synced[key]={};
      db[key]=raw[key].map(it=>{
        const rec=M[key].from(it.fields||{});
        synced[key][rec.id]={spId:it.id,json:JSON.stringify(rec)};
        return rec;
      });
    }
    const sItem=raw.settings[0];
    if(sItem){
      synced.settingsSpId=sItem.id;
      synced.settingsJson=(sItem.fields||{}).Data||"{}";
      try{ db.settings=JSON.parse(synced.settingsJson); }catch(e){ db.settings=seed().settings; }
    }else{
      db.settings=seed().settings; db.settings.demo=false;
    }
    db.policies=seed().policies;
    return db;
  },
  async save(db){
    try{
      for(const key of COLLECTIONS) await saveCollection(key,db[key]);
      await saveSettings(db.settings);
      return true;
    }catch(e){ console.error(e); toast("Sync failed: "+e.message); return false; }
  }
};

/* ---------------- date helpers ---------------- */
const DAY=86400000;
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const parse=s=>{const[a,b,c]=String(s).split("-").map(Number);return new Date(a,b-1,c);};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const addD=(d,n)=>new Date(parse(iso(d)).getTime()+n*DAY);
const days=(a,b)=>Math.round((parse(iso(b))-parse(iso(a)))/DAY);
const fmt=s=>{if(!s)return"—";const d=parse(s);return d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});};
const fmtShort=s=>{if(!s)return"—";const d=parse(s);return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"});};
const rangeDays=(a,b)=>{const o=[];let d=parse(a),e=parse(b);while(d<=e){o.push(iso(d));d=new Date(d.getTime()+DAY);}return o;};
const yrs=s=>{if(!s)return 0;return Math.floor(days(s,today())/365.25);};
const uid=()=>Math.random().toString(36).slice(2,10);

/* Manitoba general holidays (9). Recomputed per year. */
function nthWeekday(y,m,wd,n){let d=new Date(y,m,1),c=0;while(true){if(d.getDay()===wd){c++;if(c===n)return iso(d);}d=new Date(d.getTime()+DAY);}}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function statHolidays(y){
  const gf=iso(new Date(easter(y).getTime()-2*DAY));
  let vd=new Date(y,4,25);while(vd.getDay()!==1)vd=new Date(vd.getTime()-DAY);
  return [
    {d:y+"-01-01",n:"New Year's Day"},
    {d:nthWeekday(y,1,1,3),n:"Louis Riel Day"},
    {d:gf,n:"Good Friday"},
    {d:iso(vd),n:"Victoria Day"},
    {d:y+"-07-01",n:"Canada Day"},
    {d:nthWeekday(y,8,1,1),n:"Labour Day"},
    {d:y+"-09-30",n:"Truth & Reconciliation"},
    {d:nthWeekday(y,9,1,2),n:"Thanksgiving"},
    {d:y+"-12-25",n:"Christmas Day"}
  ];
}

/* =========================================================================
   TIME-OFF ENGINE
   ========================================================================= */

/* Who is already off on a given date, from approved requests only. */
function offOn(db,date,exceptId){
  return db.timeOff.filter(r=>r.status==="approved"&&r.id!==exceptId&&date>=r.start&&date<=r.end)
           .map(r=>db.employees.find(e=>e.id===r.empId)).filter(e=>e&&e.active!==false);
}

/* Check a candidate range against the caps. Returns {ok, conflicts:[...]} */
function checkRange(db,empId,start,end,exceptId){
  const s=db.settings, me=db.employees.find(e=>e.id===empId);
  const conflicts=[];
  for(const d of rangeDays(start,end)){
    const off=offOn(db,d,exceptId);
    if(off.length>=s.maxOffTotal){
      conflicts.push({date:d,why:"crew cap",who:off.map(e=>e.name)});
      continue;
    }
    if(me&&me.keyTech){
      const keys=off.filter(e=>e.keyTech);
      if(keys.length>=s.maxKeyOff){
        conflicts.push({date:d,why:"lead tech cap",who:keys.map(e=>e.name)});
      }
    }
  }
  /* collapse consecutive days into blocks for readable messaging */
  const blocks=[];
  for(const c of conflicts){
    const last=blocks[blocks.length-1];
    if(last&&last.why===c.why&&days(last.end,c.date)===1&&String(last.who)===String(c.who)) last.end=c.date;
    else blocks.push({start:c.date,end:c.date,why:c.why,who:c.who});
  }
  return {ok:conflicts.length===0,conflicts:blocks,dayCount:conflicts.length};
}

/* Seniority allocation. Longest-serving employee wins; ties break on
   submission time. Runs over all bids for the season and marks each
   approved or declined, with the reason recorded. */
function runAllocation(db){
  const s=db.settings;
  const bids=db.timeOff.filter(r=>r.status==="bid");
  /* clear any prior auto-decisions so the run is repeatable */
  bids.forEach(r=>{r.status="bid";r.reason="";});
  const ranked=bids.slice().sort((a,b)=>{
    const ea=db.employees.find(e=>e.id===a.empId), eb=db.employees.find(e=>e.id===b.empId);
    const ha=ea?ea.hired:"9999", hb=eb?eb.hired:"9999";
    if(ha!==hb) return ha<hb?-1:1;          /* earlier hire date = more senior */
    return a.submitted<b.submitted?-1:1;     /* then first in */
  });
  const out={approved:0,declined:0,order:[]};
  for(const r of ranked){
    const emp=db.employees.find(e=>e.id===r.empId);
    const chk=checkRange(db,r.empId,r.start,r.end,r.id);
    if(chk.ok){
      r.status="approved"; r.decidedAt=iso(today()); r.reason="Granted on seniority ("+yrs(emp&&emp.hired)+" yrs).";
      out.approved++;
    }else{
      r.status="declined"; r.decidedAt=iso(today());
      const c=chk.conflicts[0];
      r.reason="Full on "+fmtShort(c.start)+(c.start!==c.end?"–"+fmtShort(c.end):"")+" — "+c.why+" ("+c.who.join(", ")+" already granted).";
      out.declined++;
    }
    out.order.push({name:emp?emp.name:"?",yrs:yrs(emp&&emp.hired),status:r.status});
  }
  return out;
}

function empByFirst(n){
  const t=(n||"").trim().toLowerCase();

function posMark(code,empId,status){
  if(!isManager) return;
  let r=posRec(code,empId);
  if(!r){ r={id:uid(),empId,code,status:"",sent:"",signed:"",envId:""}; db.posAcks.push(r); }
  if(status==="sent"){ r.status="sent"; r.sent=iso(today()); r.signed=""; }

  else { r.status=""; r.sent=""; r.signed=""; }

}

    else { r.status="completed"; r.signed=iso(today()); if(!r.sent) r.sent=iso(today()); }
  });
  commit(name+" — all marked "+(status==="sent"?"sent":"signed"));
}

  const e=empByFirst(name);

const OPEN_TO_ALL_FROM = '2027-01-01';   // takeover date

function accessAllowed(email){

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function emp(id){return db.employees.find(e=>e.id===id);}

async function commit(msg){ await Store.save(db); if(msg) toast(msg); render(); }
function toast(m){
  clearTimeout(toastT);
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=m; el.style.display="block";
  toastT=setTimeout(()=>{el.style.display="none";},2600);
}

/* =========================================================================
   ALERTS  — one place that decides what needs attention
   ========================================================================= */
function alerts(){
  const A={certExp:[],certSoon:[],vehDue:[],toolLong:[],pending:[],ackMissing:[],reviews:[]};
  const t=iso(today());
  db.training.forEach(r=>{
    if(!r.expires)return;
    const d=days(t,r.expires);
    if(d<0)A.certExp.push({...r,d});
    else if(d<=60)A.certSoon.push({...r,d});
  });
  db.vehicles.forEach(v=>{
    ["regDue","insDue","safetyDue"].forEach(k=>{
      if(!v[k])return;
      const d=days(t,v[k]);
      const label={regDue:"Registration",insDue:"Insurance",safetyDue:"Safety inspection"}[k];
      if(d<=30)A.vehDue.push({veh:v,label,date:v[k],d});
    });
    const last=db.service.filter(s=>s.vehId===v.id&&/oil/i.test(s.type)).sort((a,b)=>b.date<a.date?-1:1)[0];
    if(last){
      const km=v.odo-last.odo, mo=days(last.date,t)/30.4;
      if(km>=db.settings.oilKm||mo>=db.settings.oilMonths)
        A.vehDue.push({veh:v,label:"Oil change",date:last.date,d:-1,km});
    }else A.vehDue.push({veh:v,label:"Oil change",date:"",d:-1,km:null});
  });
  db.tools.forEach(x=>{ if(x.status==="out"&&x.since&&days(x.since,t)>30) A.toolLong.push(x); });
  A.pending=db.timeOff.filter(r=>r.status==="pending");
  db.policies.filter(p=>p.req).forEach(p=>{
    db.employees.filter(e=>e.active).forEach(e=>{
      if(!db.acks.some(a=>a.empId===e.id&&a.polId===p.id)) A.ackMissing.push({p,e});
    });
  });
  db.employees.filter(e=>e.active).forEach(e=>{
    if(!e.hired)return;
    const anniv=new Date(today().getFullYear(),parse(e.hired).getMonth(),parse(e.hired).getDate());
    let d=days(t,iso(anniv)); if(d<0)d+=365;
    if(d<=30)A.reviews.push({e,d,due:iso(anniv)});
  });
  return A;
}

/* =========================================================================
   VIEW: TIME OFF  (season board + availability + queues)
   ========================================================================= */
function seasonWeeks(){
  const s=db.settings;
  let d=parse(s.seasonStart);
  while(d.getDay()!==1) d=new Date(d.getTime()-DAY);   /* back up to Monday */
  const w=[], end=parse(s.seasonEnd);
  while(d<=end){ w.push(iso(d)); d=new Date(d.getTime()+7*DAY); }
  return w;
}
function weekLoad(wkStart){
  const d1=rangeDays(wkStart,iso(addD(wkStart,6)));
  let peak=0, peakKey=0;
  d1.forEach(d=>{
    const o=offOn(db,d);
    peak=Math.max(peak,o.length);
    peakKey=Math.max(peakKey,o.filter(e=>e.keyTech).length);
  });
  return {peak,peakKey};
}
function vTimeOff(){
  const s=db.settings, ph=phase(), weeks=seasonWeeks();
  const bids=db.timeOff.filter(r=>r.status==="bid");
  const pend=db.timeOff.filter(r=>r.status==="pending");
  const stats=statHolidays(parse(s.seasonStart).getFullYear()).filter(h=>h.d>=weeks[0]&&h.d<=s.seasonEnd);
  const crew=db.employees.filter(e=>e.active).sort((a,b)=>a.hired<b.hired?-1:1);

  /* --- season board rows --- */
  const head=weeks.map(w=>{
    const d=parse(w), hol=stats.find(h=>h.d>=w&&h.d<=iso(addD(w,6)));
    return `<th class="bw${hol?" stat-col":""}" title="${hol?esc(hol.n):""}">
      <span class="mo">${d.toLocaleDateString("en-CA",{month:"short"})}</span>${d.getDate()}${hol?'<div style="color:var(--red);font-size:9px;line-height:1">★</div>':""}</th>`;
  }).join("");

  const rows=crew.map(e=>{
    const cells=weeks.map(w=>{
      const wEnd=iso(addD(w,6));
      const r=db.timeOff.find(x=>x.empId===e.id&&x.status!=="declined"&&x.status!=="cancelled"&&x.start<=wEnd&&x.end>=w);
      const cls=r?(r.status==="approved"?"appr":r.status==="bid"?"bid":"pend"):"";
      return `<td class="bw"><div class="cellwrap">${r?`<div class="blk ${cls}" title="${esc(e.name)}: ${fmtShort(r.start)}–${fmtShort(r.end)} (${r.status})"></div>`:""}</div></td>`;
    }).join("");
    return `<tr><td class="bname"><span class="nm">${esc(e.name)}</span> ${e.keyTech?'<span class="key">Lead</span>':""}
      <div class="sm2">${yrs(e.hired)} yrs · since ${parse(e.hired).getFullYear()}</div></td>${cells}</tr>`;
  }).join("");

  const capRow=weeks.map(w=>{
    const {peak,peakKey}=weekLoad(w);
    const pct=Math.min(100,Math.round(peak/s.maxOffTotal*100));
    const cls=peak>=s.maxOffTotal?"full":peak>0?"mid":"";
    return `<td class="bw cap"><div class="capcell" title="${peak} off (cap ${s.maxOffTotal})${peakKey?" · "+peakKey+" lead":""}">
      <div class="capfill ${cls}" style="height:${Math.max(pct,4)}%"></div><div class="capnum">${peak||""}</div></div></td>`;
  }).join("");

  return `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat"><div class="n">${s.maxOffTotal}</div><div class="l">Crew off at once</div></div>
    <div class="stat"><div class="n">${s.maxKeyOff}</div><div class="l">Leads off at once</div></div>
    <div class="stat ${ph==="toAllocate"?"alert":""}"><div class="n">${bids.length}</div><div class="l">Bids waiting</div></div>
    <div class="stat ${pend.length?"alert":""}"><div class="n">${pend.length}</div><div class="l">To approve</div></div>
  </div>

  ${ph==="toAllocate"&&isManager?`<div class="banner b-warn"><span class="bi">▲</span>
    <div><b>Bidding closed ${fmt(s.bidDeadline)} — ${bids.length} requests to award</b>
    Allocation grants requests in order of length of service, skipping any that would break the caps above. You can run it as many times as you like; it recalculates from scratch each time.</div>
    <button class="btn pri" style="margin-left:auto;align-self:center" onclick="allocate()">Run allocation</button></div>`
   :ph==="toAllocate"?`<div class="banner b-warn"><span class="bi">▲</span>
    <div><b>Bidding closed ${fmt(s.bidDeadline)} — awaiting allocation</b>Trevor still needs to run the seniority allocation before this season's requests are final.</div></div>`:""}

  <div class="card" style="margin-bottom:16px">
    <div class="hd"><h3>Season board</h3><span class="sm2">${fmt(s.seasonStart)} – ${fmt(s.seasonEnd)}</span>
      <div style="margin-left:auto" class="btnrow">
        <button class="btn sm" onclick="openReq()">Request time off</button>
        <button class="btn sm" onclick="openCheck()">Check a date</button>
      </div></div>
    <div class="bd">
      <div class="board">
        <table>
          <thead><tr><th class="bname" style="text-align:left">Crew · by seniority</th>${head}</tr></thead>
          <tbody>${rows}
            <tr><td class="bname" style="background:#FBFBF9"><span class="eyebrow">Crew off</span></td>${capRow}</tr>
          </tbody>
        </table>
      </div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>Approved</span>
        <span><i style="background:#E3B23C"></i>Requested / bid</span>
        <span><i style="background:var(--red)"></i>Week at capacity</span>
        <span><span style="color:var(--red)">★</span> General holiday</span>
      </div>
    </div>
  </div>

  ${isManager&&bids.length?`<div class="card" style="margin-bottom:16px">
    <div class="hd"><h3>Bids — ranked by service</h3><span class="sm2">Order the allocation will use</span></div>
    <div class="bd tight"><table>
      <thead><tr><th style="width:34px">#</th><th>Employee</th><th>Service</th><th>Dates</th><th>Submitted</th><th></th></tr></thead>
      <tbody>${bids.slice().sort((a,b)=>{const A=emp(a.empId),B=emp(b.empId);
        if(A.hired!==B.hired)return A.hired<B.hired?-1:1;return a.submitted<b.submitted?-1:1;})
        .map((r,i)=>{const e=emp(r.empId);return `<tr>
        <td class="num" style="color:var(--muted);font-weight:700">${i+1}</td>
        <td><span class="nm">${esc(e.name)}</span> ${e.keyTech?'<span class="key">Lead</span>':""}${r.note?`<div class="sm2">${esc(r.note)}</div>`:""}</td>
        <td class="num">${yrs(e.hired)} yrs</td>
        <td class="num">${fmtShort(r.start)} – ${fmtShort(r.end)}<div class="sm2">${days(r.start,r.end)+1} days</div></td>
        <td class="num sm2">${fmtShort(r.submitted)}</td>
        <td style="text-align:right"><button class="btn sm" onclick="delReq('${r.id}')">Remove</button></td></tr>`;}).join("")}
      </tbody></table></div></div>`:""}

  ${isManager&&pend.length?`<div class="card" style="margin-bottom:16px">
    <div class="hd"><h3>Waiting on you</h3></div>
    <div class="bd tight"><table><tbody>${pend.map(r=>{
      const chk=checkRange(db,r.empId,r.start,r.end,r.id);
      return `<tr><td><span class="nm">${esc(empName(r.empId))}</span>
        <div class="sm2">${fmtShort(r.start)} – ${fmtShort(r.end)} · ${esc(r.type)}${r.note?" · "+esc(r.note):""}</div>
        ${chk.ok?'<span class="tag t-ok">Fits the schedule</span>':'<span class="tag t-red">Conflicts</span>'}</td>
        <td style="text-align:right" class="btnrow"><button class="btn sm ok" onclick="decide('${r.id}','approved')">Approve</button>
        <button class="btn sm" onclick="decide('${r.id}','declined')">Decline</button></td></tr>`;}).join("")}
    </tbody></table></div></div>`:""}

  <div class="card">
    <div class="hd"><h3>${isManager?"All requests":"Your requests"}</h3>
      ${isManager?`<div style="margin-left:auto"><select onchange="filters.to=this.value;render()" style="width:auto">
        <option value="">All statuses</option><option value="approved">Approved</option>
        <option value="bid">Bid</option><option value="pending">Pending</option><option value="declined">Declined</option>
      </select></div>`:""}</div>
    <div class="bd tight"><table>
      <thead><tr>${isManager?"<th>Employee</th>":""}<th>Dates</th><th>Type</th><th>Status</th><th>Note</th><th></th></tr></thead>
      <tbody>${db.timeOff.filter(r=>isManager?(!filters.to||r.status===filters.to):r.empId===me.id)
        .sort((a,b)=>a.start<b.start?-1:1).map(r=>{
        const tg={approved:"t-ok",bid:"t-grey",pending:"t-warn",declined:"t-red",cancelled:"t-grey"}[r.status]||"t-grey";
        return `<tr>${isManager?`<td class="nm">${esc(empName(r.empId))}</td>`:""}
          <td class="num">${fmtShort(r.start)} – ${fmtShort(r.end)}</td>
          <td>${esc(r.type)}</td>
          <td><span class="tag ${tg}">${esc(r.status)}</span></td>
          <td class="sm2">${esc(r.reason||r.note||"")}</td>
          <td style="text-align:right"><button class="btn sm" onclick="delReq('${r.id}')">Remove</button></td></tr>`;}).join("")
        ||`<tr><td colspan="${isManager?6:5}"><div class="empty"><div class="big">No requests yet</div></div></td></tr>`}
      </tbody></table></div>
  </div>`;
}

    <div id="r_live"></div>`,

function liveCheck(){
  const box=document.getElementById("r_live"); if(!box)return;
  const e=val("r_emp"), a=val("r_start"), b=val("r_end"), s=db.settings, ph=phase();
  if(!a||!b||b<a){box.innerHTML=`<div class="avail a-warn"><b>Pick your dates</b>The last day has to fall on or after the first.</div>`;return;}
  const notice=days(iso(today()),a);
  const chk=checkRange(db,e,a,b);
  let html="";
  if(ph!=="bidding"&&notice<s.noticeDays)
    html+=`<div class="avail a-warn"><b>Short notice</b>That's ${notice} days out; ${s.noticeDays} are normally required. It'll go through as a request for approval.</div>`;
  if(chk.ok)
    html+=`<div class="avail a-ok"><b>Those dates are open</b>${days(a,b)+1} days, no clash with anything already approved.</div>`;
  else
    html+=`<div class="avail a-no"><b>Not available</b>The schedule is already full on:
      <ul>${chk.conflicts.map(c=>`<li>${fmtShort(c.start)}${c.start!==c.end?" – "+fmtShort(c.end):""} — ${c.why} (${esc(c.who.join(", "))})</li>`).join("")}</ul></div>`;
  box.innerHTML=html;
}
function saveReq(){
  const e=val("r_emp"),a=val("r_start"),b=val("r_end");
  if(!e||!a||!b||b<a){toast("Check the dates first");return;}
  const ph=phase(), chk=checkRange(db,e,a,b);
  let status;
  if(ph==="bidding"&&a<=db.settings.seasonEnd&&b>=db.settings.seasonStart) status="bid";
  else if(!chk.ok){toast("Those dates are full — pick something else");return;}
  else status="pending";
  db.timeOff.push({id:uid(),empId:e,start:a,end:b,type:val("r_type"),status,
    submitted:iso(today()),note:val("r_note"),reason:""});
  modal=null; commit(status==="bid"?"Added to the bidding pool":"Request submitted for approval");
}

function go(v){ if(!isManager&&(v==="team"||v==="settings"))return; view=v;modal=null;window.scrollTo(0,0);render();}
function setS(k,v){ if(!isManager)return; db.settings[k]=v;commit();}
function del(coll,id){ if(!isManager)return; db[coll]=db[coll].filter(x=>x.id!==id);commit("Removed");}
function delReq(id){
  const r=db.timeOff.find(x=>x.id===id);
  if(!r)return;
  if(!isManager&&r.empId!==me.id){toast("That isn't your request");return;}
  db.timeOff=db.timeOff.filter(x=>x.id!==id);commit("Removed");
}
function decide(id,st){
  if(!isManager)return;
  const r=db.timeOff.find(x=>x.id===id);
  if(st==="approved"){
    const chk=checkRange(db,r.empId,r.start,r.end,r.id);
    if(!chk.ok&&!confirm("This overlaps time already approved. Approve anyway?"))return;
  }
  r.status=st; r.decidedAt=iso(today());
  commit(st==="approved"?"Approved":"Declined");
}
function allocate(){
  if(!isManager)return;
  if(!confirm("Award the summer schedule by seniority? Every bid is recalculated from scratch."))return;
  const res=runAllocation(db);
  commit(res.approved+" granted, "+res.declined+" declined");
}
function exportJSON(){
  if(!isManager)return;
  const b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="art-hr-hub-"+iso(today())+".json"; a.click();
  toast("Exported");
}
function importJSON(inp){
  if(!isManager)return;
  const f=inp.files[0]; if(!f)return;
  if(!confirm("This overwrites every list in SharePoint with the contents of this file — anything not in the file is deleted. Continue?")){ inp.value=""; return; }
  const r=new FileReader();
  r.onload=()=>{try{db=JSON.parse(r.result);commit("Imported");}catch(e){toast("That file wouldn't parse");}};
  r.readAsText(f);
}
function clearDemo(){
  if(!isManager)return;
  if(!confirm("Remove all sample data and start empty?"))return;
  const s=db.settings; s.demo=false;
  db={employees:[],timeOff:[],training:[],tools:[],toolLog:[],vehicles:[],service:[],incidents:[],
      policies:db.policies,acks:[],settings:s};
  commit("Cleared — add your crew on the Team page");
}

const NAV=[
  ["dash","Dashboard","▣"],["timeoff","Time off","◷"],["team","Team","☰"],
  ["training","Training","✦"],["tools","Tools","⚒"],["vehicles","Vehicles","▤"],
  ["safety","Safety","⚠"],["policies","Policies","§"],["positions","Positions","◆"],["settings","Settings","⚙"]
];
const TITLES={dash:["Dashboard","What needs you today"],timeoff:["Time off","Requests, coverage, and the summer schedule"],
  team:["Team","Roster, seniority, and emergency contacts"],training:["Training","Tickets, certifications, and expiries"],
  tools:["Tools","Sign-out register and inspections"],vehicles:["Vehicles","Service, odometers, and renewals"],
  safety:["Safety","Incident and near-miss log"],policies:["Policies","The handbook and who's signed it"],
  positions:["Positions","What each position is accountable for"],
  settings:["Settings","Rules, intervals, and your data"]};

function renderGate(){
  let inner;
  if(phaseAuth==="init"||phaseAuth==="loading"){
    inner=`<p>${phaseAuth==="loading"?"Loading your HR data from SharePoint…":"Connecting…"}</p>`;
  }else if(phaseAuth==="signedout"){
    inner=`<p>Sign in with your Advance Electronics Microsoft 365 account.</p>
      <button class="btn pri" onclick="signIn()">Sign in with Microsoft</button>`;
  }else if(phaseAuth==="bootstrap"){
    inner=`<p style="text-align:left">HR_Employees is empty — set up the first record for yourself as manager.
      Signed in as ${esc(authAccount&&authAccount.username)}.</p>
      <label class="f" style="text-align:left"><span class="lb">Your name</span><input type="text" id="bs_name"></label>
      <label class="f" style="text-align:left"><span class="lb">Role</span><input type="text" id="bs_role" placeholder="Owner"></label>
      <button class="btn pri" onclick="bootstrapSelf()">Create my record and continue</button>`;
  }else if(phaseAuth==="notyet"){
    inner=`<div class="banner b-warn" style="text-align:left"><span class="bi">▲</span><div>
      <b>Not open yet</b>The HR Hub is still being set up and isn't available to
      everyone yet. It opens to the full crew in the new year. Talk to Trevor if
      you need something in the meantime.</div></div>
      <div class="btnrow" style="justify-content:center;gap:9px">
        <a class="btn pri" href="index.html">← Back to ART Tools</a>
        <button class="btn" onclick="signOut()">Sign out</button>
      </div>`;
  }else if(phaseAuth==="nomatch"){
    inner=`<div class="banner b-red" style="text-align:left"><span class="bi">▲</span><div>
      <b>No matching employee record</b>Signed in as ${esc(authAccount&&authAccount.username)}, but no
      active row in HR_Employees has that email. Ask Trevor to add you to the Team list.</div></div>
      <button class="btn" onclick="signOut()">Sign out</button>`;
  }else{
    inner=`<div class="banner b-red" style="text-align:left"><span class="bi">▲</span><div><b>Something went wrong</b>${esc(authErr)}</div></div>
      <button class="btn pri" onclick="signIn()">Try again</button>`;
  }
  document.getElementById("root").innerHTML=`<div class="authgate"><div class="box">
    <div class="mark"><span class="art">ART</span><span class="sub">Advanced<br>Residential<br>Technology</span></div>
    <div class="hub">HR Hub</div>${inner}</div></div>`;
}

function render(){
  if(phaseAuth!=="ready"){ renderGate(); return; }
  const A=alerts();
  const nav=NAV.filter(([k])=>isManager||(k!=="team"&&k!=="settings"));
  if(!isManager&&(view==="team"||view==="settings")) view="dash";
  const pips={timeoff:(isManager?A.pending.length+(phase()==="toAllocate"?db.timeOff.filter(r=>r.status==="bid").length:0):0),
              training:A.certExp.length,vehicles:A.vehDue.length,policies:A.ackMissing.length};
  const body={dash:vDash,timeoff:vTimeOff,team:vTeam,training:vTraining,tools:vTools,
              vehicles:vVehicles,safety:vSafety,policies:vPolicies,positions:vPositions,
              settings:vSettings}[view]();
  const [t1,t2]=TITLES[view];
  document.getElementById("root").innerHTML=`
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark"><span class="art">ART</span>
        <span class="sub">Advanced<br>Residential<br>Technology</span></div>
        <div class="bar"></div><div class="hub">HR Hub</div></div>
      <nav>${nav.map(([k,l,i])=>`<button class="navb ${view===k?"on":""}" onclick="go('${k}')">
        <span class="ic">${i}</span>${l}${pips[k]?`<span class="pip">${pips[k]}</span>`:""}</button>`).join("")}</nav>
      <div class="sidefoot">${esc(me.name)}${isManager?' <span class="key">Manager</span>':""}
        <br>Synced with SharePoint · <a href="#" onclick="signOut();return false" style="color:inherit">Sign out</a>
        <br><a href="index.html" style="color:inherit">← All ART tools</a></div>
    </aside>
    <div class="main">
      <header class="top"><h1>${t1}</h1><span class="sub">${t2}</span><span class="sp"></span>
        <a class="btn" href="index.html">← All tools</a>
        <button class="btn dark" onclick="openReq()">Request time off</button></header>
      <div class="wrap">${body}</div>
    </div>
  </div>
  ${modal?`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">
      <div class="mh"><h3>${esc(modal.title)}</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="mb">${modal.body}</div><div class="mf">${modal.footer}</div></div></div>`:""}`;
}

/* ---------------- boot ---------------- */
render();
initMsal();
</script>
