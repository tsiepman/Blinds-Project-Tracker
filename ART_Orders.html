<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40; }
  .mark { background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 3px 7px; border-radius: 5px; }
  .hname { font-size: 14px; font-weight: 600; }
  .hname span { color: var(--text3); font-weight: 400; }
  .spacer { margin-left: auto; }
  .sp-status { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; display: none; }
  .sp-status.connected { display: inline; background: var(--green-dim); color: var(--green); }
  .sp-status.error { display: inline; background: var(--red-dim); color: var(--red); }
  .sp-status.loading { display: inline; background: var(--accent-dim); color: var(--accent); }
  .art-back { margin-left: 0; }

  p.page-sub { color: var(--text2); font-size: 13px; margin-bottom: 18px; }

  .controls { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
  label.fld { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 5px; font-weight: 600; }
  select, input { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 9px 11px; font-size: 14px; font-family: inherit; }
  .btn { background: var(--accent); color: var(--on-accent); border: none; border-radius: var(--radius); padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-ghost { background: var(--surface2); color: var(--text); }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .totals { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
  .tot { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; min-width: 120px; }
  .tot-n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tot-l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); font-weight: 600; }

  .tot.soon .tot-n { color: var(--yellow); }

  .vendor-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface2); cursor: pointer; flex-wrap: wrap; }
  .vendor-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .vendor-head .vendor-meta { margin-left: auto; }
  .vendor-name { font-size: 15px; font-weight: 700; }
  .vendor-meta { font-size: 12px; color: var(--text3); }

  .line:last-child { border-bottom: none; }
  .line.done { opacity: .45; }
  .line-main { flex: 1; min-width: 0; }
  .line-model { font-family: var(--mono); font-size: 13.5px; font-weight: 600; }
  .line-desc { font-size: 11.5px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jobs { margin-top: 6px; font-size: 11.5px; color: var(--text2); }

  .line-by { font-size: 11.5px; text-align: right; min-width: 7em; }
  .line-box { padding-top: 2px; }
  .line-box input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; display: inline-block; }
  .t-late { background: var(--accent-dim); color: var(--accent); }
  .t-soon { background: var(--yellow-dim); color: var(--yellow); }
  .t-ok { background: var(--surface2); color: var(--text3); }
  .t-none { background: var(--surface2); color: var(--text3); }
  .t-done { background: var(--green-dim); color: var(--green); }
  .jobs .had { color: var(--text3); }

  /* View switch */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { background: var(--bg); color: var(--text2); border: none; padding: 8px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--surface2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .seg button:focus-visible, .job-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* By-job catch-up view */
  .hint { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; color: var(--text2); line-height: 1.55; margin-bottom: 16px; }

  .lt { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden; }
  .lt-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; background: var(--surface2); }

  .lt-row .m { flex: 1 1 130px; min-width: 0; }
  .lt-row .w { width: 70px; text-align: right; }
  .lt-hint { font-size: 11.5px; color: var(--text3); line-height: 1.55; margin-bottom: 10px; }

  .line-num b { font-size: 14px; font-weight: 600; }
  .line-num b.dim { color: var(--text3); font-weight: 500; }

  .fix-hits .btn { justify-content: flex-start; text-align: left; }

  .centre { display: flex; align-items: center; justify-content: center; min-height: 70vh; }

<body>

<div class="header">
  <span class="mark">ART</span><span class="hname">Orders <span>purchasing</span></span>
  <span id="spStatus" class="sp-status"></span>
  <span class="spacer"></span>
  <a class="art-back" href="index.html">← All tools</a>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   ART Orders
   What to order, from whom, by when, for which jobs.

   Reads SchedProjects (written by the D-Tools sync) and LeadTimes.
   Ticking records what was ordered, per job, in OrderedLines --
   see "marking ordered" below.
   ============================================================ */

const TENANT_ID = '2e6ff905-d709-43db-94a5-c11d318118ee';
const CLIENT_ID = '7b0d92bf-6e34-497e-9938-7860ba268631';
const SITE_HOSTNAME = 'advanceelectronics.sharepoint.com';
const SITE_PATH = '/sites/ART43';
const SCOPES = ['https://graph.microsoft.com/Sites.ReadWrite.All', 'offline_access'];
const LIST = { projects: 'SchedProjects', lead: 'LeadTimes', ordered: 'OrderedLines', stock: 'StockSnapshot' };

// A supplier who is unreliable gets a longer lead time, not a longer buffer, so one
// global week is enough and there is no reason to vary it per vendor.
const BUFFER_WEEKS = 1;
const DEFAULT_LEAD_WEEKS = 2;

let msal_ = null, siteId = null, listIds = {};
let projects = [], leadTimes = [];
let ordered = new Map();            // "job|model" -> { id, qty } -- see "marking ordered"
let usingSample = false;
let horizonWeeks = 8;
let showCovered = false;          // lines fully covered by stock are hidden unless asked for
// Suppliers expanded on the By supplier view, remembered per browser.
let openVendors = (() => { try { return new Set(JSON.parse(localStorage.getItem('orders.openVendors') || '[]')); } catch { return new Set(); } })();
let vendorRefs = [];
let catalogVendors = [];         // every supplier in the D-Tools catalog, saved by the sync (StockSnapshot row "vendors")
let view = (() => { try { return localStorage.getItem('orders.view') === 'job' ? 'job' : 'supplier'; } catch { return 'supplier'; } })();
let jobSearch = '', openJobs = new Set(), busy = false;
let rowRefs = [], jobRefs = [];     // what the onclick indexes in the current render point at
const sessionDone = new Map();      // supplier rows ticked since the last load, kept visible so they can be unticked

/* ---------- auth / graph ---------- */

async function init() {
  if (location.search.includes('demo')) { loadSample(); render(); return; }
  msal_ = new msal.PublicClientApplication({
    auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: location.href.split('?')[0].split('#')[0] },
    cache: { cacheLocation: 'localStorage' }
  });
  await msal_.initialize();
  await msal_.handleRedirectPromise();
  if (!msal_.getAllAccounts().length) { renderSignIn(); return; }
  await load();
}

function signIn() { msal_.loginRedirect({ scopes: SCOPES }); }

async function token() {
  const a = msal_.getAllAccounts();
  if (!a.length) return null;
  try { return (await msal_.acquireTokenSilent({ scopes: SCOPES, account: a[0] })).accessToken; }
  catch { await msal_.acquireTokenRedirect({ scopes: SCOPES, account: a[0] }); return null; }
}

async function graph(method, path, body) {
  const t = await token();
  if (!t) return null;
  const res = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method,
    headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly' },
    ...(body ? { body: JSON.stringify(body) } : {})
  });
  if (!res.ok) throw new Error(method + ' ' + path + ' -> ' + res.status);
  return res.status === 204 ? null : res.json();
}

async function listId(name) {
  if (listIds[name]) return listIds[name];
  if (!siteId) siteId = (await graph('GET', '/sites/' + SITE_HOSTNAME + ':' + SITE_PATH)).id;
  listIds[name] = (await graph('GET', '/sites/' + siteId + '/lists/' + name)).id;
  return listIds[name];
}

async function items(name) {
  const lid = await listId(name);
  const out = [];
  let url = '/sites/' + siteId + '/lists/' + lid + '/items?expand=fields&$top=999';
  for (;;) {
    const d = await graph('GET', url);
    out.push(...(d.value || []));
    if (!d['@odata.nextLink']) break;
    url = d['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0', '');
  }
  return out;
}

function setStatus(cls, txt) { const e = document.getElementById('spStatus'); e.className = 'sp-status ' + cls; e.textContent = txt; }

async function load() {
  setStatus('loading', 'Loading…');
  try {
    const [pr, lt, od] = await Promise.all([
      items(LIST.projects),
      items(LIST.lead).catch(() => []),      // optional until populated
      items(LIST.ordered).catch(() => [])
    ]);
    projects = pr.map(i => i.fields || {});
    // Keep the SharePoint item id alongside the fields, or saving an edit would create
    // a duplicate row instead of updating the existing one.
    leadTimes = lt.map(i => ({ id: i.id, ...(i.fields || {}) }));
    ordered = new Map(od.filter(i => (i.fields || {}).LineKey)
      .map(i => [i.fields.LineKey, { id: i.id, qty: parseOrderedQty(i.fields.Title) }]));
    sessionDone.clear();
    try {
      const st = await items(LIST.stock);
      // The list holds two rows: "stock" (written here) and "vendors" (written by the sync).
      const vrow = st.find(i => (i.fields || {}).Title === 'vendors');
      if (vrow) { try { catalogVendors = JSON.parse(vrow.fields.DataJson || '[]'); } catch { catalogVendors = []; } }
      const srow = st.find(i => (i.fields || {}).Title !== 'vendors');
      if (srow) {
        const f = srow.fields || {};
        const saved = JSON.parse(f.DataJson || '{}');
        // v2 carries which products the report was checked against; older saves are a bare map.
        if (saved && saved.v >= 2) {
          stockMap = saved.m || {};
          stockModels = new Set(saved.models || []);
          stockUnknown = new Set(saved.unknown || []);
          stockOverrides = saved.overrides || {};
        }
        else { stockMap = saved || {}; stockModels = null; }
        stockAsOf = f.AsOf || '';
      }
    } catch (e) { /* list not created yet -- stock stays unloaded */ }
    usingSample = false;
    if (!projects.length) { loadSample(); }
    setStatus('connected', 'SharePoint');
  } catch (e) {
    setStatus('error', 'Error');
    if (!projects.length) loadSample();
    console.error(e);
  }
  render();
}

/* ---------- dates ---------- */

function parseD(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
function fmt(d) { return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }

/* ---------- lead times ----------
   Per vendor with overrides, because a supplier is not one number: Lutron shades run
   five weeks while a keypad from the same supplier is far quicker. Most specific match
   wins -- model, then category, then vendor, then the default. */

function leadWeeks(vendor, model, desc) {
  const v = String(vendor || '').trim().toLowerCase();
  let best = null, bestScore = -1;
  for (const r of leadTimes) {
    if (String(r.Vendor || '').trim().toLowerCase() !== v) continue;
    const m = String(r.Match || '').trim().toLowerCase();
    let score, ok;
    if (!m) { ok = true; score = 0; }                                    // whole vendor
    else {
      const hay = (String(model || '') + ' ' + String(desc || '')).toLowerCase();
      ok = hay.includes(m); score = 1 + m.length;                        // longer = more specific
    }
    if (ok && score > bestScore) { best = Number(r.Weeks); bestScore = score; }
  }
  return Number.isFinite(best) && best !== null ? best : DEFAULT_LEAD_WEEKS;
}

/* ---------- aggregation ----------
   One row per product across every job in the horizon, because you place one order per
   vendor, not one per job. The per-job split rides underneath so the number can be
   sanity-checked before it is keyed into a supplier's site. */

// Labour hours per crew-day on site -- the same figure as the sync and the project board.
const HOURS_PER_DAY = 13;
function estDays(p, phase) {
  const hours = Number(phase === 'roughIn' ? p.HoursRoughIn : p.HoursFinish);
  const h = hours > 0 ? hours : (Number(phase === 'roughIn' ? p.DaysRoughIn : p.DaysFinish) || 0) * 16;
  return h > 0 ? Math.max(1, Math.ceil(h / HOURS_PER_DAY)) : 0;
}
// Same task rules as the board: rough-in is Prewire or named for rough-in, everything else
// is finish, and "… Placeholder" tasks only count until a phase has a real task.
function taskPhaseOf(t) {
  const p = String(t.progress || '').trim().toLowerCase(), n = String(t.name || '').toLowerCase();
  return (p.startsWith('prewire') || p.startsWith('rough') || /rough|pre-?wire/.test(n)) ? 'roughIn' : 'finish';
}
function isPlaceholder(t) { return t.placeholder === true || /placeholder|tentative/i.test(String(t.name || '')); }

/* When a phase starts, for counting order-by dates back from it:
     real tasks        -> the first real task
     only a placeholder -> the placeholder's date
     nothing           -> rough-in on the project start; finish a week after rough-in
                          ends, rough-in's length coming from its quoted hours */
function phaseDate(p, phase) {
  let tasks = [];
  try { tasks = JSON.parse(p.TasksJson || '[]'); } catch {}
  const span = ph => {
    const ts = tasks.filter(t => t.start && taskPhaseOf(t) === ph).sort((a, b) => a.start.localeCompare(b.start));
    const real = ts.filter(t => !isPlaceholder(t));
    if (real.length) return { from: real[0].start, to: real.map(t => t.end || t.start).sort().pop() };
    if (ts.length) return { from: ts[0].start, to: iso(addDays(parseD(ts[0].start), Math.max(1, estDays(p, ph)) - 1)) };
    return null;
  };
  const rough = span('roughIn');
  if (phase === 'roughIn') return rough ? rough.from : (p.StartDate || null);
  const fin = span('finish');
  if (fin) return fin.from;
  const roughEnd = rough ? rough.to
    : p.StartDate ? iso(addDays(parseD(p.StartDate), Math.max(1, estDays(p, 'roughIn')) - 1)) : null;
  return roughEnd ? iso(addDays(parseD(roughEnd), 7)) : null;   // nominal gap between phases
}

// A job marked Completed in D-Tools has nothing left to buy, but it stays approved, so the
// sync still carries it. 74 of 125 approved jobs were Completed when this was added --
// left in, they would swamp the list with things already installed. Hidden here rather
// than in the sync so the list keeps the full history.
function isCompleted(p) { return String(p.Progress || '').trim().toLowerCase().startsWith('complete'); }

// A job's buyable lines. l.ordered is D-Tools' own ordered flag, unused today but honoured.
function linesOf(p) {
  try { return JSON.parse(p.OrderLinesJson || '[]').filter(l => l.model && !l.ordered); } catch { return []; }
}

function build() {
  const today = new Date();
  const horizonEnd = addDays(today, horizonWeeks * 7);
  const byKey = new Map();

  for (const p of projects) {
    if (isCompleted(p)) continue;
    for (const l of linesOf(p)) {
      // Only what is still unordered on THIS job counts. A change order that adds three
      // more of something already marked shows up as just those three.
      const need = Math.ceil(Number(l.qty) || 0);
      const lkey = lineKey(p, l);
      const have = Math.min(orderedQty(lkey), need);
      if (need - have <= 0) continue;
      const needBy = phaseDate(p, l.phase || 'finish');
      const key = (l.vendor || 'zz') + '|' + String(l.model).trim().toLowerCase();
      const row = byKey.get(key) ?? {
        key, model: l.model, desc: l.desc || '', vendor: l.vendor || '',
        // Where the vendor came from. 'project' means the item's frozen snapshot is in
        // use because the catalog has no vendor for this product — so it is a catalog
        // record worth fixing, and this line will change once you do.
        vendorSource: l.vendorSource || '',
        // Wire is measured in feet, not counted in pieces. A job with 33 Cat6 runs is
        // 3,245 ft, and ordering "33" of anything would be badly short.
        bulk: !!l.bulk,
        rq: l.rq || '', mfr: l.mfr || '',      // keys for matching a pasted RQ report
        cost: Number(l.cost) || 0, qty: 0, jobs: [], needBy: null, orderBy: null
      };
      row.qty += need - have;
      row.jobs.push({ name: p.ProjectName || p.ProjectNumber || '', qty: need - have, have, need, key: lkey, needBy });
      if (needBy && (!row.needBy || needBy < row.needBy)) row.needBy = needBy;
      byKey.set(key, row);
    }
  }

  const rows = [];
  for (const r of byKey.values()) {
    // Net off stock when a report has been pasted. Without one, order is the gross
    // requirement and the banner says so.
    r.stock = stockFor(r);
    r.order = r.stock === null ? r.qty : Math.max(0, r.qty - r.stock);
    if (r.needBy) {
      const wk = leadWeeks(r.vendor, r.model, r.desc);
      r.orderBy = iso(addDays(parseD(r.needBy), -((wk + BUFFER_WEEKS) * 7)));
      r.days = dayDiff(today, parseD(r.orderBy));
      r.urgency = r.days < 0 ? 'late' : r.days <= 7 ? 'soon' : 'ok';
      // Outside the horizon and not yet urgent -- leave it off.
      if (r.urgency === 'ok' && parseD(r.orderBy) > horizonEnd) continue;
    } else {
      r.urgency = 'none';                            // no dates on the job
    }
    rows.push(r);
  }

  const order = { late: 0, soon: 1, ok: 2, none: 3 };
  rows.sort((a, b) => order[a.urgency] - order[b.urgency] || String(a.orderBy || '').localeCompare(String(b.orderBy || '')) || a.model.localeCompare(b.model));
  return rows;
}

/* ---------- render ---------- */

function renderSignIn() {
  document.getElementById('app').innerHTML =
    '<div class="centre"><div class="card"><h2>ART Orders</h2>' +
    '<p>Sign in with your Advance Electronics account.</p>' +

function render() {
  const completedCount = projects.filter(isCompleted).length;
  const hidden = completedCount ? ' ' + completedCount + ' job' + (completedCount === 1 ? '' : 's') + ' marked Completed in D-Tools ' + (completedCount === 1 ? 'is' : 'are') + ' hidden.' : '';
  const switcher =
    '<div><label class="fld">View</label><div class="seg" role="tablist">' +
      '<button role="tab" aria-selected="' + (view === 'supplier') + '" class="' + (view === 'supplier' ? 'on' : '') + '" onclick="setView(\'supplier\')">By supplier</button>' +
      '<button role="tab" aria-selected="' + (view === 'job') + '" class="' + (view === 'job' ? 'on' : '') + '" onclick="setView(\'job\')">By job</button>' +
    '</div></div>';
  const head = (usingSample ? '<div class="banner">Sample data — the sync has not written to SharePoint yet</div>' : '') +
    '<div class="wrap"><h1 class="page">Orders</h1>';

  if (view === 'job') {
    document.getElementById('app').innerHTML = head +
      '<p class="page-sub">Every open job and what has been marked ordered on it.' + hidden + '</p>' +
      '<div class="controls">' + switcher +
        '<div style="flex:1 1 220px"><label class="fld" for="jobSearch">Find a job</label><input id="jobSearch" style="width:100%" placeholder="Number, name or client" value="' + esc(jobSearch) + '" oninput="setJobSearch(this.value)"></div>' +
        '<div style="align-self:flex-end"><button class="btn btn-ghost btn-sm" onclick="load()">Refresh</button></div>' +
      '</div>' + jobsView() + '</div>';
    return;
  }

  const built = build();
  // Stock on hand covers the whole need: nothing to buy, so it leaves the list and the
  // counts. Still viewable, because stock is shared across jobs and worth a glance.
  const covered = built.filter(r => r.stock !== null && r.order <= 0);
  const rows = showCovered ? built : built.filter(r => !(r.stock !== null && r.order <= 0));
  const toBuy = built.filter(r => !(r.stock !== null && r.order <= 0));
  const late = toBuy.filter(r => r.urgency === 'late');
  const soon = toBuy.filter(r => r.urgency === 'soon');
  // What is left to buy: net of stock once a report is loaded, the gross need before.
  const value = toBuy.reduce((n, r) => n + r.order * r.cost, 0);
  // Rows ticked since the last load stay on screen, greyed, so a mis-tick can be undone.
  const live = new Set(rows.map(r => r.key));
  const doneRows = [...sessionDone.values()].filter(d => !live.has(d.key));
  rowRefs = [];

  const vendors = new Map();
  for (const r of [...rows, ...doneRows]) {
    const v = r.vendor || '(no vendor set)';
    if (!vendors.has(v)) vendors.set(v, []);
    vendors.get(v).push(r);
  }
  const rankOf = { late: 0, soon: 1, ok: 2, none: 3 };
  // Vendors with something late float to the top.
  const vendorOrder = [...vendors.entries()].sort((a, b) => {
    const rank = g => Math.min(4, ...g.filter(r => !r.done).map(r => rankOf[r.urgency]));
    return rank(a[1]) - rank(b[1]) || a[0].localeCompare(b[0]);
  });

  vendorRefs = vendorOrder.map(([v]) => v);
  const body = vendorOrder.length ? vendorOrder.map(([v, g], vi) => {
    const open = g.filter(r => !r.done);
    const buy = open.filter(r => !(r.stock !== null && r.order <= 0));
    const val = buy.reduce((n, r) => n + r.order * r.cost, 0);
    const nLate = buy.filter(r => r.urgency === 'late').length, nSoon = buy.filter(r => r.urgency === 'soon').length;
    const isOpen = openVendors.has(v);
    // Collapsed by default so the whole week reads as one list of suppliers; the tags keep
    // anything overdue visible without opening it.
    return '<div class="vendor">' +
      '<div class="vendor-head" role="button" tabindex="0" aria-expanded="' + isOpen + '" onclick="toggleVendor(' + vi + ')" ' +
        'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleVendor(' + vi + ')}"' +
        (isOpen ? '' : ' style="border-bottom:none"') + '>' +
        '<span class="job-chev">' + (isOpen ? '▾' : '▸') + '</span>' +
        '<span class="vendor-name">' + esc(v) + '</span>' +
        (nLate ? '<span class="tag t-late">' + nLate + ' overdue</span>' : '') +
        (nSoon ? '<span class="tag t-soon">' + nSoon + ' this week</span>' : '') +
        '<span class="vendor-meta">' + buy.length + ' line' + (buy.length === 1 ? '' : 's') + ' · ~$' + Math.round(val).toLocaleString() +
        (g.length > open.length ? ' · ' + (g.length - open.length) + ' just marked' : '') + '</span></div>' +
      (isOpen ? [...open, ...g.filter(r => r.done)].map(lineHtml).join('') : '') + '</div>';
  }).join('') : '<div class="empty">Nothing to order in the next ' + horizonWeeks + ' weeks.</div>';

  document.getElementById('app').innerHTML = head +
    '<p class="page-sub">What upcoming jobs need, grouped by supplier, counted back from when each phase starts.' + hidden + '</p>' +
    // Said plainly and permanently, because a big number beside a tick box reads as
    // "buy this many" and these are gross requirements. Stock netting arrives with
    // QuickBooks; until then the shelf still needs checking.
    (stockAsOf ? '' :
      '<div style="background:var(--yellow-dim);color:var(--yellow);border-radius:var(--radius);padding:10px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.55">' +
      '<b>No stock report loaded — these are quantities the jobs need, not what to buy.</b> ' +
      'Paste an RQ inventory export below and they become order quantities.</div>') +
    '<div class="controls">' + switcher +
      '<div><label class="fld">Look ahead</label><select id="horizon" onchange="setHorizon(this.value)">' +
        [4, 8, 12, 26].map(w => '<option value="' + w + '"' + (w === horizonWeeks ? ' selected' : '') + '>' + w + ' weeks</option>').join('') +
      '</select></div>' +
      '<div style="align-self:flex-end;display:flex;gap:6px">' +
        '<button class="btn btn-ghost btn-sm" onclick="setAllVendors(true)">Expand all</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="setAllVendors(false)">Collapse all</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="load()">Refresh</button></div>' +
    '</div>' +
    '<div class="totals">' +
      tot('late', late.length, 'overdue') +
      tot('soon', soon.length, 'this week') +
      tot('', toBuy.length, 'lines to buy') +
      tot('', '$' + Math.round(value).toLocaleString(), stockAsOf ? 'est. cost to buy, after stock' : 'est. cost if all bought') +
      tot('', toBuy.filter(r => !r.vendor || r.vendorSource === 'project').length, 'vendor to fix') +
    '</div>' +
    (covered.length ? '<div style="margin:-6px 0 14px"><button class="btn btn-ghost btn-sm" onclick="toggleCovered()">' + (showCovered ? 'Hide' : 'Show') + ' ' + covered.length + ' line' + (covered.length === 1 ? '' : 's') + ' covered by stock</button></div>' : '') +
    stockPanel() + fixPanel(built) + leadPanel() + body + '</div>';
}

/* ---------- by job ----------
   For the one-time catch-up on jobs already underway, and afterwards for checking a
   single job. Rough-in is usually all bought by the time a job is installing while trim
   and shades are not, hence the two bulk buttons. */

function jobList() {
  const q = jobSearch.trim().toLowerCase();
  return projects.filter(p => !isCompleted(p))
    .map(p => {
      const lines = linesOf(p).map(l => {
        const need = Math.ceil(Number(l.qty) || 0), key = lineKey(p, l);
        return { ...l, need, key, have: Math.min(orderedQty(key), need), phase: l.phase === 'roughIn' ? 'roughIn' : 'finish' };
      }).filter(l => l.need > 0);
      return { p, lines, done: lines.filter(l => l.have >= l.need).length };
    })
    .filter(j => j.lines.length)
    .filter(j => !q || [j.p.ProjectNumber, j.p.ProjectName, j.p.Client].join(' ').toLowerCase().includes(q))
    .sort((a, b) => String(b.p.ProjectNumber || '').localeCompare(String(a.p.ProjectNumber || ''), undefined, { numeric: true }));
}

function jobsView() {
  const jobs = jobList();
  jobRefs = jobs;
  const untouched = jobs.filter(j => !j.lines.some(l => l.have > 0)).length;
  const full = jobs.filter(j => j.done === j.lines.length).length;
  return '<div class="hint"><b>Catching up on jobs already underway:</b> for each job, mark what has already been ordered or installed so it stays off the order list. ' +
    'Usually that is <b>Rough-in ordered</b>, then open the job and untick anything still to buy. Marks count for that job only — the same product on another job still shows up.</div>' +
    '<div class="totals">' + tot('', jobs.length, 'open jobs') + tot('soon', untouched, 'nothing marked yet') + tot('', full, 'fully marked') + '</div>' +
    (jobs.length ? jobs.map(jobCard).join('') : '<div class="empty">' + (jobSearch ? 'No open job matches "' + esc(jobSearch) + '".' : 'No open jobs with anything to order.') + '</div>');
}

function jobCard(j, i) {
  const open = openJobs.has(jobId(j.p));
  const total = j.lines.length;
  const rough = j.lines.filter(l => l.phase === 'roughIn');
  const roughDone = rough.length > 0 && rough.every(l => l.have >= l.need);
  const all = j.done === total;
  const touched = j.lines.filter(l => l.have > 0).length;   // includes part-marked lines
  const state = all ? '<span class="tag t-done">all marked</span>'
    : touched ? '<span class="tag t-soon">' + j.done + ' of ' + total + ' marked' + (touched > j.done ? ', ' + (touched - j.done) + ' part' : '') + '</span>'
    : '<span class="tag t-none">' + total + ' lines · none marked</span>';
  const btn = (label, fn, disabled) => '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();' + fn + '"' + (disabled || busy ? ' disabled' : '') + '>' + label + '</button>';

  let body = '';
  if (open) {
    const group = (phase, label) => {
      const ls = j.lines.map((l, n) => [l, n]).filter(([l]) => l.phase === phase);
      if (!ls.length) return '';
      return '<div class="job-phase">' + label + '</div>' + ls.map(([l, n]) => {
        const done = l.have >= l.need;
        const part = !done && l.have > 0 ? ' <span class="tag t-soon">' + qty(l.have, l.bulk) + ' of ' + qty(l.need, l.bulk) + ' marked</span>' : '';
        return '<div class="jl' + (done ? ' done' : '') + '">' +
          '<div class="line-box"><input type="checkbox" aria-label="' + esc(l.model) + ' ordered"' + (done ? ' checked' : '') + (busy ? ' disabled' : '') + ' onchange="jobLine(' + i + ',' + n + ',this.checked)"></div>' +
          '<div class="jl-main"><div class="line-model">' + esc(l.model) + part + '</div><div class="line-desc">' + esc(l.desc) + '</div></div>' +
          '<div class="jl-vendor">' + esc(l.vendor || 'no vendor') + '</div>' +
          '<div class="line-qty">' + qty(l.need, l.bulk) + '</div></div>';
      }).join('');
    };
    body = '<div class="job-body">' + group('roughIn', 'Rough-in') + group('finish', 'Finish & trim') + '</div>';
  }

  return '<div class="job' + (all ? ' all' : '') + '">' +
    '<div class="job-head" role="button" tabindex="0" aria-expanded="' + open + '" onclick="jobToggle(' + i + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();jobToggle(' + i + ')}">' +
      '<span class="job-chev">' + (open ? '▾' : '▸') + '</span>' +
      '<span class="job-num">' + esc(j.p.ProjectNumber || '') + '</span>' +
      '<span class="job-name">' + esc(j.p.ProjectName || '') + '</span>' +
      (j.p.Progress ? '<span class="tag t-ok">' + esc(j.p.Progress) + '</span>' : '') + state +
      '<span class="job-acts">' +
        btn('Rough-in ordered', 'jobMark(' + i + ',\'rough\')', !rough.length || roughDone) +
        btn('Everything ordered', 'jobMark(' + i + ',\'all\')', all) +
        (touched ? btn('Clear', 'jobClear(' + i + ')', false) : '') +
      '</span>' +
    '</div>' + body + '</div>';
}

function setView(v) { view = v; try { localStorage.setItem('orders.view', v); } catch {} render(); }

// Re-rendering replaces the input, so put focus and the caret back where they were.
function setJobSearch(v) {
  jobSearch = v; render();
  const el = document.getElementById('jobSearch');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}

function jobToggle(i) {
  const j = jobRefs[i]; if (!j) return;
  const id = jobId(j.p);
  openJobs.has(id) ? openJobs.delete(id) : openJobs.add(id);
  render();
}

async function jobMark(i, which) {
  const j = jobRefs[i]; if (!j) return;
  const pick = which === 'rough' ? j.lines.filter(l => l.phase === 'roughIn') : j.lines;
  if (await setMarks(pick.map(l => [l.key, l.need]))) {
    toast('✓ ' + (which === 'rough' ? 'Rough-in' : 'Everything') + ' marked ordered on ' + (j.p.ProjectNumber || 'the job'));
  }
  render();
}

async function jobClear(i) {
  const j = jobRefs[i]; if (!j) return;
  if (!confirm('Clear every ordered mark on ' + (j.p.ProjectNumber || 'this job') + '? Its lines go back on the order list.')) return;
  if (await setMarks(j.lines.filter(l => ordered.has(l.key)).map(l => [l.key, null]))) toast('Marks cleared on ' + (j.p.ProjectNumber || 'the job'));
  render();
}

async function jobLine(i, n, on) {
  const l = jobRefs[i] && jobRefs[i].lines[n]; if (!l) return;
  if (await setMarks([[l.key, on ? l.need : null]])) toast(on ? '✓ Marked ordered' : 'Unmarked');
  render();
}

/* Lead times, editable in place. Vendors are seeded from whatever is actually on the
   order list, so you never have to remember who you buy from -- the ones you have lines
   for are already there, with the default applied until you set one. */
// Suppliers on any open job, whatever the look-ahead. A lead time matters as soon as a
// supplier has something to buy, not only once it falls inside the next few weeks.
function openJobVendors() {
  const s = new Set();
  for (const p of projects) { if (isCompleted(p)) continue; for (const l of linesOf(p)) if (l.vendor) s.add(l.vendor); }
  return [...s].sort((a, b) => a.localeCompare(b));
}

function leadPanel() {
  const vendors = openJobVendors();
  const known = new Set(leadTimes.map(r => String(r.Vendor || '').trim().toLowerCase()));
  const missing = vendors.filter(v => !known.has(v.toLowerCase()));

  // Vendor is a picker, not free text. Typing "Sonace" would silently match nothing and
  // drop that supplier to the default lead time with no error shown — the worst kind of
  // bug, because the dates just come out wrong. Options are every supplier in the D-Tools
  // catalog (saved by the sync), so a supplier added there can be given a lead time
  // before anything from it is on a job.
  const vendorOpts = (cur) => {
    const seen = new Map();
    for (const v of [...catalogVendors, ...vendors, ...leadTimes.map(r => r.Vendor).filter(Boolean)]) {
      const k = String(v).trim().toLowerCase(); if (k && !seen.has(k)) seen.set(k, String(v).trim());
    }
    const all = [...seen.values()].sort((a, b) => a.localeCompare(b));
    return '<option value=""' + (cur ? '' : ' selected') + '>— pick a supplier —</option>' +
      all.map(v => '<option value="' + esc(v) + '"' + (String(cur || '').toLowerCase() === v.toLowerCase() ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
  };

  const editable = leadTimes.map((r, i) =>
    '<div class="lt-row">' +
    '<select class="v" onchange="ltSet(' + i + ',\'Vendor\',this.value)">' + vendorOpts(r.Vendor) + '</select>' +
    '<input class="m" value="' + esc(r.Match || '') + '" placeholder="all products" onchange="ltSet(' + i + ',\'Match\',this.value)">' +
    '<input class="w" type="number" min="0" step="0.5" value="' + esc(r.Weeks || '') + '" onchange="ltSet(' + i + ',\'Weeks\',this.value)">' +
    '<span style="font-size:12px;color:var(--text3)">weeks</span>' +
    '<button class="lt-del" title="Remove" onclick="ltDelete(' + i + ')">×</button>' +
    '</div>').join('');

  return '<div class="lt' + (ltOpen ? ' open' : '') + '">' +
    '<div class="lt-head" onclick="ltToggle()">' +
      '<span class="panel-title">Lead times</span>' +
      '<span class="vendor-meta">' + leadTimes.length + ' rule' + (leadTimes.length === 1 ? '' : 's') +
      (missing.length ? ' · ' + missing.length + ' supplier' + (missing.length === 1 ? '' : 's') + ' on default ' + DEFAULT_LEAD_WEEKS + 'wk' : '') + '</span>' +
      '<span class="spacer"></span><span style="color:var(--text3);font-size:12px">' + (ltOpen ? 'hide' : 'edit') + '</span>' +
    '</div>' +
    '<div class="lt-body">' +
      '<p class="lt-hint">Leave the middle box empty to cover everything from that supplier. Fill it to override — a Lutron row matching <b>shade</b> at 5 weeks, alongside a blank Lutron row at 2, gives shades the longer lead. The most specific match wins. A week of buffer is added on top of whatever you set.</p>' +
      editable +
      (missing.length ? '<p class="lt-hint" style="margin-top:10px">No rule yet, using the ' + DEFAULT_LEAD_WEEKS + '-week default: <b>' + missing.map(esc).join(', ') + '</b></p>' : '') +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost btn-sm" onclick="ltAdd()">Add a rule</button>' +
        (missing.length ? '<button class="btn btn-ghost btn-sm" onclick="ltAddMissing()">Add the ' + missing.length + ' missing supplier' + (missing.length === 1 ? '' : 's') + '</button>' : '') +
        '<button class="btn btn-sm" id="ltSave" onclick="ltSave()"' + (ltDirty ? '' : ' disabled') + '>Save</button>' +
      '</div>' +
    '</div></div>';
}

let ltOpen = false, ltDirty = false, ltDeleted = [];

/* ---------- stock, from a pasted RQ report ----------

   Not a daily chore -- you run the report when you sit down to order, which is a moment
   that actually happens. Pasted here rather than synced because RQ has no link worth
   building for the three months until QuickBooks takes over.

   The match uses the catalog's RQ SKU where it is trustworthy, falling back to the
   report's Manufacturer SKU. Roughly 90% of answers come out right: most products with
   no match genuinely have no stock, because the report only lists what you hold. */

let stockMap = {}, stockAsOf = '', stockOpen = false;
/* Products whose keys matched nothing in the report AND which have no RepairQ SKU in the
   catalog to match on. For those, "not in the report" cannot be read as "none held" --
   Sonos ARC Ultra sits in RQ as AVHASS001632 while the catalog offers only the part
   number "ARCUltraBlack". They show "?" instead of a wrong 0. */
let stockUnknown = new Set();
/* model -> report key, set by hand in the "couldn't match" panel and kept for good. */
let stockOverrides = {};
/* Every product in the report just loaded: {key, sku, name, qty}. Held in memory only --
   6,800 rows is far too much to save, and it is only needed to fix matches by hand right
   after a load. */
let stockIndex = [];
// Products (normalised model) that were on open jobs when the report was loaded. Only
// their stock is kept -- the full report is ~6,800 SKUs, too big to save -- so a product
// outside this set was never looked up and reads as unknown, not as zero. null = old save.
let stockModels = null;

function stockPanel() {
  const age = stockAsOf ? Math.floor((Date.now() - new Date(stockAsOf)) / 86400000) : null;
  const stale = age !== null && age >= 3;
  const label = stockAsOf
    ? 'as of ' + new Date(stockAsOf).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) +
      (age > 0 ? ' · ' + age + ' day' + (age === 1 ? '' : 's') + ' old' : '')
    : 'not loaded — quantities below are what the jobs need, not what to buy';

  return '<div class="stock' + (stale ? ' stale' : '') + (stockOpen ? ' open lt' : ' lt') + '">' +
    '<div class="lt-head" onclick="stockToggle()">' +
      '<span class="panel-title">Stock on hand</span>' +
      '<span class="vendor-meta">' + esc(label) + '</span>' +
      '<span class="spacer"></span><span style="color:var(--text3);font-size:12px">' + (stockOpen ? 'hide' : 'update') + '</span>' +
    '</div><div class="lt-body">' +
      '<p class="lt-hint">Export the <b>Inventory Listing</b> from RQ and choose the file — the .xls straight out of RQ works. ' +
      'Or open it in Excel, select all and paste below. ' +
      'Anything the report does not list is treated as zero, which is correct — it only lists what you hold.</p>' +
      '<div style="margin-bottom:10px"><label class="btn btn-sm" style="display:inline-block">Choose file…' +
        '<input type="file" accept=".xls,.xlsx,.csv,.txt" hidden onchange="stockFile(this)"></label></div>' +
      '<textarea id="stockPaste" rows="3" placeholder="…or paste the report here"></textarea>' +
      '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="stockLoad()">Use pasted text</button>' +
      (stockAsOf ? '<button class="btn btn-ghost btn-sm" onclick="stockClear()">Clear</button>' : '') + '</div>' +
    '</div></div>';
}

function stockToggle() { stockOpen = !stockOpen; render(); }

/* ---------- products the report couldn't be matched to ----------
   The catalog is the weak side: Sonos ARC Ultra has no RepairQ SKU on it, so nothing in
   the report can be found for it. Rather than call that zero, it shows "?" and lands
   here, where it can be pointed at the right RepairQ item once. The answer is saved with
   the stock, so it holds for every future report until someone clears it. */
let fixOpen = false, fixRefs = [], fixHits = {};

function fixPanel(rows) {
  if (!stockAsOf) return '';
  // Biggest first, by what it would cost to buy: nobody is going to work through 244
  // products, but the dozen worth real money are worth five minutes.
  const all = rows.filter(r => r.stock === null).sort((a, b) => (b.qty * b.cost) - (a.qty * a.cost));
  const q = fixFind.trim().toLowerCase();
  const found = q ? all.filter(r => (r.model + ' ' + r.desc).toLowerCase().includes(q)) : all;
  fixRefs = found.slice(0, 20);
  const overrides = Object.keys(stockOverrides);
  if (!all.length && !overrides.length) return '';
  const canSearch = stockIndex.length > 0;

  const row = (r, i) => {
    const hits = fixHits[i] || [];
    return '<div class="lt-row" style="align-items:flex-start">' +
      '<span style="flex:1 1 220px;min-width:0"><b>' + esc(r.model) + '</b>' +
        '<div class="mini">' + esc(r.desc || '') + '</div></span>' +
      (canSearch
        ? '<span style="flex:1 1 260px;min-width:0"><input id="fx' + i + '" placeholder="Search the RepairQ report" ' +
            'value="' + esc(fixQ[i] || '') + '" oninput="fixSearch(' + i + ',this.value)" style="width:100%">' +
            (hits.length ? '<div class="fix-hits">' + hits.map(h =>
              '<button class="btn btn-ghost btn-sm" onclick="fixPick(' + i + ',\'' + h.key + '\')">' +
              esc(h.name.slice(0, 54)) + ' <span class="sm2">' + esc(h.sku) + ' · ' + h.qty + ' held</span></button>').join('') + '</div>' : '') +
          '</span>'
        : '<span class="sm2" style="flex:1 1 200px">Load the report again to search it</span>') +
      '</div>';
  };

  return '<div class="lt' + (fixOpen ? ' open' : '') + '">' +
    '<div class="lt-head" onclick="fixToggle()">' +
      '<span class="panel-title">Couldn\'t match to stock</span>' +
      '<span class="vendor-meta">' + (all.length ? all.length + ' product' + (all.length === 1 ? '' : 's') + ' showing “?”' : 'all matched') +
        (overrides.length ? ' · ' + overrides.length + ' matched by hand' : '') + '</span>' +
      '<span class="spacer"></span><span style="color:var(--text3);font-size:12px">' + (fixOpen ? 'hide' : 'fix') + '</span>' +
    '</div><div class="lt-body">' +
      '<p class="lt-hint">These products have no RepairQ SKU in the D-Tools catalog, so nothing in the report can be found for them. ' +
      'That is why they show <b>?</b> rather than 0 — it isn\'t a claim that you hold none. Point one at the right RepairQ item and it is remembered for future reports. ' +
      'The lasting fix is to put the RepairQ SKU on the product in the D-Tools catalog.</p>' +
      '<div class="lt-row"><input id="fixFind" style="flex:1" placeholder="Filter these products" value="' + esc(fixFind) + '" oninput="setFixFind(this.value)">' +
        '<span class="sm2">' + (found.length > fixRefs.length ? 'showing the ' + fixRefs.length + ' biggest of ' + found.length : found.length + ' shown') +
        ', most expensive first</span></div>' +
      fixRefs.map(row).join('') +
      (overrides.length ? '<p class="lt-hint" style="margin-top:12px"><b>Matched by hand</b></p>' +
        overrides.map(m => '<div class="lt-row"><span style="flex:1">' + esc(m) + ' → <span class="sm2">' + esc(stockOverrides[m]) + '</span></span>' +
          '<button class="lt-del" title="Remove" onclick="fixClear(\'' + esc(m) + '\')">×</button></div>').join('') : '') +
    '</div></div>';
}

let fixQ = {}, fixFind = '';
function fixToggle() { fixOpen = !fixOpen; render(); }
function setFixFind(v) {
  fixFind = v; fixHits = {}; fixQ = {}; render();
  const el = document.getElementById('fixFind');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}
function fixSearch(i, q) {
  fixQ[i] = q;
  const needle = q.trim().toLowerCase();
  fixHits[i] = needle.length < 2 ? [] :
    stockIndex.filter(x => (x.name + ' ' + x.sku).toLowerCase().includes(needle)).slice(0, 6);
  render();
  const el = document.getElementById('fx' + i);
  if (el) { el.focus(); el.setSelectionRange(q.length, q.length); }
}
function fixPick(i, key) {
  const r = fixRefs[i]; if (!r) return;
  stockOverrides[norm(r.model)] = key;
  stockUnknown.delete(norm(r.model));
  // The saved stock only holds keys the products matched, so carry this one across too --
  // otherwise the match would read as zero until the next report is loaded.
  const hit = stockIndex.find(x => x.key === key);
  if (hit) stockMap[key] = hit.qty;
  fixQ[i] = ''; fixHits[i] = [];
  saveStock();
  toast('✓ ' + r.model + ' matched — ' + (stockMap[key] ?? 0) + ' in stock');
  render();
}
function fixClear(model) {
  delete stockOverrides[model];
  saveStock(); toast('Match removed'); render();
}
function stockClear() { stockMap = {}; stockModels = null; stockUnknown = new Set(); stockIndex = []; stockAsOf = ''; saveStock(); render(); }

// RQ exports a genuine old-format .xls, which a browser cannot read on its own. SheetJS
// can; it is ~900 KB, so it loads only when someone actually picks a spreadsheet.
let sheetJs = null;
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve();
  if (!sheetJs) sheetJs = new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok;
    s.onerror = () => { sheetJs = null; bad(new Error('the spreadsheet reader did not load — check the connection and try again')); };
    document.head.appendChild(s);
  });
  return sheetJs;
}

async function stockFile(input) {
  const file = input.files && input.files[0];
  input.value = '';                                   // so picking the same file again still fires
  if (!file) return;
  try {
    toast('Reading ' + file.name + '…');
    let text;
    if (/\.(csv|txt)$/i.test(file.name)) text = await file.text();
    else {
      await loadSheetJs();
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      text = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: '\t', RS: '\n', blankrows: false });
    }
    stockLoadText(text);
  } catch (e) { toast('Could not read ' + file.name + ': ' + e.message, true); }
}

// Excel copies as tab-separated; a saved .csv is comma-separated. Sniff rather than ask.
function parseDelimited(text) {
  const firstLine = text.slice(0, text.indexOf('\n') + 1 || text.length);
  const delim = firstLine.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function stockLoad() {
  const raw = document.getElementById('stockPaste').value.trim();
  if (!raw) { toast('Paste the report first', true); return; }
  stockLoadText(raw);
}

function stockLoadText(raw) {
  const rows = parseDelimited(raw);
  // The export carries a title and a date stamp before the real header, so find the
  // header rather than assuming it is first.
  const hIdx = rows.findIndex(r => r.some(c => c.trim().toLowerCase() === 'product sku'));
  if (hIdx < 0) { toast('No "Product SKU" column found — is that the inventory listing?', true); return; }
  const head = rows[hIdx].map(h => h.trim().toLowerCase());
  const cSku = head.indexOf('product sku'), cMfr = head.indexOf('manufacturer sku');
  const cStatus = head.indexOf('status'), cName = head.indexOf('product name');
  // RQ names the quantity differently per report: the Inventory Listing (one row per unit)
  // says "Quantity", the Inventory Availability Summary says "In Stock". Missing it used to
  // read every row as zero and save an empty stock list with no warning.
  const cQty = ['quantity', 'in stock', 'on hand', 'qty on hand', 'available', 'qty']
    .map(n => head.indexOf(n)).find(i => i >= 0) ?? -1;
  if (cQty < 0) { toast('Found "Product SKU" but no Quantity or In Stock column — is that an inventory report?', true); return; }

  const map = {};
  let used = 0;
  for (const r of rows.slice(hIdx + 1)) {
    if (cStatus >= 0 && (r[cStatus] || '').trim() && (r[cStatus] || '').trim().toLowerCase() !== 'in stock') continue;
    // Accounting format: the summary report shows oversold stock as "(20.00)".
    const rawQ = String(r[cQty] ?? '').trim();
    const q = (/^\(.*\)$/.test(rawQ) ? -1 : 1) * (parseFloat(rawQ.replace(/[^0-9.]/g, '')) || 0);
    if (q <= 0) continue;
    for (const idx of [cSku, cMfr]) {
      if (idx < 0) continue;
      const k = norm(r[idx]);
      if (k) { map[k] = (map[k] || 0) + q; used++; }
    }
  }
  if (!used) { toast('Found the header but no in-stock rows with a quantity', true); return; }

  // Keep only stock for products on open jobs. The whole report is too big to save
  // (~105,000 characters against the list's limit), and nothing else is ever looked up.
  const wanted = new Set(), models = new Set();
  for (const p of projects) {
    if (isCompleted(p)) continue;
    for (const l of linesOf(p)) {
      models.add(norm(l.model));
      for (const k of [l.rq, l.mfr, l.model]) { const n = norm(k); if (n) wanted.add(n); }
    }
  }
  // Keys matched by hand count as wanted too, or a saved match would be lost on the next load.
  for (const k of Object.values(stockOverrides)) if (k) wanted.add(k);
  const kept = {};
  for (const k of wanted) if (map[k] != null) kept[k] = map[k];

  // A product with no RepairQ SKU in the catalog, whose other keys match nothing in the
  // report, cannot be called zero -- we simply could not look it up.
  const unknown = new Set();
  for (const p of projects) {
    if (isCompleted(p)) continue;
    for (const l of linesOf(p)) {
      const model = norm(l.model);
      if (stockOverrides[model]) continue;
      const matched = [norm(l.rq), norm(l.mfr), model].some(k => k && map[k] != null);
      if (!matched && !norm(l.rq)) unknown.add(model);
    }
  }

  // Kept for this session only, so a mismatch can be pointed at the right RepairQ item.
  const index = new Map();
  for (const r of rows.slice(hIdx + 1)) {
    const sku = String(r[cSku] ?? '').trim();
    if (!sku) continue;
    const k = norm(sku);
    if (!index.has(k)) index.set(k, { key: k, sku, name: String(r[cName] ?? '').trim(), qty: 0 });
    index.get(k).qty = map[k] ?? index.get(k).qty;
  }
  stockIndex = [...index.values()].filter(x => x.qty > 0).sort((a, b) => a.name.localeCompare(b.name));

  stockMap = kept;
  stockModels = models;
  stockUnknown = unknown;
  stockAsOf = new Date().toISOString();
  saveStock();
  stockOpen = false;
  const held = build().filter(r => r.stock > 0).length;
  toast('✓ Stock loaded — ' + held + ' product' + (held === 1 ? ' on the list is' : 's on the list are') + ' on the shelf' +
    (unknown.size ? ' · ' + unknown.size + " couldn't be matched" : ''));
  render();
}

function norm(s) { return String(s ?? '').replace(/[^A-Za-z0-9]/g, '').toUpperCase(); }

// Catalog RQ SKU first (blank when shared across products and so meaningless), then the
// manufacturer part number against the report's Manufacturer SKU column.
function stockFor(r) {
  if (!stockAsOf) return null;
  const model = norm(r.model);
  // Matched by hand in the "couldn't match" panel: that answer wins.
  const ov = stockOverrides[model];
  if (ov) return stockMap[ov] ?? 0;
  // Not on an open job when the report was loaded, so never looked up: unknown, not zero.
  if (stockModels && !stockModels.has(model)) return null;
  for (const k of [norm(r.rq), norm(r.mfr), model]) {
    if (k && stockMap[k] != null) return stockMap[k];
  }
  // No usable key: "not in the report" would be a guess, so say so instead.
  if (stockUnknown.has(model)) return null;
  return 0;                       // has a RepairQ SKU and it isn't in the report: none held
}

async function saveStock() {
  if (usingSample) return;
  try {
    const lid = await listId(LIST.stock);
    const all = await items(LIST.stock);
    // Never truncate: a cut-off JSON string fails to parse on the next load and the stock
    // silently disappears. The filtering in stockLoadText keeps this well inside the limit.
    const data = JSON.stringify({ v: 3, m: stockMap, models: stockModels ? [...stockModels] : [],
      unknown: [...stockUnknown], overrides: stockOverrides });
    if (data.length > 60000) { toast('Stock is too large to save — it works until the page is reloaded', true); return; }
    const fields = { Title: 'stock', DataJson: data, AsOf: stockAsOf };
    const mine = all.find(i => (i.fields || {}).Title !== 'vendors');   // never overwrite the sync's supplier row
    if (mine) await graph('PATCH', '/sites/' + siteId + '/lists/' + lid + '/items/' + mine.id + '/fields', fields);
    else await graph('POST', '/sites/' + siteId + '/lists/' + lid + '/items', { fields });
  } catch (e) { console.warn('stock not saved:', e.message); }
}

function ltToggle() { ltOpen = !ltOpen; render(); }
function ltSet(i, field, val) { leadTimes[i][field] = val; ltDirty = true; render(); }
function ltAdd() { leadTimes.push({ Vendor: '', Match: '', Weeks: String(DEFAULT_LEAD_WEEKS) }); ltDirty = true; ltOpen = true; render(); }

function ltAddMissing() {
  const known = new Set(leadTimes.map(r => String(r.Vendor || '').trim().toLowerCase()));
  for (const v of openJobVendors()) {
    if (!known.has(v.toLowerCase())) leadTimes.push({ Vendor: v, Match: '', Weeks: String(DEFAULT_LEAD_WEEKS) });
  }
  ltDirty = true; ltOpen = true; render();
}

function ltDelete(i) {
  const r = leadTimes[i];
  if (r.id) ltDeleted.push(r.id);      // remove from SharePoint on save
  leadTimes.splice(i, 1);
  ltDirty = true; render();
}

async function ltSave() {
  if (usingSample) { ltDirty = false; toast('Sample mode — not saved'); render(); return; }
  try {
    const lid = await listId(LIST.lead);
    for (const id of ltDeleted) {
      await graph('DELETE', '/sites/' + siteId + '/lists/' + lid + '/items/' + id).catch(() => {});
    }
    ltDeleted = [];
    for (const r of leadTimes) {
      if (!String(r.Vendor || '').trim()) continue;         // skip blank rows
      const fields = { Title: r.Vendor, Vendor: r.Vendor, Match: r.Match || '', Weeks: String(r.Weeks || '') };
      if (r.id) await graph('PATCH', '/sites/' + siteId + '/lists/' + lid + '/items/' + r.id + '/fields', fields);
      else {
        const made = await graph('POST', '/sites/' + siteId + '/lists/' + lid + '/items', { fields });
        r.id = made.id;
      }
    }
    ltDirty = false;
    toast('✓ Lead times saved');
    render();
  } catch (e) { toast(e.message, true); }
}

function tot(cls, n, label) {
  return '<div class="tot ' + cls + '"><div class="tot-n">' + n + '</div><div class="tot-l">' + label + '</div></div>';
}

function lineHtml(r) {
  const done = !!r.done;
  const ref = rowRefs.push(r) - 1;
  const by = r.orderBy
    ? '<span class="tag t-' + r.urgency + '">' + (r.days < 0 ? Math.abs(r.days) + 'd late' : r.days === 0 ? 'today' : 'in ' + r.days + 'd') + '</span>' +
      '<div style="color:var(--text3);margin-top:3px">order by ' + fmt(parseD(r.orderBy)) + '</div>'
    : '<span class="tag t-none">no dates</span>';

  // this product, so it is a one-line catalog fix that then reaches every job.
  const stale = r.vendorSource === 'project'
    ? ' <span class="tag t-soon" title="Vendor came from this project, not the catalog — set it in the catalog and it fixes everywhere">catalog missing vendor</span>'
    : '';
  const cov = !done && r.stock !== null && r.order <= 0;
  return '<div class="line' + (done || cov ? ' done' : '') + '">' +
    '<div class="line-box"><input type="checkbox" aria-label="' + esc(r.model) + ' ordered"' + (done ? ' checked' : '') + (busy ? ' disabled' : '') + ' onchange="toggleRow(' + ref + ', this.checked)"></div>' +
    '<div class="line-main"><div class="line-model">' + esc(r.model) + stale + (done ? ' <span class="tag t-done">marked ordered</span>' : '') + (cov ? ' <span class="tag t-done">covered by stock</span>' : '') + '</div>' +
    '<div class="line-desc">' + esc(r.desc) + '</div>' +
    '<div class="jobs">' + r.jobs.map(j => '<div><span class="jq">' + qty(j.qty, r.bulk) + '</span><span>' + esc(j.name) +
      (j.have > 0 ? ' <span class="had">(' + qty(j.have, r.bulk) + ' already marked)</span>' : '') + '</span></div>').join('') + '</div></div>' +
    // Three plain numbers, because "have 12 / 16" read as a fraction to everyone who saw it.
    '<div class="line-num"><span class="lbl">in stock</span>' +
      (!stockAsOf ? '<b class="dim" title="No stock report loaded">—</b>'
        : r.stock === null ? '<b class="dim" title="Could not be matched to anything in the RepairQ report, so this is not a zero">?</b>'
        : '<b' + (r.stock > 0 ? '' : ' class="dim"') + '>' + qty(r.stock, r.bulk) + '</b>') + '</div>' +
    '<div class="line-num"><span class="lbl">needed</span><b>' + qty(r.qty, r.bulk) + '</b></div>' +
    '<div class="line-num order"><span class="lbl">to order</span><b>' + qty(r.stock === null ? r.qty : r.order, r.bulk) + '</b></div>' +
    '<div class="line-by">' + by + '</div></div>';
}

function setHorizon(w) { horizonWeeks = Number(w); render(); }
function toggleCovered() { showCovered = !showCovered; render(); }

function saveOpenVendors() { try { localStorage.setItem('orders.openVendors', JSON.stringify([...openVendors])); } catch {} }
function toggleVendor(i) {
  const v = vendorRefs[i]; if (v == null) return;
  openVendors.has(v) ? openVendors.delete(v) : openVendors.add(v);
  saveOpenVendors(); render();
}
function setAllVendors(open) {
  openVendors = open ? new Set(vendorRefs) : new Set();
  saveOpenVendors(); render();
}

/* ---------- marking ordered ----------
   One OrderedLines row per job per product:

     LineKey    "<D-Tools project id>|<model, lower case>"
     Title      the quantity marked ordered, e.g. "12"
     OrderedAt  when

   Per job, not per product. Keyed on the product alone, one tick would hide that product
   from every job forever, including jobs approved next month. And the quantity is kept
   so a change order that adds three more of something already marked shows those three,
   rather than nothing. Title carries it so the list needs no new column.

   Recorded in our own list for now. D-Tools has the right fields sitting unused
   (Order Status, Ordered Date, Order Number) but offers no item-level update endpoint --
   only a whole-project publish, and whether a partial publish merges or replaces has
   never been established. With the catalog the stakes were a stock number; here they
   would be a live quote. So: record safely, test the write-back on a throwaway project,
   then switch. */

function jobId(p) { return String(p.ProjectId || p.ProjectNumber || p.ProjectName || ''); }
function lineKey(p, l) { return jobId(p) + '|' + String(l.model || '').trim().toLowerCase(); }
function orderedQty(key) { const o = ordered.get(key); return o ? o.qty : 0; }
// A row with no number in Title means "ordered, quantity unknown" -- treat it as all of it.
function parseOrderedQty(t) { const n = parseFloat(t); return Number.isFinite(n) ? n : Infinity; }

// Supplier view: a tick marks the product ordered on every job listed under it.
async function toggleRow(i, on) {
  const r = rowRefs[i]; if (!r) return;
  if (on) {
    const prev = r.jobs.map(j => [j.key, ordered.has(j.key) ? ordered.get(j.key).qty : null]);
    if (await setMarks(r.jobs.map(j => [j.key, j.need]))) {
      sessionDone.set(r.key, { ...r, done: true, prev });
      toast('✓ Marked ordered' + (r.jobs.length > 1 ? ' on ' + r.jobs.length + ' jobs' : ''));
    }
  } else {
    const d = sessionDone.get(r.key); if (!d) return;
    if (await setMarks(d.prev)) { sessionDone.delete(r.key); toast('Unmarked'); }
  }
  render();
}

/* Apply [key, qty] changes; qty null removes the mark. Sent through Graph's $batch, 20
   requests at a time, because "Everything ordered" on a 70-line job is 70 writes and
   one request each would take long enough to look broken. */
async function setMarks(changes) {
  changes = changes.filter(([k, q]) => {
    const cur = ordered.get(k);
    return q === null ? !!cur : !(cur && cur.qty === q);
  });
  if (!changes.length) return true;
  if (usingSample) {
    for (const [k, q] of changes) q === null ? ordered.delete(k) : ordered.set(k, { id: null, qty: q });
    return true;
  }
  if (busy) { toast('Still saving the last change — try again in a moment', true); return false; }
  busy = true;
  setStatus('loading', 'Saving…');
  let failed = 0;
  try {
    const lid = await listId(LIST.ordered);
    const base = '/sites/' + siteId + '/lists/' + lid + '/items';
    const now = new Date().toISOString();
    const json = { 'Content-Type': 'application/json' };
    const reqs = changes.map(([k, q], n) => {
      const cur = ordered.get(k);
      if (q === null) return { id: String(n), method: 'DELETE', url: base + '/' + cur.id };
      if (cur && cur.id) return { id: String(n), method: 'PATCH', url: base + '/' + cur.id + '/fields', headers: json, body: { Title: String(q), OrderedAt: now } };
      return { id: String(n), method: 'POST', url: base, headers: json, body: { fields: { Title: String(q), LineKey: k, OrderedAt: now } } };
    });
    for (let s = 0; s < reqs.length; s += 20) {
      const res = await graph('POST', '/$batch', { requests: reqs.slice(s, s + 20) });
      if (!res) return false;                        // redirecting to sign in
      for (const r of res.responses || []) {
        const [k, q] = changes[Number(r.id)];
        if (r.status >= 200 && r.status < 300) {
          if (q === null) ordered.delete(k);
          else ordered.set(k, { id: (r.body && r.body.id) || (ordered.get(k) || {}).id, qty: q });
        } else failed++;
      }
    }
  } catch (e) {
    setStatus('error', 'Error');
    toast(e.message, true);
    return false;
  } finally {
    busy = false;
  }
  setStatus('connected', 'SharePoint');
  if (failed) { toast(failed + ' of ' + changes.length + ' did not save — press Refresh, then try again', true); return false; }
  return true;
}

let toastTimer = null;
function toast(m, bad) {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'toast show ' + (bad ? 'bad' : 'good');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 2600);
}

/* Wire reads in feet, everything else in pieces. D-Tools has no purchase-unit
   conversion to offer — Order UOM and Order UOM Units are empty on all 49 bulk
   products — so feet is the honest number and you convert to boxes yourself.
   Populate those two catalog fields and this can show boxes instead. */
function qty(n, bulk) {
  const v = Math.ceil(Number(n) || 0);
  return bulk ? v.toLocaleString() + '<span style="font-size:.6em;font-weight:600;color:var(--text3)"> ft</span>' : String(v);
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- sample ----------
   Shown only when SchedProjects is empty, and banner-marked. Shapes taken from the real
   Harris Home and Fleetwood jobs. */
