name: Inventory sync

on:
  schedule:
    # Every 2 hours, matching SI's catalog pull interval. Syncing more often than SI
    # pulls just queues messages that pile up behind each other.
    - cron: '15 */2 * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit state.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh SI product Id map
        env:
          DTOOLS_API_KEY: ${{ secrets.DTOOLS_API_KEY }}
        run: node sync.mjs --harvest

      - name: Sync inventory
        env:
          DTOOLS_API_KEY: ${{ secrets.DTOOLS_API_KEY }}
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REFRESH_TOKEN: ${{ secrets.QBO_REFRESH_TOKEN }}
          QBO_REALM_ID: ${{ secrets.QBO_REALM_ID }}
          # Until QuickBooks exists, set repository variable USE_STUB to 1.
          # sync.mjs refuses to publish stub quantities, so this stays a safe no-op
          # run until real QBO credentials are in place.
          USE_STUB: ${{ vars.USE_STUB }}
        run: node sync.mjs

      # state.json records the last quantities published so the next run only sends
      # what actually changed. Without persisting it, every run republishes everything.
      - name: Persist sync state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json product-ids.json
          git diff --staged --quiet || git commit -m "Update sync state [skip ci]"
          git push
