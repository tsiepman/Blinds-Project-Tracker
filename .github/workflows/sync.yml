name: Project board sync

on:
  schedule:
    # Every 20 minutes during working hours, Winnipeg (UTC-5 CDT / UTC-6 CST).
    # The board is a working-hours tool, and there is nothing to refresh overnight.
    # Off the hour on purpose: GitHub delays or drops scheduled runs at :00 when it is busy.
    - cron: '7,27,47 12-23 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report what would change, write nothing'
        type: boolean
        default: true
      catalog_report:
        description: 'Catalog report — cleanup worklist and the QuickBooks item list, as downloadable CSVs'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Anthropic's SDK, for summarising installer write-ups. Installed fresh each run so
      # the repository needs no package.json. If this ever fails, the sync still runs --
      # notes are saved and matched, just without summaries.
      - name: Install the Claude SDK
        run: npm install --no-save @anthropic-ai/sdk
        continue-on-error: true

      - name: Sync D-Tools projects to SharePoint
        env:
          DTOOLS_API_KEY: ${{ secrets.DTOOLS_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional repository variable: claude-sonnet-5 or claude-haiku-4-5 to spend less.
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          # Stock push into the D-Tools catalog. Set the repository variable
          # STOCK_PUSH_LIMIT to 1 for the first real run, check that product in SI, then
          # delete the variable to let the rest go. STOCK_PUSH_FORCE re-sends a report
          # that has already been pushed.
          STOCK_PUSH_LIMIT: ${{ vars.STOCK_PUSH_LIMIT }}
          STOCK_PUSH_FORCE: ${{ vars.STOCK_PUSH_FORCE }}
          # STOCK_PUSH_PROBE=<model> writes 111/222/333 to that one product, to prove which
          # CustomField each label in SI actually is. The three below then record the answer.
          STOCK_PUSH_PROBE: ${{ vars.STOCK_PUSH_PROBE }}
          # Models still in the catalog feed that no longer exist in SI, comma-separated.
          # They hold RepairQ SKUs hostage from live products; CS-206 is the known one.
          CATALOG_IGNORE: ${{ vars.CATALOG_IGNORE }}
          # Who owns a RepairQ SKU two live products share: "SKU=Model, SKU=Model".
          CATALOG_SKU_OWNER: ${{ vars.CATALOG_SKU_OWNER }}
          # QuickBooks Online. The client id is not a secret but this repo is public, so it
          # is a variable rather than something committed. The refresh token is NOT here:
          # it rotates on every use and lives in the SyncConfig list where the sync can
          # write it back. QBO_ENV is 'sandbox' until the real books are ready.
          QBO_CLIENT_ID: ${{ vars.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_ENV: ${{ vars.QBO_ENV }}
          STOCK_FIELD_STOCK: ${{ vars.STOCK_FIELD_STOCK }}
          STOCK_FIELD_COMMITTED: ${{ vars.STOCK_FIELD_COMMITTED }}
          STOCK_FIELD_ONORDER: ${{ vars.STOCK_FIELD_ONORDER }}
          # Reads the whole catalog, so it only runs when asked for. Empty on a scheduled
          # run, which is what keeps it off the twenty-minute tick.
          CATALOG_REPORT: ${{ inputs.catalog_report }}
          # Set to 01/01/2027 for the live item import, so Inventory rows load at quantity
          # zero and the closing stocktake sets the real figures. Unset leaves both the
          # quantity and the date blank, which is what you want while only reading the data.
          CATALOG_QTY_AS_OF: ${{ vars.CATALOG_QTY_AS_OF }}
          # How far back catalog-recent.csv looks, in days. Default 7 — the weekly check.
          CATALOG_NEW_DAYS: ${{ vars.CATALOG_NEW_DAYS }}
          # TASK_SHAPE=true prints the field names on one task record, once, to find out
          # whether site notes come down the API or only as email. Set it, let a run go,
          # read the log, delete it again.
          TASK_SHAPE: ${{ vars.TASK_SHAPE }}
        # Scheduled runs have no inputs, so this is empty and they always write.
        run: node sync.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # always(), because the report is most wanted on a run that failed for some unrelated
      # reason -- an unposted QuickBooks token should not cost you the worklist.
      - name: Upload the catalog report
        if: ${{ always() && inputs.catalog_report }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-report
          path: catalog-report/
          if-no-files-found: warn
